<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Online Voting | Pwllheli Business Improvement District</title>

  <meta
    name="description"
    content="Vote on proposals for the Business Improvement District in Pwllheli."
  >

  <meta name="theme-color" content="#0a1a3e">

  <link
    rel="icon"
    href="https://www.threetwosix.co.uk/thirdcrossing/icon.svg"
    type="image/svg+xml"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../style.css">

  <style>
    body {
      background-color: #fcf4ed;
      color: #0a1a3e;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }

    /* Language Toggle Container */
    .lang-toggle {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 20px;
      position: relative;
    }

    .lang-toggle button {
      background: #0a1a3e;
      color: #ffffff;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      padding: 10px 20px;
      border: 2px solid #0a1a3e;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .lang-toggle button.active {
      background: #fcf4ed;
      color: #0a1a3e;
      border-color: #0a1a3e;
    }

    .lang-toggle > button:first-child {
      border-right: none;
    }

    .comments-page {
      text-align: center;
    }

    .comments-page-tag {
      text-decoration: none;
      color: #0a1a3e;
      font-weight: 700;
    }

    .comments-heading {
      color: #0a1a3e;
      margin-top: 0.5rem;
    }

    .comments-form {
      max-width: 760px;
      margin: 0 auto;
      text-align: left;
    }

    .comments-form input,
    .comments-form textarea {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #0a1a3e;
      border-radius: 3px;
      background: #ffffff;
      color: #0a1a3e;
      font-family: inherit;
      font-size: 1rem;
    }

    .comments-form input {
      min-height: 52px;
      padding: 12px 14px;
    }

    .comments-form textarea {
      padding: 14px;
      resize: vertical;
    }

    .comments-form input:focus,
    .comments-form textarea:focus {
      outline: 3px solid rgba(10, 26, 62, 0.2);
      outline-offset: 2px;
    }

    .comments-form .form-group {
      margin-bottom: 1.5rem;
    }

    .comments-privacy-note {
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .comments-form .btn-large {
      width: auto;
      background-color: #0a1a3e;
      color: #ffffff;
      padding: 12px 24px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
    }

    #status {
      min-height: 1.5rem;
      margin: 1rem 0;
    }

    /* Voting options styling */
    .voting-fieldset {
      border: 2px solid #0a1a3e;
      padding: 20px;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      background: #ffffff;
    }

    .voting-legend {
      font-weight: 900;
      color: #0a1a3e;
      font-size: 1.1rem;
      padding: 0 10px;
    }

    .vote-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-top: 10px;
      background: #fcf4ed;
      border: 1px solid #0a1a3e;
      border-radius: 4px;
      font-weight: 700;
      color: #0a1a3e;
      cursor: pointer;
    }

    .vote-option input {
      width: 20px;
      height: 20px;
      accent-color: #0a1a3e;
      cursor: pointer;
    }

    /* Footer */
    .site-footer {
      font-size: 12px;
      text-align: center;
      padding: 20px;
      color: #ffffff;
      background: #0a1a3e;
      letter-spacing: 0.5px;
      line-height: 1.5;
    }

    .site-footer a {
      color: #ffffff;
      text-decoration: underline;
    }

    .site-footer a:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <main>

    <section class="form-section">

      <div class="container form-container comments-page">

        <!-- Language Toggle -->
        <div class="lang-toggle">
          <button type="button" id="lang-cy" onclick="setLanguage('cy')">CY</button>
          <button type="button" id="lang-en" class="active" onclick="setLanguage('en')">EN</button>
        </div>

        <!-- Clickable BID header -->
        <a
          class="tag menai-volunteer-tag comments-page-tag pwllheli-tag"
          href="https://pwllheli-bid.org.uk/"
          id="bid-header-link"
          aria-label="Return to Pwllheli Business Improvement District homepage"
        >
          PWLLHELI BUSINESS IMPROVEMENT DISTRICT
        </a>

        <!-- Page heading -->
        <h1 class="comments-heading" id="main-heading">
          CONSULTATION
        </h1>

        <!-- Voting Form -->
        <form
          id="voting-form"
          class="volunteer-form comments-form"
        >

          <p class="form-hint comments-privacy-note" id="form-desc">
            Please enter your details below if you wish, and choose your vote.
          </p>

          <div class="form-group">
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Name"
              aria-label="Name"
              autocomplete="name"
            >
          </div>

          <div class="form-group">
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              aria-label="Email"
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="Phone Number"
              aria-label="Phone Number"
              autocomplete="tel"
            >
          </div>

          <fieldset class="voting-fieldset">
            <legend class="voting-legend" id="vote-legend">Do you support a Business Improvement District for Pwllheli?</legend>

            <label class="vote-option">
              <input type="radio" name="vote" value="yes" required>
              <span id="vote-yes">YES</span>
            </label>

            <label class="vote-option">
              <input type="radio" name="vote" value="no" required>
              <span id="vote-no">NO</span>
            </label>
          </fieldset>

          <p
            id="status"
            class="error-message"
            role="status"
            aria-live="polite"
          ></p>

          <button
            class="btn primary btn-large"
            id="submit-button"
            type="submit"
          >
            CONFIRM
          </button>

        </form>

      </div>

    </section>

  </main>

  <footer class="site-footer">
    <div>
      <a href="https://threetwosix.co.uk/beta/tarian" target="_blank" rel="noopener">
        PROMOTED BY 326 ELECTORAL SERVICES, PWLLHELI, GWYNEDD.
      </a>
    </div>
  </footer>

  <script>
    const translations = {
      en: {
        title: "Online Voting | Pwllheli Business Improvement District",
        header: "PWLLHELI BUSINESS IMPROVEMENT DISTRICT",
        heading: "CONSULTATION",
        desc: "Please enter your details below if you wish, and choose your vote.",
        namePlaceholder: "Name",
        emailPlaceholder: "Email",
        phonePlaceholder: "Phone Number",
        legend: "Do you support a Business Improvement District for Pwllheli?",
        yes: "YES",
        no: "NO",
        confirm: "CONFIRM",
        successMsg: "Thank you for voting. Your vote has been recorded.",
        errorMsg: "There was a problem. Please try again.",
        unavailableMsg: "Service unavailable. Please try again later.",
        bidLinkAria: "Return to Pwllheli Business Improvement District homepage"
      },
      cy: {
        title: "Pleidleisio Ar-lein | Ardal Gwella Busnes Pwllheli",
        header: "ARDAL GWELLA BUSNES PWLLHELI",
        heading: "YMGYNGHORIAD",
        desc: "Rhowch eich manylion isod os dymunwch, a dewiswch eich pleidlais.",
        namePlaceholder: "Enw",
        emailPlaceholder: "E-bost",
        phonePlaceholder: "Rhif Ffôn",
        legend: "Ydych chi'n cefnogi Ardal Gwella Busnes ar gyfer Pwllheli?",
        yes: "YDY",
        no: "NAC YDY",
        confirm: "CADARNHAU",
        successMsg: "Diolch am bleidleisio. Cafodd eich pleidlais ei chofnodi.",
        errorMsg: "Roedd yna broblem. Rhowch gynnig arall arni.",
        unavailableMsg: "Gwasanaeth ddim ar gael. Rhowch gynnig arall arni yn hwyrach.",
        bidLinkAria: "Dychwelyd i dudalen gartref Ardal Gwella Busnes Pwllheli"
      }
    };

    let currentLang = "en";

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;

      document.getElementById("lang-cy").classList.toggle("active", lang === "cy");
      document.getElementById("lang-en").classList.toggle("active", lang === "en");

      const t = translations[lang];
      document.title = t.title;
      document.getElementById("bid-header-link").textContent = t.header;
      document.getElementById("bid-header-link").setAttribute("aria-label", t.bidLinkAria);
      document.getElementById("main-heading").textContent = t.heading;
      document.getElementById("form-desc").textContent = t.desc;

      const nameInput = document.getElementById("name");
      nameInput.placeholder = t.namePlaceholder;
      nameInput.setAttribute("aria-label", t.namePlaceholder);

      const emailInput = document.getElementById("email");
      emailInput.placeholder = t.emailPlaceholder;
      emailInput.setAttribute("aria-label", t.emailPlaceholder);

      const phoneInput = document.getElementById("phone");
      phoneInput.placeholder = t.phonePlaceholder;
      phoneInput.setAttribute("aria-label", t.phonePlaceholder);

      document.getElementById("vote-legend").textContent = t.legend;
      document.getElementById("vote-yes").textContent = t.yes;
      document.getElementById("vote-no").textContent = t.no;
      document.getElementById("submit-button").textContent = t.confirm;
    }

    const form = document.getElementById("voting-form");
    const submitButton = document.getElementById("submit-button");
    const status = document.getElementById("status");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      submitButton.disabled = true;
      status.textContent = "";

      const data = {
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        vote: document.querySelector('input[name="vote"]:checked').value,
        submission_type: "vote"
      };

      try {
        const response = await fetch("https://tendring-contact.twells-tet.workers.dev", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success || response.ok) {
          status.textContent = translations[currentLang].successMsg;
          status.style.color = "#0a1a3e";
          form.reset();
        } else {
          status.textContent = result.error || translations[currentLang].errorMsg;
          status.style.color = "#0a1a3e";
        }
      } catch (error) {
        status.textContent = translations[currentLang].unavailableMsg;
        status.style.color = "#0a1a3e";
        console.error(error);
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>

</body>

</html>
