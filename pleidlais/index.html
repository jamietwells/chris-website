<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CONSULTATION | Pwllheli Business Improvement District</title>

  <meta
    name="description"
    content="Vote on proposals for the Business Improvement District in Pwllheli."
  >

  <meta name="theme-color" content="#0a1a3e">

  <link
    rel="icon"
    href="https://www.threetwosix.co.uk/thirdcrossing/icon.svg"
    type="image/svg+xml"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../style.css">

  <style>
    body {
      background-color: #fcf4ed;
      color: #0a1a3e;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }

    /* Language Toggle Container */
    .lang-toggle {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 20px;
      position: relative;
    }

    .lang-toggle button {
      background: #fcf4ed;
      color: #0a1a3e;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      padding: 10px 20px;
      border: 2px solid #0a1a3e !important;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .lang-toggle button.active {
      background: #0a1a3e;
      color: #ffffff;
      border-color: #0a1a3e !important;
    }

    .lang-toggle > button:first-child {
      border-right: none;
    }

    .comments-page {
      text-align: center;
    }

    /* Tan background for header and consultation boxes */
    .comments-page-tag {
      display: inline-block;
      text-decoration: none;
      color: #0a1a3e;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      border: 2px solid #0a1a3e !important;
      padding: 15px 25px;
      background: #fcf4ed;
    }

    .heading-box {
      display: inline-block;
      border: 2px solid #0a1a3e !important;
      padding: 15px 35px;
      background: #fcf4ed;
      margin-bottom: 1.5rem;
    }

    .comments-heading {
      color: #0a1a3e;
      margin: 0;
      font-size: 2.2rem;
      font-weight: 900;
      text-align: center !important;
      letter-spacing: 1px;
    }

    .comments-form {
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
    }

    .comments-form input,
    .comments-form textarea {
      box-sizing: border-box;
      width: 100%;
      border: 2px solid #0a1a3e !important;
      border-radius: 4px;
      background: #ffffff;
      color: #0a1a3e;
      font-family: inherit;
      font-size: 1rem;
      text-align: center;
    }

    .comments-form input {
      min-height: 52px;
      padding: 12px 14px;
    }

    .comments-form input:read-only {
      background-color: #f0f0f0;
      font-weight: 700;
      cursor: not-allowed;
    }

    .comments-form input:focus,
    .comments-form textarea:focus {
      outline: 3px solid rgba(10, 26, 62, 0.2);
      outline-offset: 2px;
    }

    .comments-form .form-group {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    /* Six-digit code inputs with visible text */
    .code-container {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .code-label {
      display: block;
      font-weight: 700;
      padding: 20px 0;
      color: #0a1a3e;
      text-align: center;
    }

    .code-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .code-inputs input {
      width: 50px;
      height: 55px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      background: #ffffff;
      border: 2px solid #0a1a3e !important;
      border-radius: 4px;
      color: #0a1a3e;
      /* Masking removed so numbers are visible */
    }

    .code-inputs input:disabled {
      background-color: #f0f0f0;
      color: #0a1a3e;
    }

    #code-error {
      color: #e31b23;
      font-weight: 700;
      margin-top: 0.5rem;
      min-height: 1.2rem;
    }

    /* Navy border utility */
    .btn-navy-border {
      border: 2px solid #0a1a3e !important;
    }

    .comments-form .btn-large {
      display: inline-block;
      margin: 0 auto;
      width: auto;
      background-color: #0a1a3e;
      color: #ffffff;
      padding: 12px 32px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      text-align: center;
    }

    .comments-form .btn-large:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      min-height: 1.5rem;
      margin: 1rem 0;
      text-align: center;
    }

    /* Hidden section initially */
    .hidden-section {
      display: none;
    }

    /* Question text outside box */
    .voting-question {
      font-weight: 900;
      color: #0a1a3e;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    /* Navy border container for options only */
    .voting-fieldset {
      border: 2px solid #0a1a3e !important;
      padding: 20px;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      background: #ffffff;
      text-align: left;
    }

    /* Square voting option boxes (equally sized sides) */
    .vote-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      margin-top: 10px;
      background: #fcf4ed;
      border: 2px solid #0a1a3e !important;
      border-radius: 0px;
      font-weight: 700;
      color: #0a1a3e;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }

    .vote-option:first-child {
      margin-top: 0;
    }

    .vote-option input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      min-width: 24px;
      min-height: 24px;
      border: 2px solid #0a1a3e !important;
      border-radius: 0px;
      background: #ffffff;
      cursor: pointer;
      display: grid;
      place-content: center;
      margin: 0;
    }

    .vote-option input[type="radio"]::before {
      content: "";
      width: 12px;
      height: 12px;
      transform: scale(0);
      transition: 120ms transform ease-in-out;
      box-shadow: inset 12px 12px #0a1a3e;
      border-radius: 0px;
    }

    .vote-option input[type="radio"]:checked::before {
      transform: scale(1);
    }

    /* Footer */
    .site-footer {
      font-size: 12px;
      text-align: center;
      padding: 20px;
      color: #ffffff;
      background: #0a1a3e;
      letter-spacing: 0.5px;
      line-height: 1.5;
    }

    .site-footer a {
      color: #ffffff;
      text-decoration: underline;
    }

    .site-footer a:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <main>

    <section class="form-section">

      <div class="container form-container comments-page">

        <!-- Language Toggle -->
        <div class="lang-toggle">
          <button type="button" id="lang-cy" class="btn-navy-border" onclick="setLanguage('cy')">CY</button>
          <button type="button" id="lang-en" class="active btn-navy-border" onclick="setLanguage('en')">EN</button>
        </div>

        <!-- Non-clickable BID header with tan background -->
        <div class="comments-page-tag pwllheli-tag" id="bid-header">
          PWLLHELI BUSINESS IMPROVEMENT DISTRICT
        </div>

        <!-- Centered Page heading in a tan box -->
        <div>
          <div class="heading-box">
            <h1 class="comments-heading" id="main-heading">
              CONSULTATION
            </h1>
          </div>
        </div>

        <!-- Voting Form -->
        <form
          id="voting-form"
          class="volunteer-form comments-form"
        >

          <!-- Six Digit Voting Code Box -->
          <div class="code-container" id="code-section">
            <label class="code-label" id="code-label">STEP ONE: Please enter the six-digit voting code found on your letter</label>
            <div class="code-inputs" id="code-inputs-group">
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" required />
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
            </div>
            <div id="code-error" role="status" aria-live="polite"></div>
            <button
              class="btn primary btn-large btn-navy-border"
              id="code-submit-button"
              type="button"
              disabled
              onclick="submitCode()"
            >
              SUBMIT
            </button>
          </div>

          <!-- Hidden section containing everything below code entry -->
          <div id="voting-content" class="hidden-section">
            <!-- Non-editable Business Name Field -->
            <div class="form-group">
              <input
                type="text"
                id="business_name"
                name="business_name"
                placeholder="Business Name"
                aria-label="Business Name"
                readonly
              >
            </div>

            <div class="form-group">
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Name"
                aria-label="Name"
                autocomplete="name"
                required
              >
            </div>

            <div class="form-group">
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Email"
                aria-label="Email"
                autocomplete="email"
                required
              >
            </div>

            <!-- Question placed cleanly above the box -->
            <div class="voting-question" id="vote-legend">
              Do you support a Business Improvement District for Pwllheli?
            </div>

            <!-- Container box for voting options only -->
            <div class="voting-fieldset">
              <label class="vote-option">
                <input type="radio" name="vote" value="yes" required>
                <span id="vote-yes">YES</span>
              </label>

              <label class="vote-option">
                <input type="radio" name="vote" value="no" required>
                <span id="vote-no">NO</span>
              </label>
            </div>

            <p
              id="status"
              class="error-message"
              role="status"
              aria-live="polite"
            ></p>

            <button
              class="btn primary btn-large btn-navy-border"
              id="submit-button"
              type="submit"
            >
              CONFIRM
            </button>
          </div>

        </form>

      </div>

    </section>

  </main>

  <footer class="site-footer">
    <div>
      <a href="https://threetwosix.co.uk/beta/tarian" target="_blank" rel="noopener">
        326 ELECTORAL SERVICES, GWYNEDD
      </a>
    </div>
  </footer>

  <script>
    const translations = {
      en: {
        title: "CONSULTATION | Pwllheli Business Improvement District",
        header: "PWLLHELI BUSINESS IMPROVEMENT DISTRICT",
        heading: "CONSULTATION",
        codeLabel: "STEP ONE: Please enter the six-digit voting code found on your letter",
        codeSubmit: "SUBMIT",
        codeNotFound: "CODE NOT FOUND",
        businessPrefix: "Business Name: ",
        namePlaceholder: "Name",
        emailPlaceholder: "Email",
        legend: "Do you support a Business Improvement District for Pwllheli?",
        yes: "YES",
        no: "NO",
        confirm: "CONFIRM",
        successMsg: "Thank you for voting. Your vote has been recorded.",
        errorMsg: "There was a problem. Please try again.",
        unavailableMsg: "Service unavailable. Please try again later."
      },
      cy: {
        title: "YMGYNGHORIAD | Ardal Gwella Busnes Pwllheli",
        header: "ARDAL GWELLA BUSNES PWLLHELI",
        heading: "YMGYNGHORIAD",
        codeLabel: "CAM UN: Rhowch y cod pleidleisio chwe digid a geir ar eich llythyr",
        codeSubmit: "CYFLWYNO",
        codeNotFound: "COD HEB DOD O HYDD",
        businessPrefix: "Enw'r Busnes: ",
        namePlaceholder: "Enw",
        emailPlaceholder: "E-bost",
        legend: "Ydych chi'n cefnogi Ardal Gwella Busnes ar gyfer Pwllheli?",
        yes: "YDY",
        no: "NAC YDY",
        confirm: "CADARNHAU",
        successMsg: "Diolch am bleidleisio. Cafodd eich pleidlais ei chofnodi.",
        errorMsg: "Roedd yna broblem. Rhowch gynnig arall arni.",
        unavailableMsg: "Gwasanaeth ddim ar gael. Rhowch gynnig arall arni yn hwyrach."
      }
    };

    let currentLang = "en";
    let matchedBusinessName = "";

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;

      document.getElementById("lang-cy").classList.toggle("active", lang === "cy");
      document.getElementById("lang-en").classList.toggle("active", lang === "en");

      const t = translations[lang];
      document.title = t.title;
      document.getElementById("bid-header").textContent = t.header;
      document.getElementById("main-heading").textContent = t.heading;
      document.getElementById("code-label").textContent = t.codeLabel;
      document.getElementById("code-submit-button").textContent = t.codeSubmit;

      const bizInput = document.getElementById("business_name");
      if (matchedBusinessName) {
        bizInput.value = t.businessPrefix + matchedBusinessName;
      }

      const nameInput = document.getElementById("name");
      nameInput.placeholder = t.namePlaceholder;
      nameInput.setAttribute("aria-label", t.namePlaceholder);

      const emailInput = document.getElementById("email");
      emailInput.placeholder = t.emailPlaceholder;
      emailInput.setAttribute("aria-label", t.emailPlaceholder);

      document.getElementById("vote-legend").textContent = t.legend;
      document.getElementById("vote-yes").textContent = t.yes;
      document.getElementById("vote-no").textContent = t.no;
      document.getElementById("submit-button").textContent = t.confirm;
    }

    // Six digit code input logic
    const codeInputs = document.querySelectorAll('.code-inputs input');
    const codeSubmitButton = document.getElementById("code-submit-button");
    const codeError = document.getElementById("code-error");

    function checkCodeCompletion() {
      let code = "";
      codeInputs.forEach(input => code += input.value);
      if (code.length === 6) {
        codeSubmitButton.removeAttribute("disabled");
      } else {
        codeSubmitButton.setAttribute("disabled", "true");
      }
    }

    codeInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const value = e.target.value;
        if (value && index < codeInputs.length - 1) {
          codeInputs[index + 1].focus();
        }
        checkCodeCompletion();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          codeInputs[index - 1].focus();
        }
      });
    });

    async function submitCode() {
      let code = "";
      codeInputs.forEach(input => code += input.value);

      if (code.length === 6) {
        let database = {};
        
        try {
          const response = await fetch("http://threetwosix.co.uk/pleidlais/business-lookup.json");
          database = await response.json();
        } catch (error) {
          console.warn("Could not fetch remote JSON, using fallback map:", error);
        }

        // Fallback embedded lookup map just in case the server fetch blocks or fails
        const fallbackDatabase = {
          "123456": "J D Wetherspoon",
          "111111": "Asda Superstore",
          "222222": "Barclays Bank",
          "333333": "Spar Pwllheli",
          "444444": "The Mitre Public House"
        };

        matchedBusinessName = database[code] || fallbackDatabase[code];

        if (!matchedBusinessName) {
          // Invalid code handling
          codeError.textContent = translations[currentLang].codeNotFound;
          codeInputs.forEach(input => input.disabled = true);
          codeSubmitButton.disabled = true;

          setTimeout(() => {
            window.location.reload();
          }, 2000);
          return;
        }

        // Valid code: Freeze inputs and hide submit button, then show voting section
        codeError.textContent = "";
        codeInputs.forEach(input => input.disabled = true);
        codeSubmitButton.style.display = "none";
        
        const bizInput = document.getElementById("business_name");
        bizInput.value = translations[currentLang].businessPrefix + matchedBusinessName;
        
        document.getElementById("voting-content").style.display = "block";
      }
    }

    const form = document.getElementById("voting-form");
    const status = document.getElementById("status");
    const submitButton = document.getElementById("submit-button");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      let code = "";
      codeInputs.forEach(input => code += input.value);

      if (code.length !== 6) {
        return;
      }

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      submitButton.disabled = true;
      status.textContent = "";

      const data = {
        code: code,
        business_name: matchedBusinessName,
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        vote: document.querySelector('input[name="vote"]:checked').value,
        submission_type: "vote"
      };

      try {
        const response = await fetch("https://tendring-contact.twells-tet.workers.dev", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success || response.ok) {
          window.location.href = "https://www.gwynedd.llyw.cymru/en-gb/have-your-say/consultations-and-surveys-2026/2026-business-survey";
        } else {
          status.textContent = result.error || translations[currentLang].errorMsg;
          status.style.color = "#0a1a3e";
          submitButton.disabled = false;
        }
      } catch (error) {
        status.textContent = translations[currentLang].unavailableMsg;
        status.style.color = "#0a1a3e";
        console.error(error);
        submitButton.disabled = false;
      }
    });
  </script>

</body>

</html>
