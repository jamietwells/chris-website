<!DOCTYPE html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #fcf4ed;
      color: #0a1a3e;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    main {
      padding: 40px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }

    .comments-page {
      text-align: center;
      max-width: 650px;
      margin: 0 auto;
    }

    .comments-page-tag {
      display: inline-block;
      text-decoration: none;
      color: #0a1a3e;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      border: 2px solid #0a1a3e !important;
      padding: 12px 25px;
      background: #fcf4ed;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .heading-box {
      display: inline-block;
      border: 2px solid #0a1a3e !important;
      padding: 20px 35px;
      background: #fcf4ed;
      margin-bottom: 1.5rem;
    }

    .comments-heading {
      color: #0a1a3e;
      margin: 0;
      font-size: 2.2rem;
      font-weight: 900;
      text-align: center !important;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .thank-you-box {
      background: #ffffff;
      border: 2px solid #0a1a3e !important;
      padding: 30px;
      border-radius: 6px;
      font-size: 1.1rem;
      line-height: 1.6;
      font-weight: 700;
      margin-bottom: 2rem;
      text-align: center;
    }

    .btn-large {
      display: inline-block;
      background-color: #0a1a3e;
      color: #ffffff;
      padding: 14px 32px;
      font-weight: 900;
      font-size: 1.1rem;
      text-decoration: none;
      border-radius: 4px;
      border: 2px solid #0a1a3e !important;
      letter-spacing: 1px;
      transition: opacity 0.2s ease;
    }

    .btn-large:hover {
      opacity: 0.9;
    }

    /* Footer */
    .site-footer {
      font-size: 12px;
      text-align: center;
      padding: 20px;
      color: #ffffff;
      background: #0a1a3e;
      letter-spacing: 0.5px;
      line-height: 1.5;
    }

    .site-footer a {
      color: #ffffff;
      text-decoration: underline;
    }

    .site-footer a:hover {
      opacity: 0.8;
    }

</head>

<body>

  <main>

      <div>

      <div class="thank-you-box">
        <p style="margin-top: 0;">Your survey response has been successfully received.</p>

        <p style="margin-bottom: 0;">Diolch yn fawr.</p>
