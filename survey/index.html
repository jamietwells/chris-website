<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SURVEY | YMLAEN</title>

  <meta name="description" content="Resident survey for Ymlaen - Pwllheli.">
  <meta name="theme-color" content="#0a1a3e">

  <link rel="icon" href="https://threetwosix.co.uk/survey/ymlaen-favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #fcf4ed;
      color: #0a1a3e;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    main {
      padding: 20px 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .welcome-container {
      text-align: center;
      max-width: 600px;
    }

    .heading-box {
      display: inline-block;
      border: 2px solid #0a1a3e;
      padding: 15px 35px;
      background: #fcf4ed;
      margin-bottom: 2rem;
    }

    .welcome-heading {
      color: #0a1a3e;
      margin: 0;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .welcome-description {
      font-size: 1.1rem;
      line-height: 1.6;
      margin: 2rem 0;
      color: #0a1a3e;
    }

    .welcome-link {
      display: inline-block;
      text-decoration: none;
      color: #0a1a3e;
      font-weight: 700;
      font-size: 1.1rem;
      border: 2px solid #0a1a3e;
      padding: 15px 40px;
      background: #fcf4ed;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      margin: 0.5rem;
    }

    .welcome-link:hover {
      background: #0a1a3e;
      color: #fcf4ed;
    }

    .language-links {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 2px solid #0a1a3e;
    }

    .language-links a {
      display: inline-block;
      margin: 0.5rem;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>
  <main>
    <div class="welcome-container">
      <div class="heading-box">
        <h1 class="welcome-heading">Welcome</h1>
      </div>
      
      <p class="welcome-description">
        Thank you for your interest in the resident survey for Ymlaen. The survey will be launching soon.
      </p>

      <div class="language-links">
        <a href="https://threetwosix.co.uk/survey/cymraeg/" class="welcome-link">Cymraeg / Welsh</a>
      </div>
    </div>
  </main>
</body>

</html>
