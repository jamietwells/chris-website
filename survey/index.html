<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SURVEY | YMLAEN - PWLLHELI</title>

  <meta
    name="description"
    content="Resident survey for Ymlaen - Pwllheli."
  >

  <meta name="theme-color" content="#0a1a3e">

  <link
    rel="icon"
    href="https://www.threetwosix.co.uk/thirdcrossing/icon.svg"
    type="image/svg+xml"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../style.css">

  <style>
    body {
      background-color: #fcf4ed;
      color: #0a1a3e;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }

    .comments-page {
      text-align: center;
      padding-top: 20px;
    }

    /* Tan background headers with navy borders */
    .comments-page-tag {
      display: inline-block;
      text-decoration: none;
      color: #0a1a3e;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      border: 2px solid #0a1a3e !important;
      padding: 15px 25px;
      background: #fcf4ed;
      letter-spacing: 1px;
    }

    .heading-box {
      display: inline-block;
      border: 2px solid #0a1a3e !important;
      padding: 15px 35px;
      background: #fcf4ed;
      margin-bottom: 1.5rem;
    }

    .comments-heading {
      color: #0a1a3e;
      margin: 0;
      font-size: 2.2rem;
      font-weight: 900;
      text-align: center !important;
      letter-spacing: 1px;
    }

    .comments-form {
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
    }

    .comments-form input,
    .comments-form textarea,
    .comments-form select {
      box-sizing: border-box;
      width: 100%;
      border: 2px solid #0a1a3e !important;
      border-radius: 4px;
      background: #ffffff;
      color: #0a1a3e;
      font-family: inherit;
      font-size: 1rem;
      text-align: center;
    }

    .comments-form input,
    .comments-form select {
      min-height: 52px;
      padding: 12px 14px;
    }

    .comments-form textarea {
      padding: 12px 14px;
      resize: vertical;
      min-height: 120px;
      text-align: left;
    }

    .comments-form input:read-only {
      background-color: #f0f0f0;
      font-weight: 700;
      cursor: not-allowed;
    }

    .comments-form input:focus,
    .comments-form textarea:focus,
    .comments-form select:focus {
      outline: 3px solid rgba(10, 26, 62, 0.2);
      outline-offset: 2px;
    }

    .comments-form .form-group {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    /* Six-digit code inputs */
    .code-container {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .code-label {
      display: block;
      font-weight: 700;
      padding: 20px 0;
      color: #0a1a3e;
      text-align: center;
    }

    .code-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .code-inputs input {
      width: 50px;
      height: 55px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      background: #ffffff;
      border: 2px solid #0a1a3e !important;
      border-radius: 4px;
      color: #0a1a3e;
    }

    .code-inputs input:disabled {
      background-color: #f0f0f0;
      color: #0a1a3e;
    }

    #code-error {
      color: #e31b23;
      font-weight: 700;
      margin-top: 0.5rem;
      min-height: 1.2rem;
    }

    /* Utility Buttons */
    .btn-navy-border {
      border: 2px solid #0a1a3e !important;
    }

    .comments-form .btn-large {
      display: inline-block;
      margin: 0 auto;
      width: auto;
      background-color: #0a1a3e;
      color: #ffffff;
      padding: 12px 32px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      text-align: center;
    }

    .comments-form .btn-large:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      min-height: 1.5rem;
      margin: 1rem 0;
      text-align: center;
    }

    .hidden-section {
      display: none;
    }

    /* Survey Question Styling */
    .survey-question {
      font-weight: 900;
      color: #0a1a3e;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .survey-fieldset {
      border: 2px solid #0a1a3e !important;
      padding: 20px;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      background: #ffffff;
      text-align: left;
    }

    .survey-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      margin-top: 10px;
      background: #fcf4ed;
      border: 2px solid #0a1a3e !important;
      border-radius: 0px;
      font-weight: 700;
      color: #0a1a3e;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }

    .survey-option:first-child {
      margin-top: 0;
    }

    .survey-option input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      min-width: 24px;
      min-height: 24px;
      border: 2px solid #0a1a3e !important;
      border-radius: 0px;
      background: #ffffff;
      cursor: pointer;
      display: grid;
      place-content: center;
      margin: 0;
    }

    .survey-option input[type="radio"]::before {
      content: "";
      width: 12px;
      height: 12px;
      transform: scale(0);
      transition: 120ms transform ease-in-out;
      box-shadow: inset 12px 12px #0a1a3e;
      border-radius: 0px;
    }

    .survey-option input[type="radio"]:checked::before {
      transform: scale(1);
    }

    /* Footer */
    .site-footer {
      font-size: 12px;
      text-align: center;
      padding: 20px;
      color: #ffffff;
      background: #0a1a3e;
      letter-spacing: 0.5px;
      line-height: 1.5;
    }

    .site-footer a {
      color: #ffffff;
      text-decoration: underline;
    }

    .site-footer a:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <main>

    <section class="form-section">

      <div class="container form-container comments-page">

        <!-- Top Header Banner -->
        <div class="comments-page-tag" id="main-header">
          YMLAEN - PWLLHELI
        </div>

        <!-- Main Title Box -->
        <div>
          <div class="heading-box">
            <h1 class="comments-heading">
              SURVEY
            </h1>
          </div>
        </div>

        <!-- Survey Form Container -->
        <form id="survey-form" class="volunteer-form comments-form">

          <!-- Six Digit Code Section -->
          <div class="code-container" id="code-section">
            <label class="code-label">STEP ONE: Please enter the six-digit resident access code from your invitation letter</label>
            <div class="code-inputs" id="code-inputs-group">
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" required />
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
              <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
            </div>
            <div id="code-error" role="status" aria-live="polite"></div>
            <button
              class="btn primary btn-large btn-navy-border"
              id="code-submit-button"
              type="button"
              disabled
              onclick="submitCode()"
            >
              SUBMIT
            </button>
          </div>

          <!-- Hidden Survey Content Section -->
          <div id="survey-content" class="hidden-section">

            <!-- Read-only Verified Resident Info Box -->
            <div class="form-group">
              <input
                type="text"
                id="resident_info"
                name="resident_info"
                placeholder="Resident Code Verified"
                aria-label="Resident Information"
                readonly
              >
            </div>

            <!-- Name Field -->
            <div class="form-group">
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Full Name"
                aria-label="Full Name"
                autocomplete="name"
                required
              >
            </div>

            <!-- Email Field -->
            <div class="form-group">
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Email Address"
                aria-label="Email Address"
                autocomplete="email"
                required
              >
            </div>

            <!-- Priority Question -->
            <div class="survey-question">
              What should be the top priority for Pwllheli town center?
            </div>

            <div class="survey-fieldset">
              <label class="survey-option">
                <input type="radio" name="priority" value="local_business" required>
                <span>Support Local Businesses & Regeneration</span>
              </label>

              <label class="survey-option">
                <input type="radio" name="priority" value="parking_traffic" required>
                <span>Parking & Transport Infrastructure</span>
              </label>

              <label class="survey-option">
                <input type="radio" name="priority" value="community_events" required>
                <span>Community Events & Tourism</span>
              </label>

              <label class="survey-option">
                <input type="radio" name="priority" value="youth_facilities" required>
                <span>Youth & Public Facilities</span>
              </label>
            </div>

            <!-- Feedback Textarea -->
            <div class="form-group">
              <textarea
                id="comments"
                name="comments"
                placeholder="Please share any additional comments or ideas for Pwllheli..."
                aria-label="Comments"
              ></textarea>
            </div>

            <p id="status" class="error-message" role="status" aria-live="polite"></p>

            <button
              class="btn primary btn-large btn-navy-border"
              id="submit-button"
              type="submit"
            >
              SUBMIT SURVEY
            </button>
          </div>

        </form>

      </div>

    </section>

  </main>

  <footer class="site-footer">
    <div>
      <a href="https://threetwosix.co.uk/beta/tarian" target="_blank" rel="noopener">
        326 ELECTORAL SERVICES, GWYNEDD
      </a>
    </div>
  </footer>

  <script>
    // Embedded Resident Database Mapping (Codes to Resident IDs / Names)
    const residentDatabase = {
      "123456": "Resident Code 123456",
      "111111": "Resident Code 111111",
      "222222": "Resident Code 222222",
      "333333": "Resident Code 333333",
      "444444": "Resident Code 444444"
      // Expand with your resident list...
    };

    let matchedResident = "";

    // Six-digit code input stepping logic
    const codeInputs = document.querySelectorAll('.code-inputs input');
    const codeSubmitButton = document.getElementById("code-submit-button");
    const codeError = document.getElementById("code-error");

    function checkCodeCompletion() {
      let code = "";
      codeInputs.forEach(input => code += input.value);
      if (code.length === 6) {
        codeSubmitButton.removeAttribute("disabled");
      } else {
        codeSubmitButton.setAttribute("disabled", "true");
      }
    }

    codeInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const value = e.target.value;
        if (value && index < codeInputs.length - 1) {
          codeInputs[index + 1].focus();
        }
        checkCodeCompletion();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          codeInputs[index - 1].focus();
        }
      });
    });

    function submitCode() {
      let code = "";
      codeInputs.forEach(input => code += input.value);

      if (code.length === 6) {
        matchedResident = residentDatabase[code];

        if (!matchedResident) {
          // Display error and reload page after 2 seconds
          codeError.textContent = "CODE NOT FOUND";
          codeInputs.forEach(input => input.disabled = true);
          codeSubmitButton.disabled = true;

          setTimeout(() => {
            window.location.reload();
          }, 2000);
          return;
        }

        // Code matched successfully
        codeError.textContent = "";
        codeInputs.forEach(input => input.disabled = true);
        codeSubmitButton.style.display = "none";
        
        document.getElementById("resident_info").value = "Verified Code: " + code;
        document.getElementById("survey-content").style.display = "block";
      }
    }

    // Form Submission Handling
    const form = document.getElementById("survey-form");
    const status = document.getElementById("status");
    const submitButton = document.getElementById("submit-button");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      let code = "";
      codeInputs.forEach(input => code += input.value);

      if (code.length !== 6 || !form.checkValidity()) {
        form.reportValidity();
        return;
      }

      submitButton.disabled = true;
      status.textContent = "";

      const data = {
        code: code,
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        priority: document.querySelector('input[name="priority"]:checked').value,
        comments: document.getElementById("comments").value.trim(),
        submission_type: "survey",
        group: "YMLAEN - PWLLHELI"
      };

      try {
        const response = await fetch("https://tendring-contact.twells-tet.workers.dev", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success || response.ok) {
          window.location.href = "https://pwllheli-bid.org.uk/comments/";
        } else {
          status.textContent = result.error || "There was a problem submitting your survey. Please try again.";
          status.style.color = "#0a1a3e";
          submitButton.disabled = false;
        }
      } catch (error) {
        status.textContent = "Service unavailable. Please try again later.";
        status.style.color = "#0a1a3e";
        console.error(error);
        submitButton.disabled = false;
      }
    });
  </script>

</body>

</html>
