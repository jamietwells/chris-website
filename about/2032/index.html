<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROPOSED BID AFTER 2032</title>
  
  <link rel="icon" type="image/svg+xml" href="https://threetwosix.co.uk/beta/tarian-shield.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- External GeoJSON Data Files for the 5 Communities -->
  <script src="pwllheli.js"></script>
  <script src="llanystumdwy.js"></script>
  <script src="llanengan.js"></script>
  <script src="llannor.js"></script>
  <script src="llanbedrog.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; }
    #map { height: 100vh; width: 100vw; position: relative; z-index: 1; }
    
    .leaflet-top.leaflet-right {
      z-index: 1000 !important;
      pointer-events: auto;
    }

    .key-control {
      background: #ffffff;
      color: #222;
      padding: 12px 15px;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      border-radius: 10px;
      line-height: 1.5;
      min-width: 280px;
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid #cbd5e1;
    }
    .key-control.collapsed .key-content {
      display: none;
    }
    .key-control.collapsed {
      min-width: auto;
      padding: 8px 12px;
    }
    .key-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-bottom: 2px solid #eee;
      padding-bottom: 6px;
    }
    .key-control.collapsed .key-header {
      margin-bottom: 0;
      border-bottom: none;
      padding-bottom: 0;
    }
    .key-header h4 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
    }
    .hide-key-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      color: #334155;
    }
    .hide-key-btn:hover {
      background: #e2e8f0;
    }
    .community-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .community-item label {
      display: flex;
      align-items: center;
      cursor: pointer;
      flex-grow: 1;
    }
    .community-color-box {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      display: inline-block;
      margin-right: 8px;
      border: 2.5px solid #ff0000;
      background: transparent;
      flex-shrink: 0;
    }
    .community-color-box.blue-border {
      border-color: #2563eb;
    }
    .community-name { font-weight: 600; color: #1e293b; font-size: 13px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Map centered on Pwllheli area
    const map = L.map('map').setView([52.888, -4.415], 11);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Existing BID GeoJSON Data (Corrected coordinate typo)
    const existingBidGeoJSON = {
      "type": "FeatureCollection",
      "features": [
        {
          "type": "Feature",
          "properties": { "name": "Existing BID" },
          "geometry": {
            "type": "Polygon",
            "coordinates": [
              [
                [ -4.4067455, 52.8940931 ],
                [ -4.4188028, 52.8925156 ],
                [ -4.4192829, 52.8920817 ],
                [ -4.4191287, 52.8918817 ],
                [ -4.4189976, 52.8916584 ],
                [ -4.4189205, 52.8914304 ],
                [ -4.4189668, 52.8911979 ],
                [ -4.4190362, 52.8910164 ],
                [ -4.4191750, 52.8908862 ],
                [ -4.4193906, 52.8907084 ],
                [ -4.4195294, 52.8905595 ],
                [ -4.4196065, 52.8904339 ],
                [ -4.4196142, 52.8903130 ],
                [ -4.4195063, 52.8901688 ],
                [ -4.4193598, 52.8900152 ],
                [ -4.4191131, 52.8897827 ],
                [ -4.4189357, 52.8896850 ],
                [ -4.4188740, 52.8895919 ],
                [ -4.4188047, 52.8895175 ],
                [ -4.4187507, 52.8893826 ],
                [ -4.4187265, 52.8891918 ],
                [ -4.4186723, 52.8889180 ],
                [ -4.4188340, 52.8888865 ],
                [ -4.4192106, 52.8887089 ],
                [ -4.4194159, 52.8886098 ],
                [ -4.4196213, 52.8885272 ],
                [ -4.4198609, 52.8884776 ],
                [ -4.4200731, 52.8884693 ],
                [ -4.4203264, 52.8884735 ],
                [ -4.4204770, 52.8884776 ],
                [ -4.4206619, 52.8884156 ],
                [ -4.4209015, 52.8883619 ],
                [ -4.4210589, 52.8882959 ],
                [ -4.4212643, 52.8882711 ],
                [ -4.4213807, 52.8882091 ],
                [ -4.4216340, 52.8881885 ],
                [ -4.4285051, 52.8864371 ],
                [ -4.4327357, 52.8854132 ],
                [ -4.4326752, 52.8778029 ],
                [ -4.4182682, 52.8802986 ],
                [ -4.4065292, 52.8812915 ],
                [ -4.4067455, 52.8940931 ]
              ]
            ]
          }
        }
      ]
    };

    // Dynamic resolution for window global variables or lowercase variants
    function resolveGeoJSON(varName) {
      if (typeof window[varName] !== 'undefined') return window[varName];
      if (typeof window[varName.toLowerCase()] !== 'undefined') return window[varName.toLowerCase()];
      return null;
    }

    // Define the map boundary configurations
    const communityConfigs = {
      existing_bid: { name: 'Existing BID', dataVar: existingBidGeoJSON, color: '#2563eb' },
      pwllheli: { name: 'Pwllheli', dataVar: resolveGeoJSON('pwllheliGeoJSON'), color: '#ff0000' },
      llanystumdwy: { name: 'Llanystumdwy', dataVar: resolveGeoJSON('llanystumdwyGeoJSON'), color: '#ff0000' },
      llanengan: { name: 'Llanengan', dataVar: resolveGeoJSON('llanenganGeoJSON'), color: '#ff0000' },
      llannor: { name: 'Llannor', dataVar: resolveGeoJSON('llannorGeoJSON'), color: '#ff0000' },
      llanbedrog: { name: 'Llanbedrog', dataVar: resolveGeoJSON('llanbedrogGeoJSON'), color: '#ff0000' }
    };

    const communityLayers = {};
    const boundsCoords = [];

    // Load GeoJSON layers
    Object.keys(communityConfigs).forEach(key => {
      const cfg = communityConfigs[key];
      if (cfg.dataVar) {
        communityLayers[key] = L.geoJSON(cfg.dataVar, {
          style: {
            color: cfg.color || '#ff0000',
            weight: 3,
            opacity: 1,
            fillOpacity: 0
          },
          onEachFeature: (feature, layer) => {
            let popupContent = `<div style="color: #1e293b; font-family: sans-serif;"><strong>Area:</strong> ${cfg.name}</div>`;
            layer.bindPopup(popupContent);
          }
        }).addTo(map);

        try {
          const bounds = communityLayers[key].getBounds();
          if (bounds.isValid()) boundsCoords.push(bounds);
        } catch(e) {}
      }
    });

    // Fit map bounds to encompass loaded boundaries
    if (boundsCoords.length > 0) {
      try {
        map.fitBounds(L.latLngBounds(boundsCoords), { padding: [30, 30] });
      } catch(e) {}
    }

    // Custom Layer Control Box
    const KeyControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd: function (mapInstance) {
        const container = L.DomUtil.create('div', 'key-control');
        
        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);

        let html = `
          <div class="key-header">
            <h4>Boundaries</h4>
            <button type="button" class="hide-key-btn" id="hideKeyBtn">Hide Key</button>
          </div>
          <div class="key-content">
        `;

        Object.keys(communityConfigs).forEach(key => {
          const cfg = communityConfigs[key];
          const isLoaded = !!communityLayers[key];
          const isBlue = cfg.color === '#2563eb';
          
          html += `
            <div class="community-item">
              <label>
                <input type="checkbox" class="community-toggle-checkbox" data-comm="${key}" ${isLoaded ? 'checked' : ''} ${!isLoaded ? 'disabled' : ''} style="margin-right:8px;">
                <span class="community-color-box ${isBlue ? 'blue-border' : ''}"></span>
                <span class="community-name">${cfg.name} ${!isLoaded ? '(Missing File)' : ''}</span>
              </label>
            </div>
          `;
        });

        html += `</div>`;
        container.innerHTML = html;

        const hideKeyBtn = container.querySelector('#hideKeyBtn');

        // Checkbox toggle event handlers
        container.querySelectorAll('.community-toggle-checkbox').forEach(chk => {
          L.DomEvent.on(chk, 'change', function (e) {
            const commKey = e.target.getAttribute('data-comm');
            if (communityLayers[commKey]) {
              if (e.target.checked) {
                mapInstance.addLayer(communityLayers[commKey]);
              } else {
                mapInstance.removeLayer(communityLayers[commKey]);
              }
            }
          });
        });

        // Collapse / expand control panel
        L.DomEvent.on(hideKeyBtn, 'click', function (e) {
          e.preventDefault();
          container.classList.toggle('collapsed');
          hideKeyBtn.textContent = container.classList.contains('collapsed') ? 'Show Key' : 'Hide Key';
        });

        return container;
      }
    });

    map.addControl(new KeyControl());
  </script>
</body>
</html>
