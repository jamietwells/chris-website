<script src="welsh_communities.js"></script>

<!-- Map Initialization Script -->
<script>
  // Initialize the map centered roughly around Pwllheli / Gwynedd area
  var map = L.map('communities-map').setView([52.925, -4.415], 11);

  // Add OpenStreetMap dark/standard tiles
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  // Style for the boundaries: Pink border, transparent fill
  var boundaryStyle = {
    color: '#ec4899',       // Pink border
    weight: 2,
    fillColor: '#ec4899',
    fillOpacity: 0.0        // Transparent fill
  };

  // Check if welshCommunitiesData is loaded from welsh_communities.js
  if (typeof welshCommunitiesData !== 'undefined') {
    var communityLayer = L.geoJSON(welshCommunitiesData, {
      style: boundaryStyle,
      onEachFeature: function (feature, layer) {
        // Optional: display community name if available in properties
        if (feature.properties && (feature.properties.NAME || feature.properties.name)) {
          layer.bindPopup("<strong>Community:</strong> " + (feature.properties.NAME || feature.properties.name));
        }
      }
    }).addTo(map);

    // Automatically zoom map to fit the boundaries perfectly
    try {
      map.fitBounds(communityLayer.getBounds());
    } catch (e) {
      console.log("Could not auto-fit bounds:", e);
    }
  } else {
    console.error("welsh_communities.js failed to load or variable 'welshCommunitiesData' is missing.");
  }
</script>
