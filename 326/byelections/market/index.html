<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>By-election odds | 326</title>
  <link rel="icon" href="/326/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #142338; background: #f5f7fa; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: #f5f7fa; }
    .site-header { display: flex; align-items: center; gap: 2.25rem; height: 64px; padding: 0 2rem; border-bottom: 1px solid #273b55; background: #142338; color: #fff; }
    .wordmark { color: inherit; font-size: 1.35rem; font-weight: 750; letter-spacing: -0.06em; text-decoration: none; }
    .wordmark::first-letter { color: #47d3b1; }
    .primary-nav { display: flex; align-self: stretch; align-items: center; gap: 1.75rem; margin-left: auto; }
    .primary-nav a { display: flex; align-items: center; height: 100%; border-bottom: 3px solid transparent; color: #c8d1dc; font-size: 0.875rem; font-weight: 600; text-decoration: none; }
    .primary-nav a:hover, .primary-nav a:focus-visible, .primary-nav a[aria-current="page"] { border-bottom-color: #47d3b1; color: #fff; outline: none; }
    main { width: min(100% - 2rem, 960px); min-height: calc(100vh - 64px); margin: 0 auto; padding: 3rem 0; }
    .market { overflow: hidden; border: 1px solid #dbe2ea; border-radius: 0.5rem; background: #fff; box-shadow: 0 1px 2px rgb(20 35 56 / 4%); }
    .market-header, .market-details, .stake-panel, .status { padding: 1.5rem; }
    .market-header { border-bottom: 1px solid #e6ebf0; }
    .eyebrow { margin: 0 0 0.35rem; color: #627187; font-size: 0.75rem; font-weight: 750; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.2rem, 3vw, 1.5rem); letter-spacing: -0.02em; }
    .market-details { display: grid; grid-template-columns: auto 1fr; gap: 0.7rem 1.5rem; border-bottom: 1px solid #e6ebf0; }
    dt { color: #627187; font-size: 0.8rem; font-weight: 750; }
    dd { margin: 0; font-weight: 700; }
    .stake-panel { display: flex; align-items: center; gap: 0.75rem; border-bottom: 1px solid #e6ebf0; background: #fafbfd; }
    .stake-panel label { color: #627187; font-size: 0.75rem; font-weight: 750; letter-spacing: 0.06em; text-transform: uppercase; }
    .stake-input-wrap { position: relative; width: 12rem; }
    .stake-input-wrap span { position: absolute; top: 50%; left: 0.75rem; color: #627187; font-weight: 650; pointer-events: none; transform: translateY(-50%); }
    .stake-input-wrap input { width: 100%; padding: 0.7rem 0.75rem 0.7rem 1.75rem; border: 1px solid #b9c4d0; border-radius: 0.35rem; background: #fff; color: #142338; font: inherit; font-variant-numeric: tabular-nums; }
    .stake-input-wrap input:focus { border-color: #278c77; outline: 3px solid rgb(71 211 177 / 25%); }
    .stake-message { margin: 0; color: #b42318; font-size: 0.75rem; font-weight: 600; }
    .candidates { width: 100%; border-collapse: collapse; }
    .candidates th, .candidates td { padding: 1rem 1.5rem; border-bottom: 1px solid #e6ebf0; text-align: left; }
    .candidates th { color: #627187; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .candidates td:last-child { text-align: left; font-variant-numeric: tabular-nums; font-weight: 750; }
    .potential-return { display: block; margin-top: 0.2rem; color: #627187; font-size: 0.75rem; font-weight: 600; }
    .selection-chevron { width: 1%; padding-right: 1.25rem !important; padding-left: 0 !important; }
    .selection-chevron button { display: grid; width: 2rem; height: 2rem; place-items: center; border: 0; border-radius: 50%; background: transparent; color: #142338; font: inherit; font-size: 2rem; font-weight: 400; line-height: 1; cursor: pointer; }
    .selection-chevron button:hover, .selection-chevron button:focus-visible { background: rgb(20 35 56 / 10%); outline: none; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .candidates tbody tr { --party-colour: #8693a3; }
    .candidates tbody tr[data-party="labour"] { --party-colour: #e4003b; }
    .candidates tbody tr[data-party="conservative"] { --party-colour: #0087dc; }
    .candidates tbody tr[data-party="lib-dem"] { --party-colour: #ff6400; }
    .candidates tbody tr[data-party="reform"] { --party-colour: #12b6cf; }
    .candidates tbody tr[data-party="green"] { --party-colour: #6ab023; }
    .candidates tbody tr[data-party="restore-britain"] { --party-colour: #000080; }
    .candidates tbody tr[data-party="plaid-cymru"] { --party-colour: #005b54; }
    .candidates tbody tr[data-party="snp"] { --party-colour: #d0b000; }
    .candidates tbody tr[data-party="independent"],
    .candidates tbody tr[data-party="other"] { --party-colour: #8693a3; }
    .candidates tbody tr td { background: color-mix(in srgb, var(--party-colour) 11%, white); }
    .candidates tbody tr td:first-child { box-shadow: inset 4px 0 0 var(--party-colour); }
    .candidates tbody tr { cursor: pointer; }
    .candidates tbody tr:focus-visible { outline: 3px solid var(--party-colour); outline-offset: -3px; }
    .status { margin: 0; color: #627187; line-height: 1.55; }
    .site-footer { width: min(100% - 2rem, 960px); margin: 0 auto; padding: 0 0 2rem; color: #627187; font-size: 0.75rem; line-height: 1.5; }
    @media (max-width: 560px) {
      .site-header { height: 56px; padding: 0 1.25rem; }
      .primary-nav { gap: 1rem; }
      main { width: min(100% - 1.5rem, 960px); min-height: calc(100vh - 56px); padding: 1.5rem 0; }
      .site-footer { width: min(100% - 1.5rem, 960px); }
      .market-header, .market-details, .stake-panel, .status, .candidates th, .candidates td { padding: 1rem; }
      .candidates { table-layout: fixed; }
      .candidates th:first-child, .candidates td:first-child { width: 42%; }
      .selection-chevron { width: 10%; padding: 0.5rem 0 !important; }
      .candidates th:nth-child(3), .candidates td:nth-child(3) { width: 48%; }
      .potential-return { overflow-wrap: anywhere; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/326/" aria-label="326 home">326</a>
    <nav class="primary-nav" aria-label="Primary navigation">
      <a href="/326/">GENERAL ELECTION</a>
      <a href="/326/byelections/" aria-current="page">BY-ELECTIONS</a>
    </nav>
  </header>
  <main>
    <section class="market" aria-labelledby="market-title">
      <header class="market-header">
        <p class="eyebrow">British Politics</p>
        <h1 id="market-title">By-election odds</h1>
      </header>
      <dl class="market-details" id="market-details" hidden>
        <dt>Date</dt><dd id="date"></dd>
        <dt>Council</dt><dd id="authority"></dd>
        <dt>Ward / division</dt><dd id="ward"></dd>
        <dt>Defending</dt><dd id="defending"></dd>
      </dl>
      <div class="stake-panel" id="stake-panel" hidden>
        <label for="stake">Your stake</label>
        <div class="stake-input-wrap"><span aria-hidden="true">£</span><input id="stake" type="number" min="10" max="29500" step="1" inputmode="numeric" value="50" aria-describedby="stake-message"></div>
        <p id="stake-message" class="stake-message" aria-live="polite"></p>
      </div>
      <table class="candidates" id="candidates" hidden>
        <thead><tr><th scope="col">Party</th><th scope="col"><span class="visually-hidden">Place bet</span></th><th scope="col">Odds / potential return</th></tr></thead>
        <tbody></tbody>
      </table>
      <p class="status" id="status" aria-live="polite">Loading market...</p>
    </section>
  </main>
  <footer class="site-footer">
    326 Political Betting (United Kingdom), 50/5 Bulevar Revolucije, Podgorica 81000, Montenegro
  </footer>
  <script>
    const ODDS_SHEET_URL = "https://docs.google.com/spreadsheets/d/1OS8iu7s0CAD__v1i_2kIOiIGvgmNiRN3KAAI4V9XyaE/export?format=csv&gid=1260743543";
    const parameters = new URLSearchParams(window.location.search);
    const requested = {
      date: parameters.get("date") || "",
      authority: parameters.get("authority") || "",
      ward: parameters.get("ward") || ""
    };
    const months = {
      Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5,
      Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11
    };
    const status = document.getElementById("status");
    const details = document.getElementById("market-details");
    const candidatesTable = document.getElementById("candidates");
    const stakePanel = document.getElementById("stake-panel");
    const stakeInput = document.getElementById("stake");
    const stakeMessage = document.getElementById("stake-message");
    const potentialReturnFormatter = new Intl.NumberFormat("en-GB", {
      style: "currency",
      currency: "GBP"
    });
    const PARTY_NAMES = {
      "LABOUR": "Labour",
      "CONSERVATIVE": "Conservative",
      "LIB DEM": "Lib Dem",
      "REFORM UK": "Reform UK",
      "GREEN": "Green",
      "RESTORE BRITAIN": "Restore Britain",
      "PLAID CYMRU": "Plaid Cymru",
      "SNP": "SNP",
      "INDEPENDENT": "Independent",
      "OTHER": "Other"
    };
    const DEFENDING_PARTY_COLUMNS = {
      LAB: "LABOUR",
      CON: "CONSERVATIVE",
      LD: "LIB DEM",
      REF: "REFORM UK",
      GRN: "GREEN",
      SNP: "SNP",
      IND: "INDEPENDENT"
    };

    function parseCsv(csv) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;
      for (let index = 0; index < csv.length; index += 1) {
        const character = csv[index];
        if (quoted) {
          if (character === "\"" && csv[index + 1] === "\"") {
            value += character;
            index += 1;
          } else if (character === "\"") {
            quoted = false;
          } else {
            value += character;
          }
        } else if (character === "\"") {
          quoted = true;
        } else if (character === ",") {
          row.push(value);
          value = "";
        } else if (character === "\n") {
          row.push(value.replace(/\r$/, ""));
          rows.push(row);
          row = [];
          value = "";
        } else {
          value += character;
        }
      }
      if (value !== "" || row.length) {
        row.push(value.replace(/\r$/, ""));
        rows.push(row);
      }
      return rows;
    }

    function approximateFraction(value, maximumDenominator = 16) {
      const nearestInteger = Math.round(value);
      if (Math.abs(value - nearestInteger) < 0.1) {
        return { numerator: nearestInteger, denominator: 1 };
      }
      let bestNumerator = Math.round(value);
      let bestDenominator = 1;
      let smallestDifference = Math.abs(value - bestNumerator);

      for (let denominator = 1; denominator <= maximumDenominator; denominator += 1) {
        const numerator = Math.round(value * denominator);
        const difference = Math.abs(value - numerator / denominator);
        if (difference < smallestDifference) {
          bestNumerator = numerator;
          bestDenominator = denominator;
          smallestDifference = difference;
        }
      }
      return { numerator: bestNumerator, denominator: bestDenominator };
    }

    function getOdds(value) {
      const fractionalOdds = Number(value.trim());
      if (!Number.isFinite(fractionalOdds) || fractionalOdds <= 0) {
        return { fractional: "100/1", decimal: 101 };
      }
      const fraction = approximateFraction(fractionalOdds);
      return {
        fractional: fraction.numerator + "/" + fraction.denominator,
        decimal: 1 + fraction.numerator / fraction.denominator
      };
    }

    function partySlug(party) {
      if (party === "REFORM UK") return "reform";
      return party.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    function validStake() {
      const stake = Number(stakeInput.value);
      return Number.isInteger(stake) && stake >= 10 && stake <= 29500;
    }

    function isWithinNextSevenDays(value) {
      const match = value.match(/^(\d{2})\s([A-Z][a-z]{2})\s(\d{2})$/);
      if (!match) return false;
      const electionDate = ["20" + match[3], String(months[match[2]] + 1).padStart(2, "0"), match[1]].join("-");
      const londonParts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/London",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts();
      const london = Object.fromEntries(londonParts.map(({ type, value }) => [type, value]));
      const londonDate = [london.year, london.month, london.day].join("-");
      const windowEnd = new Date(londonDate + "T00:00:00Z");
      windowEnd.setUTCDate(windowEnd.getUTCDate() + 6);
      return electionDate >= londonDate && electionDate <= windowEnd.toISOString().slice(0, 10);
    }

    function validateStake() {
      stakeMessage.textContent = stakeInput.value === "" || validStake()
        ? ""
        : "Minimum stake £10. Maximum stake £29,500. Whole pounds only.";
      return validStake();
    }

    function updatePotentialReturns() {
      const stake = Number(stakeInput.value);
      document.querySelectorAll("[data-decimal-odds]").forEach(element => {
        const decimal = Number(element.dataset.decimalOdds);
        element.textContent = validStake() && Number.isFinite(decimal)
          ? "Potential return " + potentialReturnFormatter.format(stake * decimal)
          : "Potential return —";
      });
    }

    async function loadMarket() {
      try {
        const response = await fetch(ODDS_SHEET_URL);
        if (!response.ok) throw new Error("The by-election sheet request failed.");
        const [headers, ...rows] = parseCsv(await response.text());
        const dateColumn = headers.indexOf("BY-ELECTION DATE");
        const authorityColumn = headers.indexOf("LOCAL AUTHORITY");
        const wardColumn = headers.indexOf("WARD / DIVISION");
        const defendingColumn = headers.indexOf("DEFENDING PARTY");
        const candidateListPendingColumn = defendingColumn + 1;
        const firstOddsColumn = headers.indexOf("LABOUR", defendingColumn + 1);
        const lastOddsColumn = headers.indexOf("OTHER", firstOddsColumn + 1);
        const market = rows.find(row =>
          row[dateColumn] === requested.date &&
          row[authorityColumn] === requested.authority &&
          row[wardColumn] === requested.ward
        );
        if (!market || firstOddsColumn === -1 || lastOddsColumn === -1) {
          throw new Error("This by-election market is unavailable.");
        }
        if ((market[candidateListPendingColumn] || "").trim().toUpperCase() === "YES") {
          throw new Error("Odds are unavailable.");
        }
        if (!isWithinNextSevenDays(market[dateColumn])) {
          throw new Error("Odds are available only for elections in the next 7 days.");
        }

        document.getElementById("date").textContent = market[dateColumn];
        document.getElementById("authority").textContent = market[authorityColumn];
        document.getElementById("ward").textContent = market[wardColumn];
        document.getElementById("defending").textContent = market[defendingColumn] || "—";
        document.getElementById("market-title").textContent = market[wardColumn] + " by-election";
        const candidates = headers.slice(firstOddsColumn, lastOddsColumn + 1).flatMap((party, index) => {
          const odds = (market[firstOddsColumn + index] || "").trim();
          const fractionalOdds = Number(odds);
          return Number.isFinite(fractionalOdds) && fractionalOdds > 0
            ? [{
              party,
              ...getOdds(odds)
            }]
            : [];
        }).sort((left, right) => left.decimal - right.decimal);
        if (!candidates.length) throw new Error("No candidate odds are currently available.");

        const fragment = document.createDocumentFragment();
        candidates.forEach(({ party, fractional, decimal }) => {
          const row = document.createElement("tr");
          row.dataset.party = partySlug(party);
          row.tabIndex = 0;
          const partyCell = document.createElement("td");
          partyCell.textContent = PARTY_NAMES[party] || party;
          const oddsCell = document.createElement("td");
          const fractionalOdds = document.createElement("span");
          fractionalOdds.textContent = fractional;
          const potentialReturn = document.createElement("span");
          potentialReturn.className = "potential-return";
          potentialReturn.dataset.decimalOdds = String(decimal);
          oddsCell.append(fractionalOdds, potentialReturn);
          const continueToConfirmation = () => {
            if (!validateStake()) {
              stakeInput.focus();
              return;
            }
            const query = new URLSearchParams({
              market: market[wardColumn] + " by-election, " + market[dateColumn],
              party: PARTY_NAMES[party] || party,
              fractional,
              decimal: String(decimal),
              stake: stakeInput.value,
              currency: "gbp",
              gbpStake: stakeInput.value
            });
            window.location.assign("/confirm/?" + query.toString());
          };
          const chevronCell = document.createElement("td");
          chevronCell.className = "selection-chevron";
          const chevron = document.createElement("button");
          chevron.type = "button";
          chevron.setAttribute("aria-label", "Place bet on " + (PARTY_NAMES[party] || party));
          chevron.textContent = "›";
          chevron.addEventListener("click", event => {
            event.stopPropagation();
            continueToConfirmation();
          });
          chevronCell.appendChild(chevron);
          row.append(partyCell, chevronCell, oddsCell);
          row.addEventListener("click", continueToConfirmation);
          row.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              continueToConfirmation();
            }
          });
          fragment.appendChild(row);
        });
        candidatesTable.querySelector("tbody").appendChild(fragment);
        updatePotentialReturns();
        details.hidden = false;
        stakePanel.hidden = false;
        candidatesTable.hidden = false;
        status.hidden = true;
      } catch (error) {
        status.textContent = error.message;
      }
    }

    stakeInput.addEventListener("input", () => {
      validateStake();
      updatePotentialReturns();
    });
    loadMarket();
  </script>
</body>
</html>
