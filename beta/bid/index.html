<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pwllheli Community & Proposed BID Map</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map {
      height: 100vh;
      width: 100vw;
    }
    .leaflet-control-layers {
      font-size: 14px;
      padding: 6px 10px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Leaflet Map centered on Pwllheli
    const map = L.map('map').setView([52.888, -4.415], 13);

    // Add OpenStreetMap Tile Layer
    const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Layer Groups for toggling
    const communityLayerGroup = L.layerGroup().addTo(map);
    const bidLayerGroup = L.layerGroup(); // Add your BID GeoJSON here when ready

    // Add Layer Control to toggle overlays
    const overlays = {
      "Pwllheli Community": communityLayerGroup,
      "Proposed BID": bidLayerGroup
    };

    L.control.layers(null, overlays, { collapsed: false }).addTo(map);

    // Fetch GeoJSON from MapIt API
    fetch('https://mapit.mysociety.org/area/64342.geojson')
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.json();
      })
      .then(geoJsonData => {
        const geoJsonLayer = L.geoJSON(geoJsonData, {
          style: {
            color: "#3388ff",
            weight: 3,
            fillOpacity: 0.2
          },
          onEachFeature: function (feature, layer) {
            if (feature.properties && feature.properties.name) {
              layer.bindPopup(`<strong>${feature.properties.name}</strong>`);
            }
          }
        });
        
        // Add to our community layer group and fit map bounds
        communityLayerGroup.addLayer(geoJsonLayer);
        map.fitBounds(geoJsonLayer.getBounds());
      })
      .catch(error => {
        console.error('Error fetching GeoJSON data:', error);
      });
  </script>
</body>
</html>
