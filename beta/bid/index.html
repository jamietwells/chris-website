<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pwllheli BID Levy Payers</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="https://threetwosix.co.uk/beta/tarian-shield.svg">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map {
      height: 100vh;
      width: 100vw;
    }
    .leaflet-control-layers {
      font-size: 14px;
      padding: 6px 10px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Leaflet Map centered on Pwllheli
    const map = L.map('map').setView([52.888, -4.415], 13);

    // Add OpenStreetMap Tile Layer
    const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Layer Groups for toggling
    const communityLayerGroup = L.layerGroup().addTo(map);
    const bidLayerGroup = L.layerGroup().addTo(map);

    // Add Layer Control to toggle overlays
    const overlays = {
      "Pwllheli Community": communityLayerGroup,
      "Proposed BID": bidLayerGroup
    };

    L.control.layers(null, overlays, { collapsed: false }).addTo(map);

    // 1. Fetch and add Community Boundary from MapIt API (Dark Blue, Transparent Fill)
    fetch('https://mapit.mysociety.org/area/64342.geojson')
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.json();
      })
      .then(geoJsonData => {
        const communityLayer = L.geoJSON(geoJsonData, {
          style: {
            color: "#00008B",      // Dark blue border
            weight: 3,
            fillColor: "#00008B",  // Dark blue fill
            fillOpacity: 0.1       // Transparent fill
          },
          onEachFeature: function (feature, layer) {
            if (feature.properties && feature.properties.name) {
              layer.bindPopup(`<strong>${feature.properties.name}</strong>`);
            }
          }
        });
        
        communityLayerGroup.addLayer(communityLayer);
        map.fitBounds(communityLayer.getBounds());
      })
      .catch(error => {
        console.error('Error fetching Community GeoJSON data:', error);
      });

    // 2. Proposed BID Boundary GeoJSON
    const bidGeoJsonData = {
      "type": "Feature",
      "properties": {
        "name": "PROPOSED BID BOUNDARY"
      },
      "geometry": {
        "type": "Polygon",
        "coordinates": [
          [
            [ -4.415650857, 52.89010964 ],
            [ -4.406803175985511, 52.89548998 ],
            [ -4.406803175985511, 52.878571694368645 ],
            [ -4.427000334809685, 52.878571694368645 ],
            [ -4.427000334809685, 52.89010964 ],
            [ -4.415650857, 52.89010964 ]
          ]
        ]
      }
    };

    // Add BID Boundary to its Layer Group
    const bidLayer = L.geoJSON(bidGeoJsonData, {
      style: {
        color: "#8040cc",       // Purple/pink border matching KML style
        weight: 2,
        fillColor: "#8040cc",   // Purple/pink fill
        fillOpacity: 0.2        // Transparent fill
      },
      onEachFeature: function (feature, layer) {
        if (feature.properties && feature.properties.name) {
          layer.bindPopup(`<strong>${feature.properties.name}</strong>`);
        }
      }
    });

    bidLayerGroup.addLayer(bidLayer);
  </script>
</body>
</html>
