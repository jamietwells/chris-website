    #map {
      height: 100vh;

    /* Custom Walks Key Panel styling */
    .walks-key-control {
      background: white;
      padding: 12px 15px;
      font-size: 13px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      border-radius: 6px;
      line-height: 1.5;
      min-width: 260px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .walks-key-control h4 {
      margin: 0 0 8px 0;
      font-size: 14px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 4px;
    }
    .walk-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .walk-item label {
      display: flex;
      align-items: center;
      cursor: pointer;
      flex-grow: 1;
    }
    .walk-color-box {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      border: 1px solid #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }
    .walk-info {

    }
    .walk-name {

    }
    .walk-desc {

    }
    .walk-count {

      color: #444;
      background: #f1f1f1;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 6px;
      flex-shrink: 0;

  </style>

      { postcode: "LL53 6YP", lat: 52.897811, lng: -4.3946373, households: 1, walk: 7 }
    ];

    // ==========================================
    // MAP SETUP
    // ==========================================

    // Initialize Leaflet Map centered on Pwllheli
    const map = L.map('map').setView([52.888, -4.415], 13);

    // Add OpenStreetMap Tile Layer
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Create separate layer groups for each walk
    const walkLayers = {};
    const walkPropertyCounts = {};

    // Initialize counters and groups
    for (let i = 1; i <= 7; i++) {
      walkLayers[i] = L.layerGroup().addTo(map);
      walkPropertyCounts[i] = { properties: 0, households: 0 };
    }

    // Process data and populate markers
    electorsData.forEach(item => {
      const walkNum = item.walk;
      if (walkPropertyCounts[walkNum]) {
        walkPropertyCounts[walkNum].properties += 1;
        walkPropertyCounts[walkNum].households += item.households;
      }

      const walkCfg = walksConfig[walkNum] || { color: '#ff0000', description: 'UNKNOWN' };
      const markerRadius = Math.max(4, Math.sqrt(item.households) * 2.5);

      const marker = L.circleMarker([item.lat, item.lng], {
        radius: markerRadius,
        color: '#ffffff',       // White border
        fillColor: walkCfg.color, // Walk-specific color fill
        fillOpacity: 1,
        weight: 2               // Border width
      });

      marker.bindPopup(`<strong>Walk ${walkNum}: ${walkCfg.description}</strong><br>Postcode: ${item.postcode}<br>Households: ${item.households}`);
      
      if (walkLayers[walkNum]) {
        walkLayers[walkNum].addLayer(marker);
      }
    });

    // Auto-fit map to markers bounds
    const allGroup = L.featureGroup(Object.values(walkLayers));
    map.fitBounds(allGroup.getBounds(), { padding: [30, 30] });

    // ==========================================
    // CUSTOM WALKS KEY / LEGEND CONTROL
    // ==========================================

    const WalksKeyControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd: function (map) {
        const container = L.DomUtil.create('div', 'walks-key-control');
        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);

        let html = `<h4>Walks Key</h4>`;

        for (let i = 1; i <= 7; i++) {
          const cfg = walksConfig[i];
          const stats = walkPropertyCounts[i];
          html = html + `
            <div class="walk-item">
              <label>
                <input type="checkbox" class="walk-toggle-checkbox" data-walk="${i}" checked style="margin-right:8px;">
                <span class="walk-color-box" style="background-color: ${cfg.color};"></span>
                <div class="walk-info">
                  <div class="walk-name">Walk ${i}: ${cfg.description}</div>
                </div>
              </label>
              <span class="walk-count" title="${stats.properties} locations, ${stats.households} households">${stats.households} h/h</span>
            </div>
          `;
        }

        container.innerHTML = html;

        // Add event listeners for toggling layers
        setTimeout(() => {
          const checkboxes = container.querySelectorAll('.walk-toggle-checkbox');
          checkboxes.forEach(chk => {
            chk.addEventListener('change', (e) => {
              const walkId = e.target.getAttribute('data-walk');
              if (e.target.checked) {
                map.addLayer(walkLayers[walkId]);
              } else {
                map.removeLayer(walkLayers[walkId]);
              }
            });
          });
        }, 0);

        return container;
      }
    });

    map.addControl(new WalksKeyControl());
