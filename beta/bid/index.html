      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.json();
      })
      .then(geoJsonData => {
        const communityLayer = L.geoJSON(geoJsonData, {
          style: {
            color: "#00008B",      // Dark blue border
            weight: 3,
            fillColor: "#00008B",  // Dark blue fill
            fillOpacity: 0.1       // Transparent fill
          },
          onEachFeature: function (feature, layer) {
            if (feature.properties && feature.properties.name) {
              layer.bindPopup(`<strong>${feature.properties.name}</strong>`);
            }
          }
        });
        
        communityLayerGroup.addLayer(communityLayer);
        map.fitBounds(communityLayer.getBounds());
      })
      .catch(error => {
        console.error('Error fetching Community GeoJSON data:', error);
      });
