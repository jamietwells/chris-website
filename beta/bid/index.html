<html lang="en-GB">

  <title>Gogledd Pwllheli</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="https://threetwosix.co.uk/beta/tarian-shield.svg">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map {
      height: 100vh;
      width: 100vw;
    }
    .leaflet-control-layers {
      font-size: 14px;
      padding: 6px 10px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Leaflet Map centered on Pwllheli
    const map = L.map('map').setView([52.888, -4.415], 13);

    // Add OpenStreetMap Tile Layer
    const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Layer Groups for toggling
    const communityLayerGroup = L.layerGroup().addTo(map);
    const bidLayerGroup = L.layerGroup();
    const electorsLayerGroup = L.layerGroup().addTo(map);

    // Add Layer Control to toggle overlays
    const overlays = {
      "Gogledd Pwllheli": communityLayerGroup,
      "Proposed BID": bidLayerGroup,
      "Electors": electorsLayerGroup
    };

    L.control.layers(null, overlays, { collapsed: false }).addTo(map);

    // 1. Fetch and add Community Boundary from MapIt API (Dark Blue, Transparent Fill)
    fetch('https://mapit.mysociety.org/area/166271.geojson')
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.json();
      })
      .then(geoJsonData => {
        const communityLayer = L.geoJSON(geoJsonData, {
          style: {
            color: "#00008B",      // Dark blue border
            weight: 3,
            fillColor: "#00008B",  // Dark blue fill
            fillOpacity: 0.1       // Transparent fill
          },
          onEachFeature: function (feature, layer) {
            if (feature.properties && feature.properties.name) {
              layer.bindPopup(`<strong>${feature.properties.name}</strong>`);
            }
          }
        });
        
        communityLayerGroup.addLayer(communityLayer);
        map.fitBounds(communityLayer.getBounds());
      })
      .catch(error => {
        console.error('Error fetching Community GeoJSON data:', error);
      });

    // 2. Proposed BID Boundary GeoJSON

    electorsData.forEach(item => {
      // Scale radius dynamically based on quantity (using square root for balanced scaling)
      const markerRadius = Math.max(4, Math.sqrt(item.quantity) * 3);

      const marker = L.circleMarker([item.lat, item.lng], {
        radius: markerRadius,
        color: '#ff0000',
