<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gogledd Pwllheli - Walks</title>
  
  <link rel="icon" type="image/svg+xml" href="https://threetwosix.co.uk/beta/tarian-shield.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #map { height: 100vh; width: 100vw; }
    
    .walks-key-control {
      background: white;
      padding: 12px 15px;
      font-size: 13px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      border-radius: 6px;
      line-height: 1.5;
      min-width: 260px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .walks-key-control h4 { margin: 0 0 8px 0; font-size: 14px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
    .walk-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .walk-item label { display: flex; align-items: center; cursor: pointer; flex-grow: 1; }
    .walk-color-box { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-right: 8px; border: 1px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.3); flex-shrink: 0; }
    .walk-info { flex-grow: 1; }
    .walk-name { font-weight: 600; color: #333; }
    .walk-count { font-size: 12px; font-weight: 500; color: #444; background: #f1f1f1; padding: 1px 6px; border-radius: 10px; margin-left: 6px; flex-shrink: 0; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Leaflet Map centered on Pwllheli
    const map = L.map('map').setView([52.888, -4.415], 13);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Fetch separate JSON configuration and data files from GitHub repository
    Promise.all([
      fetch('walks.json').then(res => res.json()),
      fetch('electors.json').then(res => res.json())
    ]).then(([walksConfig, electorsData]) => {

      const walkLayers = {};
      const walkPropertyCounts = {};

      for (let i = 1; i <= 7; i++) {
        walkLayers[i] = L.layerGroup().addTo(map);
        walkPropertyCounts[i] = { properties: 0, households: 0 };
      }

      electorsData.forEach(item => {
        const walkNum = item.walk;
        if (walkPropertyCounts[walkNum]) {
          walkPropertyCounts[walkNum].properties += 1;
          walkPropertyCounts[walkNum].households += item.households;
        }

        const walkCfg = walksConfig[walkNum] || { color: '#ff0000', description: 'UNKNOWN' };
        const markerRadius = Math.max(4, Math.sqrt(item.households) * 2.5);

        const marker = L.circleMarker([item.lat, item.lng], {
          radius: markerRadius,
          color: '#ffffff',
          fillColor: walkCfg.color,
          fillOpacity: 1,
          weight: 2
        });

        marker.bindPopup(`<strong>Walk ${walkNum}: ${walkCfg.description}</strong><br>Postcode: ${item.postcode}<br>Households: ${item.households}`);
        
        if (walkLayers[walkNum]) {
          walkLayers[walkNum].addLayer(marker);
        }
      });

      const allGroup = L.featureGroup(Object.values(walkLayers));
      if (allGroup.getLayers().length > 0) {
        map.fitBounds(allGroup.getBounds(), { padding: [30, 30] });
      }

      // Custom Walks Key Control
      const WalksKeyControl = L.Control.extend({
        options: { position: 'topright' },
        onAdd: function (map) {
          const container = L.DomUtil.create('div', 'walks-key-control');
          L.DomEvent.disableClickPropagation(container);
          L.DomEvent.disableScrollPropagation(container);

          let html = `<h4>Walks Key</h4>`;

          for (let i = 1; i <= 7; i++) {
            const cfg = walksConfig[i];
            const stats = walkPropertyCounts[i];
            html += `
              <div class="walk-item">
                <label>
                  <input type="checkbox" class="walk-toggle-checkbox" data-walk="${i}" checked style="margin-right:8px;">
                  <span class="walk-color-box" style="background-color: ${cfg.color};"></span>
                  <div class="walk-info">
                    <div class="walk-name">Walk ${i}: ${cfg.description}</div>
                  </div>
                </label>
                <span class="walk-count" title="${stats.properties} locations, ${stats.households} households">${stats.households} h/h</span>
              </div>
            `;
          }

          container.innerHTML = html;

          setTimeout(() => {
            container.querySelectorAll('.walk-toggle-checkbox').forEach(chk => {
              chk.addEventListener('change', (e) => {
                const walkId = e.target.getAttribute('data-walk');
                if (e.target.checked) {
                  map.addLayer(walkLayers[walkId]);
                } else {
                  map.removeLayer(walkLayers[walkId]);
                }
              });
            });
          }, 0);

          return container;
        }
      });

      map.addControl(new WalksKeyControl());

    }).catch(error => {
      console.error('Error loading configuration or data files:', error);
    });
  </script>
</body>
</html>
