  <div id="map"></div>

    // Initialize Leaflet Map centered on Pwllheli
    const map = L.map('map').setView([52.888, -4.415], 13);

    // Add OpenStreetMap Tile Layer
    const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Layer Groups for toggling
    const communityLayerGroup = L.layerGroup().addTo(map);
    const bidLayerGroup = L.layerGroup();
    const electorsLayerGroup = L.layerGroup().addTo(map);

    // Add Layer Control to toggle overlays
    const overlays = {
      "Gogledd Pwllheli": communityLayerGroup,
      "Proposed BID": bidLayerGroup,
      "Electors": electorsLayerGroup
    };

    L.control.layers(null, overlays, { collapsed: false }).addTo(map);

    // 1. Fetch and add Community Boundary from MapIt API (Dark Blue, Transparent Fill)
    fetch('https://mapit.mysociety.org/area/166271.geojson')
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.json();
      })
      .then(geoJsonData => {
        const communityLayer = L.geoJSON(geoJsonData, {
          style: {
            color: "#00008B",      // Dark blue border
            weight: 3,
            fillColor: "#00008B",  // Dark blue fill
            fillOpacity: 0.1       // Transparent fill
          },
          onEachFeature: function (feature, layer) {
            if (feature.properties && feature.properties.name) {
              layer.bindPopup(`<strong>${feature.properties.name}</strong>`);
            }
          }
        });
        
        communityLayerGroup.addLayer(communityLayer);
        map.fitBounds(communityLayer.getBounds());
      })
      .catch(error => {
        console.error('Error fetching Community GeoJSON data:', error);
      });
