    async function fetchAndCleanJSON(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error('HTTP error loading ' + url + ': ' + response.status);
      const text = await response.text();
      const sanitized = text.replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
      try {
        return JSON.parse(sanitized);
      } catch (parseError) {
        try {
          return (new Function('return ' + sanitized))();
        } catch (evalError) {
          throw new Error(`JSON Syntax Error in ${url}: ${parseError.message}`);
        }
      }
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;
      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        if (character === '"') {
          if (quoted && text[index + 1] === '"') {
            value += '"';
            index += 1;
          } else {
            quoted = !quoted;
          }
        } else if (character === "," && !quoted) {
          row.push(value);
          value = "";
        } else if ((character === "\n" || character === "\r") && !quoted) {
          if (character === "\r" && text[index + 1] === "\n") index += 1;
          row.push(value);
          if (row.some(cell => cell.trim())) rows.push(row);
          row = [];
          value = "";
        } else {
          value += character;
        }
      }
      if (value || row.length) {
        row.push(value);
        rows.push(row);
      }
      return rows;
    }

    async function fetchMappingData() {
      const MAX_RECORD = 1774; // records after this are not shown on the map
      const isBidMode = BID_MODE;
      // Fetch electors data live from Google Sheets using CSV export (gviz endpoint)
      try {
        const sheetId = '1OS8iu7s0CAD__v1i_2kIOiIGvgmNiRN3KAAI4V9XyaE';
        const electorsGid = isBidMode ? '420468764' : '111968984';
        const refGid = '276500892';
        
        // Use gviz CSV export endpoint to fetch live data (no API key required)
        const electorsUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&gid=${electorsGid}`;
        const refUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&gid=${refGid}`;
        
        const [eResponse, rResponse] = await Promise.all([
          fetch(electorsUrl),
          fetch(refUrl)
        ]);
        
        if (!eResponse.ok || !rResponse.ok) {
          throw new Error('Failed to fetch from Google Sheets API');
        }
        
        const electorsText = await eResponse.text();
        const refText = await rResponse.text();
        
        const electorsLines = parseCsv(electorsText);
        const refLines = parseCsv(refText);
        if (electorsLines.length === 0) {
          throw new Error('Failed to parse electors CSV');
        }
        
        const items = [];
        let pvCount = 0;
        let pvWithCoords = 0;
        
        // Get header to determine column indices

        if (!headerRow) {
          throw new Error('CSV has no header row');
        }
        const headers = headerRow.map(h => h.trim());
        const postalIndex = headers.findIndex(h => h.trim() === 'PV?');
        const shuttleworthIndex = headers.findIndex(h => h.trim() === 'SHUTTLEWORTH');
        const walkIndex = headers.findIndex(h => h.trim() === 'WALK');
        const latIndex = headers.findIndex(h => h.trim() === 'LATITUDE');
        const lngIndex = headers.findIndex(h => h.trim() === 'LONGITUDE');
        const addressLine1Index = headers.findIndex(h => h.trim() === 'ADDRESS LINE 1');
        const addressLine2Index = headers.findIndex(h => h.trim() === 'ADDRESS LINE 2');
        const addressLine3Index = headers.findIndex(h => h.trim() === 'ADDRESS LINE 3');
        const postTownIndex = headers.findIndex(h => h.trim() === 'POST TOWN');
        const postcodeIndex = headers.findIndex(h => h.trim() === 'POSTCODE');
        const electorsIndex = (() => {
          // Find ALL occurrences of ELECTORS and use the second one (first one is duplicate/wrong)
          let count = 0;
          for (let i = 0; i < headers.length; i++) {
            if (headers[i].trim() === 'ELECTORS') {
              count++;
              if (count === 2) {
                return i;
              }
            }
          }
          return -1;  // Not found
        })();
        const householdIdIndex = headers.findIndex(h => h.trim() === 'Household ID');
        const envelopeNameIndex = headers.findIndex(h => h.trim() === 'ENVELOPE NAME');
        const subroadIndex = headers.findIndex(h => h.trim() === 'SUBROAD');
        const sortOrderIndex = headers.findIndex(h => h.trim() === 'SORT ORDER');
        
        let shuttleworthFound = [];
        for (let i = 1; i < electorsLines.length && (isBidMode || i <= MAX_RECORD); i++) {
          const cells = electorsLines[i];
          if (!cells || cells.length === 0) continue;
          
          const isPostalVoter = postalIndex >= 0 && cells[postalIndex] && cells[postalIndex].trim().toUpperCase() === 'POSTAL';
          const isShuttleworth = shuttleworthIndex >= 0 && cells[shuttleworthIndex] && cells[shuttleworthIndex].trim() !== '';
          
          if (isShuttleworth) {
            shuttleworthFound.push({ row: i, value: cells[shuttleworthIndex], address: cells[addressLine1Index] });
          }
          
          if (isPostalVoter) {
            pvCount++;
            const lat = latIndex >= 0 ? parseFloat(cells[latIndex]) : 0;
            const lng = lngIndex >= 0 ? parseFloat(cells[lngIndex]) : 0;
            if (Number.isFinite(lat) && Number.isFinite(lng)) {

          items.push({

            labelPrefix: '',

            addressText: '',
            addressLine1: addressLine1Index >= 0 ? cells[addressLine1Index] : '',
            addressLine2: addressLine2Index >= 0 ? cells[addressLine2Index] : '',
            addressLine3: addressLine3Index >= 0 ? cells[addressLine3Index] : '',
            postcode: postcodeIndex >= 0 ? cells[postcodeIndex] : '',
            electors: electorsIndex >= 0 ? parseInt(cells[electorsIndex]) || 1 : 1,
            isPostalVoter: isPostalVoter,
            isShuttleworth: isShuttleworth,
            subroad: subroadIndex >= 0 ? cells[subroadIndex] : '',
            sortOrder: sortOrderIndex >= 0 ? cells[sortOrderIndex] : '',
            walk: walkIndex >= 0 ? String(cells[walkIndex]) : '',
            lat: latIndex >= 0 ? parseFloat(cells[latIndex]) || 0 : 0,

        }

        const refCounts = {};
        
        if (refLines[11]) {

          // Reference sheet has: E=POLLING DISTRICT, F=WALK, I=DOORS, J=ELECTORS

            const walk = cells[5].trim();
            if (walk && /^\d+$/.test(walk)) {
              const doors = parseInt(cells[8]) || 0;
              const electors = parseInt(cells[9]) || 0;
              if (!refCounts[walk]) {
                refCounts[walk] = { doors, electors };

            const w = normalizeWalkNumber(it.walk);

        return { items, refCounts, pvCount, pvWithCoords };

        errorDiv.style.border = '2px solid red';
        errorDiv.style.padding = '10px';
        errorDiv.style.fontSize = '12px';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.style.maxWidth = '400px';
        errorDiv.style.color = 'white';
        errorDiv.innerHTML = `<strong>FETCH ERROR:</strong><br>${String(error).substring(0, 300)}`;
        document.body.appendChild(errorDiv);
        throw error;
      }
    }

    function parseCSVLine(line) {
      const cells = [];
      let cell = '';
      let inQuotes = false;
      
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const nextChar = line[i + 1];
        
        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          cells.push(cell);
          cell = '';
        } else {
          cell += char;
        }
      }
      cells.push(cell);
      return cells;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function normalizeWalkNumber(walk) {
      const walkNum = String(walk);
      if (walkNum === '0' || walkNum.toUpperCase() === 'DE' || walkNum.toUpperCase().includes('SOUTH')) {
        return '11';
      }
      return walkNum;
    }

    Promise.all([
      fetchAndCleanJSON('./walks.json'),
      fetchMappingData(),
      fetchAndCleanJSON(wardUrls.gogledd).catch(err => { console.warn('Could not load North Ward GeoJSON:', err); return null; }),
      fetchAndCleanJSON(wardUrls.de).catch(err => { console.warn('Could not load South Ward GeoJSON:', err); return null; })
    ]).then(([walksConfig, mappingData, gogleddGeoJson, deGeoJson]) => {
      const { items: itemsList, refCounts, pvCount } = mappingData;
      walkLayers = {};
      walkMarkers = {};
      walkPropertyCounts = refCounts ? { ...refCounts } : {};
      const wardTotals = {
        gogledd: { households: 0, electors: 0 },
        de: { households: 0, electors: 0 }
      };
      mapBoundsCoords = [];
      wardLayers = {};

      const rawWards = { gogledd: gogleddGeoJson, de: deGeoJson };
      Object.keys(rawWards).forEach(key => {
        const geojson = rawWards[key];
        if (geojson) {
          const cfg = wardConfigs[key];
          const layer = L.geoJSON(geojson, {
            style: {
              color: cfg.color,
              weight: 3,
              opacity: 1,
              fillColor: cfg.color,
              fillOpacity: cfg.fillOpacity
            },
            onEachFeature: (feature, l) => {
              l.bindPopup(`<strong>Ward Boundary:</strong><br>${cfg.name}`);
            }
          });
          wardLayers[key] = layer;
        }
      });

      // itemsList is already destructured from mappingData in the Promise.all().then() callback above
      const walkKeysSet = new Set();
      if (walksConfig) {
        Object.keys(walksConfig).forEach(k => {
          if (k && k !== '') {
            walkKeysSet.add(String(k));
          }
        });
      }
      itemsList.forEach(item => {
        if (item.walk !== undefined && item.walk !== null && item.walk !== '') {
          const walkNum = normalizeWalkNumber(item.walk);
          if (walkNum && walkNum !== '') {
            walkKeysSet.add(walkNum);
          }
        }
      });
      // Ensure walk 18 exists for suppressed properties
      walkKeysSet.add('18');
      
      const sortedWalkKeys = Array.from(walkKeysSet).sort((a, b) => Number(a) - Number(b));

      sortedWalkKeys.forEach(walkKey => {
        walkLayers[walkKey] = L.layerGroup();
        walkMarkers[walkKey] = [];
        // Keep reference counts from refCounts; only initialize if not already set
        if (!walkPropertyCounts[walkKey]) {
          walkPropertyCounts[walkKey] = { doors: 0, electors: 0 };
        }
      });

      const allBuiltMarkers = [];
      let pvMatchCount = 0;

      itemsList.forEach((item, itemIndex) => {
        const itemId = String(item.id || item.electorId || item.propertyId || '').trim();
        const isHidden = itemId && hiddenIds.has(itemId);

        let walkNum = normalizeWalkNumber(item.walk);
        
        // Reassign hidden properties to walk 18 (SHOW SUPPRESSED PROPERTIES)
        if (isHidden) {
          walkNum = '18';
        }
        
        const electorsCount = Number(item.electors || 1);
        const wardKey = Number(walkNum) < 11 ? 'gogledd' : 'de';
        
        wardTotals[wardKey].households += 1;
        wardTotals[wardKey].electors += electorsCount;
        const walkCfg = walksConfig[walkNum] || { color: '#ff0000', description: 'UNKNOWN' };
        
        // Check if this is a postal voter - if so, use gold color
        const isPostalVoter = postalVoterIds.has(itemId);
        if (isPostalVoter) {
          pvMatchCount++;
        }
        const fillColor = isPostalVoter ? '#FFD700' : walkCfg.color;

        const markerRadius = 7;
        if (!Number.isFinite(item.lat) || !Number.isFinite(item.lng)) {
          return;
        }
        const marker = L.circleMarker([item.lat, item.lng], {
          radius: markerRadius,
          color: '#ffffff',
          fillColor: fillColor,
          fillOpacity: 1,
          weight: 2,
          pane: 'propertyPane'
        });
        
        let cleanAddress = String(item.addressText || '').replace(/\*$/, '').trim();
        // Remove leading erroneous number if formatted like "1, 32 Y Ddol" -> "32 Y Ddol"
        cleanAddress = cleanAddress.replace(/^\d+,\s*/, '');
        const addressParts = cleanAddress.split(',');
        const householdName = addressParts.length > 1 ? addressParts[0].trim() : '';
        const streetAddressParts = addressParts.length > 1 ? addressParts.slice(1) : [cleanAddress];
        const householdLabel = String(walkNum) === '18'
          ? item.labelHouseholdName || item.envelopeName || householdName
          : item.envelopeName || householdName;
        if (String(walkNum) === '18' && householdLabel) {
          const normalizedHouseholdLabel = String(householdLabel).trim().toLowerCase();
          for (let index = streetAddressParts.length - 1; index >= 0; index -= 1) {
            if (streetAddressParts[index].trim().toLowerCase() === normalizedHouseholdLabel) {
              streetAddressParts.splice(index, 1);
            }
          }
        }
        let streetAddress = streetAddressParts.join(',').trim();

        // Insert "Pwllheli" before postcode (e.g. LL53 5PA becomes Pwllheli LL53 5PA)
        streetAddress = streetAddress.replace(/,\s*([A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2})$/i, ', Pwllheli $1');

        const labelTitle = String(walkNum) === '18'
          ? [item.labelPrefix, householdLabel]
            .map(value => String(value ?? '').trim())
            .filter(Boolean)
            .join(' ')
          : householdLabel;
        const popupTitle = labelTitle
          ? `${escapeHtml(labelTitle)}<br>`
          : '';
          
        const pvBadge = item.isPostalVoter ? ' [PV]' : '';
        const walkInfo = item.subroad
          ? `<strong>Walk: ${escapeHtml(item.walk)} / ${escapeHtml(item.subroad)} / ${escapeHtml(item.sortOrder)}</strong>`
          : `<strong>Walk: ${escapeHtml(item.walk)} / ${escapeHtml(item.sortOrder)}</strong>`;
        
        // Build address from the individual address line columns + postcode with Pwllheli (all walks, including 18)
        const addressParts2 = [];
        if (item.addressLine1) addressParts2.push(escapeHtml(item.addressLine1));
        if (item.addressLine2) addressParts2.push(escapeHtml(item.addressLine2));
        if (item.addressLine3) addressParts2.push(escapeHtml(item.addressLine3));
        if (item.postcode) addressParts2.push(`PWLLHELI ${escapeHtml(item.postcode)}`);
        const addressDisplay = addressParts2.length > 0 ? addressParts2.join('<br>') : 'Unknown Address';
        marker.bindPopup(
          `${popupTitle}` +
          `${addressDisplay || 'Unknown Address'}<br>` +
          `Electors (${electorsCount})${pvBadge}<br>` +
          `${walkInfo}`
        );
        
        const markerData = {
          marker,
          walkNum,
          isHidden,
          isPostalVoter: item.isPostalVoter,
          isShuttleworth: item.isShuttleworth,
          electors: electorsCount,
          walkColor: walkCfg.color
        };

        allBuiltMarkers.push(markerData);

        if (walkLayers[walkNum]) {
          walkMarkers[walkNum].push(markerData);
          if (!isHidden) {
            walkLayers[walkNum].addLayer(marker);
          }
        }
        mapBoundsCoords.push([item.lat, item.lng]);
      });

      sortedWalkKeys.forEach(walkKey => {
        const num = Number(walkKey);
        // Show walks 1-17 by default
        if (num >= 1 && num <= 17) {
          walkLayers[walkKey].addTo(map);
        }
      });
      refreshMapView();
      
      if (mapBoundsCoords.length) {
        map.fitBounds(mapBoundsCoords, { padding: [50, 50] });
      }

      const WalksKeyControl = L.Control.extend({
        options: { position: 'topright' },
        onAdd: function (mapInstance) {
          const container = L.DomUtil.create('div', 'walks-key-control');
          L.DomEvent.disableClickPropagation(container);
          L.DomEvent.disableScrollPropagation(container);
          
          let html = `
            <div class="key-header">
              <h4 id="keyTitle">Electors</h4>
              <div class="key-actions">
                <button type="button" class="hide-key-btn" id="hideKeyBtn">Hide Key</button>
              </div>
            </div>
            <div class="key-content">
              <div class="stats-panel">
                <div class="stats-row">
                  <div class="stat-line">
                    <span class="stat-ward">GOGLEDD / NORTH</span>
                    <span class="stat-totals">
                      <span>ELECTORS: ${wardTotals.gogledd.electors}</span>
                      <span>DOORS: ${wardTotals.gogledd.households}</span>
                    </span>
                  </div>
                </div>
                <div class="stats-row">
                  <div class="stat-line">
                    <span class="stat-ward">DE / SOUTH</span>
                    <span class="stat-totals">
                      <span>ELECTORS: ${wardTotals.de.electors}</span>
                      <span>DOORS: ${wardTotals.de.households}</span>
                    </span>
                  </div>
                </div>
              </div>
              <button type="button" id="switchSourceBtn" style="width:100%;margin:6px 0 8px;padding:8px;font-weight:bold;cursor:pointer;">${BID_MODE ? 'SWITCH TO ELECTORS' : 'SWITCH TO BID'}</button>
              <div class="section-title">Ward Boundaries</div>
          `;

          ['gogledd', 'de'].forEach(key => {
            const cfg = wardConfigs[key];
            const isLoaded = !!wardLayers[key];
            const isChecked = false;
            html += `
              <div class="walk-item">
                <label>
                  <input type="checkbox" class="ward-toggle-checkbox" data-ward="${key}" ${isChecked ? 'checked' : ''} ${!isLoaded ? 'disabled' : ''} style="margin-right:8px;">

                </label>
              </div>
            `;
          });

          html += `
           <div class="section-title">Walks</div>`;

          sortedWalkKeys.forEach(walkKey => {
            // Skip walk 18 placeholder, it will be shown below with updated counter logic
            if (walkKey === '18') return;
            
            const cfg = walksConfig[walkKey] || { description: `WALK ${walkKey}`, color: '#000000' };

          });
          
          // Add Walk 18 (SHOW SUPPRESSED PROPERTIES)
          const walk18Cfg = walksConfig['18'] || { description: 'SHOW SUPPRESSED PROPERTIES', color: '#000000' };

          html += `

                  <div class="walk-name">${walk18Cfg.description}</div>

            </div>
          `;

          html += `
           <div class="walk-item">
            <label>
              <input type="checkbox" id="show-pvs-only-toggle" style="margin-right:8px;">
              <span class="walk-color-box" style="background-color: #FFD700;"></span>
              <div class="walk-info">
                <div class="walk-name">SHOW PVs ONLY</div>
              </div>
            </label>
          </div>
          <div class="walk-item">
            <label>
              <input type="checkbox" id="highlight-pvs-toggle" style="margin-right:8px;">
              <span class="walk-color-box" style="background-color: #FFD700;"></span>
              <div class="walk-info">
                <div class="walk-name">HIGHLIGHT PVs</div>
              </div>
            </label>
          </div>
          <div class="walk-item">
            <label>
              <input type="checkbox" id="show-shuttleworth-only-toggle" style="margin-right:8px;">
              <span class="walk-color-box" style="background-color: #9C27B0;"></span>
              <div class="walk-info">
                <div class="walk-name">SHOW SHUTTLEWORTH ONLY</div>
              </div>
            </label>
          </div>`;

          html += `
            <div class="key-footer-link">
              <a href="https://threetwosix.co.uk/beta/candidates.html">CANDIDATES</a>
              <a href="https://threetwosix.co.uk/beta/volunteers.html">VOLUNTEERS</a>
              <a href="https://threetwosix.co.uk/beta/shuttleworth">SHUTTLEWORTH</a>
            </div>
          </div>`;
          container.innerHTML = html;

          const titleEl = container.querySelector('#keyTitle');
          const hideKeyBtn = container.querySelector('#hideKeyBtn');
          const showPVsOnlyToggle = container.querySelector('#show-pvs-only-toggle');
          const highlightPVsToggle = container.querySelector('#highlight-pvs-toggle');
          const showShuttleworthOnlyToggle = container.querySelector('#show-shuttleworth-only-toggle');

          function updateToggleColors() {
            // Update SHOW PVs only toggle color
            const showPVsColorBox = showPVsOnlyToggle.parentElement.querySelector('.walk-color-box');
            if (showPVsColorBox) {
              showPVsColorBox.style.backgroundColor = showPVsOnlyToggle.checked ? '#0aa77d' : '#da291c';
            }
            
            // Update SHOW SHUTTLEWORTH ONLY toggle color
            const showShuttleworthColorBox = showShuttleworthOnlyToggle.parentElement.querySelector('.walk-color-box');
            if (showShuttleworthColorBox) {
              showShuttleworthColorBox.style.backgroundColor = showShuttleworthOnlyToggle.checked ? '#0aa77d' : '#da291c';
            }
          }

          function updateMarkersVisibility() {
            const showPVsOnly = showPVsOnlyToggle.checked;
            const showShuttleworthOnly = showShuttleworthOnlyToggle.checked;
            const highlightPVs = highlightPVsToggle.checked;

            container.querySelectorAll('.walk-toggle-checkbox').forEach(chk => {
              const walkKey = chk.getAttribute('data-walk');
              const layer = walkLayers[walkKey];
              const isWalkChecked = chk.checked;

              layer.clearLayers();
              
              // Hide Walk 18 when SHOW PVs ONLY is enabled
              if (showPVsOnly && walkKey === '18') {
                return; // Don't add any markers from Walk 18
              }
              
              walkMarkers[walkKey].forEach(markerData => {
                if (isWalkChecked) {
                  // Apply filters - if both are enabled, show if EITHER condition matches (OR logic)
                  // If only one is enabled, require that one
                  let shouldShow = true;
                  
                  if (showPVsOnly || showShuttleworthOnly) {
                    // At least one filter is enabled
                    shouldShow = false;
                    if (showPVsOnly && markerData.isPostalVoter) {
                      shouldShow = true;
                    }
                    if (showShuttleworthOnly && markerData.isShuttleworth) {
                      shouldShow = true;
                    }
                  }
                  
                  if (!shouldShow) {
                    return; // Skip this marker
                  }
                  
                  // Set color: gold if PV + HIGHLIGHT enabled, otherwise use walk color
                  let markerColor = markerData.walkColor;
                  if (markerData.isPostalVoter && highlightPVs) {
                    markerColor = '#FFD700';
                  }
                  markerData.marker.setStyle({ fillColor: markerColor });
                  layer.addLayer(markerData.marker);
                }
              });
            });
            updateTotalElectors();
            // Don't call updateWalkCounts here - it will overwrite the reference sheet counts
            // with marker-based counts. Only call it when filters change.
          }

          function updateWalkCounts() {
            const showPVsOnly = showPVsOnlyToggle.checked;
            const showShuttleworthOnly = showShuttleworthOnlyToggle.checked;

            container.querySelectorAll('.walk-toggle-checkbox').forEach(checkbox => {
              const walkId = checkbox.getAttribute('data-walk');
              const walkItemDiv = checkbox.closest('.walk-item');
              const countDisplay = walkItemDiv?.querySelector('.walk-count');
              
              if (!countDisplay) return;
              countDisplay.style.display = checkbox.checked ? '' : 'none';
              
              // Hide Walk 18 count when SHOW PVs ONLY is enabled
              if (showPVsOnly && walkId === '18') {
                countDisplay.textContent = '0 / 0';
                return;
              }
              
              // Only count if checkbox is checked
              if (!checkbox.checked) {
                countDisplay.textContent = '0 / 0';
                return;
              }
              
              // Get reference counts (from reference sheet)
              const refStats = walkPropertyCounts[walkId] || { doors: 0, electors: 0 };
              
              // If filters are enabled, calculate filtered counts from markers
              if (showPVsOnly || showShuttleworthOnly) {
                const allMarkers = walkMarkers[walkId] || [];
                let markersToCount = allMarkers.filter(m => {
                  if (showPVsOnly && m.isPostalVoter) return true;
                  if (showShuttleworthOnly && m.isShuttleworth) return true;
                  return false;
                });
                
                let totalDoors = markersToCount.length;
                let totalElectors = markersToCount.reduce((sum, m) => sum + (m.electors || 0), 0);
                countDisplay.textContent = `${totalElectors} / ${totalDoors}`;
              } else {
                // No filters: use reference sheet counts
                countDisplay.textContent = `${refStats.electors || 0} / ${refStats.doors || 0}`;
              }
            });
          }

          function onToggleChange() {
            const panel = document.getElementById('debug-panel');
            if (panel) {
              panel.innerHTML += `<div style="color: blue; margin-top: 5px;">Toggle change: HIGHLIGHT=${highlightPVsToggle.checked}, SHOW_PVs=${showPVsOnlyToggle.checked}</div>`;
            }
            updateToggleColors();
            updateMarkersVisibility();
            updateWalkCounts();
            updateTotalElectors();
          }

          L.DomEvent.on(showPVsOnlyToggle, 'change', onToggleChange);
          L.DomEvent.on(highlightPVsToggle, 'change', updateMarkersVisibility);
          L.DomEvent.on(showShuttleworthOnlyToggle, 'change', onToggleChange);

          // Initialize toggle colors on load
          updateToggleColors();
          updateMarkersVisibility();

          function updateTotalElectors() {
            let total = 0;
            let doors = 0;
            const showPVsOnly = showPVsOnlyToggle.checked;
            const showShuttleworthOnly = showShuttleworthOnlyToggle.checked;

            container.querySelectorAll('.walk-toggle-checkbox').forEach(chk => {
              if (!chk.checked) return;
              const walkId = chk.getAttribute('data-walk');
              walkMarkers[walkId].forEach(({ isPostalVoter, isShuttleworth, electors }) => {
                if (showPVsOnly && !isPostalVoter) return;
                if (showShuttleworthOnly && !isShuttleworth) return;
                total += electors;
                doors += 1;
              });
            });
            titleEl.textContent = `${BID_MODE ? 'BID' : 'Electors'} (${total}) Doors (${doors})`;
          }

          function isWalkInWard(walkNumber, wardCode) {
            return (wardCode === 'JA1' && walkNumber >= 1 && walkNumber <= 10) ||
              (wardCode === 'JB1' && walkNumber >= 11 && walkNumber <= 17);
          }

          function updateWardWalkToggleState() {
            container.querySelectorAll('.ward-walk-toggle').forEach(toggle => {
              const wardCode = toggle.getAttribute('data-ward-walk');
              const wardWalks = Array.from(container.querySelectorAll('.walk-toggle-checkbox'))
                .filter(walkToggle => {
                  const walkNumber = Number(walkToggle.getAttribute('data-walk'));
                  return isWalkInWard(walkNumber, wardCode);
                });
              const checkedCount = wardWalks.filter(walkToggle => walkToggle.checked).length;
              toggle.checked = wardWalks.length > 0 && checkedCount === wardWalks.length;
              toggle.indeterminate = checkedCount > 0 && checkedCount < wardWalks.length;
            });
          }

          container.querySelectorAll('.ward-walk-toggle').forEach(toggle => {
            L.DomEvent.on(toggle, 'change', function (e) {
              const wardCode = e.target.getAttribute('data-ward-walk');
              const shouldShow = e.target.checked;
              const showPVsOnly = showPVsOnlyToggle.checked;
              const highlightPVs = highlightPVsToggle.checked;

              container.querySelectorAll('.walk-toggle-checkbox').forEach(walkToggle => {
                const walkId = walkToggle.getAttribute('data-walk');
                const walkNumber = Number(walkId);
                if (!isWalkInWard(walkNumber, wardCode)) return;
                walkToggle.checked = shouldShow;
                
                const layer = walkLayers[walkId];
                layer.clearLayers();
                if (shouldShow) {
                  walkMarkers[walkId].forEach(markerData => {
                    if (!markerData.isHidden) {
                      if (!showPVsOnly || markerData.isPostalVoter) {
                        let activeColor = markerData.walkColor;
                        if (markerData.isPostalVoter && highlightPVs) {
                          activeColor = '#FFD700';
                        }
                        markerData.marker.setStyle({ fillColor: activeColor });
                        layer.addLayer(markerData.marker);
                      }
                    }
                  });
                  mapInstance.addLayer(layer);
                } else {
                  mapInstance.removeLayer(layer);
                }
              });
              updateWardWalkToggleState();
              updateTotalElectors();
              updateWalkCounts();
            });
          });

          container.querySelectorAll('.ward-toggle-checkbox').forEach(chk => {
            L.DomEvent.on(chk, 'change', function (e) {
              const wardKey = e.target.getAttribute('data-ward');
              if (wardLayers[wardKey]) {
                if (e.target.checked) {
                  mapInstance.addLayer(wardLayers[wardKey]);
                } else {
                  mapInstance.removeLayer(wardLayers[wardKey]);
                }
              }
            });
          });

          container.querySelectorAll('.walk-toggle-checkbox').forEach(chk => {
            L.DomEvent.on(chk, 'change', function (e) {
              const walkId = e.target.getAttribute('data-walk');
              const showPVsOnly = showPVsOnlyToggle.checked;
              const highlightPVs = highlightPVsToggle.checked;
              const layer = walkLayers[walkId];
              
              layer.clearLayers();
              if (e.target.checked) {
                walkMarkers[walkId].forEach(markerData => {
                  if (!markerData.isHidden) {
                    if (!showPVsOnly || markerData.isPostalVoter) {
                      let activeColor = markerData.walkColor;
                      if (markerData.isPostalVoter && highlightPVs) {
                        activeColor = '#FFD700';
                      }
                      markerData.marker.setStyle({ fillColor: activeColor });
                      layer.addLayer(markerData.marker);
                    }
                  }
                });
                mapInstance.addLayer(layer);
              } else {
                mapInstance.removeLayer(layer);
              }
              updateWardWalkToggleState();
              updateTotalElectors();
              updateWalkCounts();
            });
          });

          L.DomEvent.on(container.querySelector('#switchSourceBtn'), 'click', function (e) {
            L.DomEvent.stop(e);
            const url = new URL(location.href);
            if (BID_MODE) url.searchParams.set('source', 'electors'); else url.searchParams.delete('source');
            location.href = url.toString();

          L.DomEvent.on(hideKeyBtn, 'click', function (e) {
            e.preventDefault();
            container.classList.toggle('collapsed');
            hideKeyBtn.textContent = container.classList.contains('collapsed') ? 'Show Key' : 'Hide Key';
          });

          updateWardWalkToggleState();
          updateTotalElectors();
          if (BID_MODE) {
            container.querySelector('.key-header').style.display = 'none';
            container.querySelectorAll('.key-content > *').forEach(el => {
              if (el.id !== 'switchSourceBtn') el.style.display = 'none';
            });
            const bidWalks = sortedWalkKeys.filter(k => Number(k) >= 1 && Number(k) <= 7);
            const bidTotal = bidWalks.reduce((s, k) => s + (walkMarkers[k] || []).length, 0);
            const bidStats = document.createElement('div');
            bidStats.style.cssText = 'font-size:13px;line-height:1.5;';
            bidStats.innerHTML = `<div style="margin:4px 0 8px;"><strong>HEREDITAMENTS: ${bidTotal}</strong></div>` +
              bidWalks.map(k => {
                const cfg = walksConfig[k] || { description: `WALK ${k}`, color: '#000000' };
                const count = (walkMarkers[k] || []).length;
                return `
                  <div class="walk-item">
                    <label>
                      <input type="checkbox" class="bid-walk-toggle" data-walk="${k}" checked style="margin-right:8px;">
                      <span class="walk-color-box" style="background-color: ${cfg.color};"></span>
                      <div class="walk-info"><div class="walk-name"><strong>${k}: ${cfg.description}</strong></div></div>
                    </label>
                    <span class="walk-count">${count}</span>
                  </div>`;
              }).join('');
            container.querySelector('.key-content').appendChild(bidStats);
            bidStats.querySelectorAll('.bid-walk-toggle').forEach(chk => {
              L.DomEvent.on(chk, 'change', function () {
                const layer = walkLayers[chk.getAttribute('data-walk')];
                if (!layer) return;
                if (chk.checked) layer.addTo(map); else map.removeLayer(layer);
              });
            });
          }
          return container;
        }
      });
      map.addControl(new WalksKeyControl());
    }).catch(error => {
      console.error('Promise.all .catch() called with error:', error);
      console.error('Error loading configuration or data files:', error);
      const errorDiv = document.createElement('div');
      errorDiv.id = 'promise-error';
      errorDiv.style.position = 'fixed';
      errorDiv.style.top = '10px';
      errorDiv.style.left = '10px';
      errorDiv.style.zIndex = '10000';
      errorDiv.style.background = '#e74c3c';
      errorDiv.style.border = '3px solid darkred';
      errorDiv.style.padding = '15px';
      errorDiv.style.fontSize = '12px';
      errorDiv.style.fontFamily = 'monospace';
      errorDiv.style.maxWidth = '500px';
      errorDiv.style.color = 'white';
      errorDiv.innerHTML = `<strong>PROMISE ERROR:</strong><br>${String(error).substring(0, 500)}`;
      document.body.appendChild(errorDiv);
      alert('Map Loading Error: ' + error.message);
    });
  </script>
  <script>
    const PIN_GATE_SESSION_KEY = "vote2027PinUnlocked";
    const PIN_GATE_CODE = "202705";
    const pinGate = document.getElementById("pin-gate");
    const pinForm = document.getElementById("pin-gate-form");
    const pinInput = document.getElementById("pin-gate-input");
    const pinError = document.getElementById("pin-gate-error");

    function unlockPinGate() {
      document.body.classList.remove("pin-locked");
      pinGate.style.display = "none";
      sessionStorage.setItem(PIN_GATE_SESSION_KEY, "true");
      refreshMapView();
    }

    if (sessionStorage.getItem(PIN_GATE_SESSION_KEY) === "true") {
      unlockPinGate();
    } else {
      pinForm.addEventListener("submit", event => {
        event.preventDefault();
        if (pinInput.value.trim() === PIN_GATE_CODE) {
          unlockPinGate();
        } else {
          pinError.hidden = false;
          pinInput.value = "";
          pinInput.focus();
        }
      });
      pinInput.focus();
    }
  </script>
</body>
</html>
