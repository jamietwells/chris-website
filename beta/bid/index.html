<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWLLHELI - Walks</title>
  
  <link rel="icon" type="image/svg+xml" href="https://threetwosix.co.uk/beta/tarian-shield.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #map { height: 100vh; width: 100vw; position: relative; z-index: 1; }
    
    .leaflet-top.leaflet-right {
      z-index: 1000 !important;
      pointer-events: auto;
    }

    .walks-key-control {
      background: #ffffff;
      padding: 12px 15px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      border-radius: 8px;
      line-height: 1.5;
      min-width: 295px;
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid #ccc;
    }
    .walks-key-control.collapsed .key-content {
      display: none;
    }
    .walks-key-control.collapsed {
      min-width: auto;
      padding: 8px 12px;
    }
    .walks-key-control h4 {
      margin: 0 0 10px 0;
      font-size: 14px;
      font-weight: 700;
      color: #222;
      border-bottom: 2px solid #eee;
      padding-bottom: 6px;
    }
    .key-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 2px solid #eee;
      padding-bottom: 6px;
    }
    .walks-key-control.collapsed .key-header {
      margin-bottom: 0;
      border-bottom: none;
      padding-bottom: 0;
    }
    .key-header h4 {
      margin: 0;
      border-bottom: none;
      padding-bottom: 0;
    }
    .key-actions {
      display: flex;
      gap: 5px;
    }
    .toggle-all-btn, .hide-key-btn {
      background: #eef2f5;
      border: 1px solid #dcdcdc;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      color: #333;
    }
    .toggle-all-btn:hover, .hide-key-btn:hover {
      background: #e2e8ec;
    }
    .section-title {
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      color: #666;
      margin: 10px 0 6px 0;
      border-bottom: 1px solid #eee;
      padding-bottom: 2px;
    }
    .stats-panel {
      background: #f8f9fa;
      border: 1px solid #e2e8ec;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    .stats-row {
      margin-bottom: 8px;
    }
    .stats-row:last-child {
      margin-bottom: 0;
    }
    .stat-line {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      font-weight: 700;
      font-size: 11px;
      color: #222;
      margin-bottom: 4px;
    }
    .stat-doors, .stat-seats {
      text-align: right;
    }
    .stat-totals {
      display: grid;
      gap: 2px;
      text-align: right;
    }
    .square-row {
      display: flex;
      gap: 4px;
    }
    .square {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      border: 1px solid rgba(0,0,0,0.15);
    }
    .square.green { background-color: #28AA1E; }
    .square.grey { background-color: #bdc3c7; }

    .walk-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .walk-item label {
      display: flex;
      align-items: center;
      cursor: pointer;
      flex-grow: 1;
    }
    .walk-color-box {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      border: 1.5px solid #ffffff;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }
    .ward-color-box {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      display: inline-block;
      margin-right: 8px;
      border: 2px solid;
      flex-shrink: 0;
    }
    .walk-info { flex-grow: 1; }
    .walk-name { font-weight: 600; color: #222; }
    .walk-count {
      font-size: 11px;
      font-weight: 600;
      color: #444;
      background: #eef2f5;
      padding: 2px 7px;
      border-radius: 12px;
      margin-left: 8px;
      flex-shrink: 0;
      border: 1px solid #dcdcdc;
    }
    .key-footer-link {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid #eee;
      text-align: center;
    }
    .key-footer-link a {
      font-size: 12px;
      font-weight: 600;
      color: #0066cc;
      text-decoration: none;
    }
    .key-footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Map centered on Pwllheli
    const map = L.map('map').setView([52.888, -4.415], 13);

    // Create custom pane for property markers to ensure they stay above boundaries
    map.createPane('propertyPane');
    map.getPane('propertyPane').style.zIndex = 650;

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Ward GeoJSON URLs
    const wardUrls = {
      gogledd: 'https://threetwosix.co.uk/beta/bid/gogledd.json',
      de: 'https://threetwosix.co.uk/beta/bid/de.json'
    };

    // Styling configuration for Ward Boundaries
    const wardConfigs = {
      gogledd: { name: 'Gogledd / North', color: '#ff0000', fillOpacity: 0 },
      de: { name: 'De / South', color: '#ff0000', fillOpacity: 0 }
    };

    const mappingSheetCsvUrl =
      'https://docs.google.com/spreadsheets/d/1OS8iu7s0CAD__v1i_2kIOiIGvgmNiRN3KAAI4V9XyaE/gviz/tq?tqx=out:csv&sheet=Gogledd%20and%20De%20Pwllheli';

    const excludedElectorIds = new Set([
      '99847846', '99879958', '99840554', '99984173', '99840555', '99840556',
      '99840557', '99904810', '99980116', '89620737', '18018671', '29536496',
      '11140423', '48263706', '66670955', '72193946', '43888548', '15707735',
      '95812285', '99452783', '49345206'
    ]);
    const phantomWalks = new Set(['10.1', '17.1']);

    // Robust JSON fetcher
    async function fetchAndCleanJSON(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error('HTTP error loading ' + url + ': ' + response.status);
      const text = await response.text();
      const sanitized = text.replace(/[“”]/g, '"').replace(/[‘’]/g, "'");

      try {
        return JSON.parse(sanitized);
      } catch (parseError) {
        try {
          return (new Function('return ' + sanitized))();
        } catch (evalError) {
          throw new Error(`JSON Syntax Error in ${url}: ${parseError.message}`);
        }
      }
    }

    function parseCsv(csvText) {
      const rows = [];
      let row = [];
      let value = '';
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i += 1) {
        const char = csvText[i];
        const next = csvText[i + 1];

        if (char === '"' && inQuotes && next === '"') {
          value += '"';
          i += 1;
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          row.push(value);
          value = '';
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && next === '\n') i += 1;
          row.push(value);
          rows.push(row);
          row = [];
          value = '';
        } else {
          value += char;
        }
      }

      if (value.length || row.length) {
        row.push(value);
        rows.push(row);
      }

      return rows;
    }

    async function fetchMappingData() {
      const response = await fetch(mappingSheetCsvUrl);
      if (!response.ok) {
        throw new Error('HTTP error loading mapping data from Google Sheets: ' + response.status);
      }

      const rows = parseCsv(await response.text());
      if (rows.length < 2) {
        throw new Error('The Google Sheets mapping tab contains no mapping data.');
      }

      const headers = rows[0].map(header => header.trim().toUpperCase());
      const column = name => headers.indexOf(name);
      const columns = {
        electorId: column('ELECTOR ID'),
        walk: column('WALK'),
        postcode: 11,
        householdSize: column('HOUSEHOLD SIZE'),
        electors: headers.lastIndexOf('ELECTORS'),
        envelopeName: 5,
        addressLines: [7, 8, 9],
        postalIndicator: 15,
        subroad: 16,
        sortOrder: 17,
        walkLabel: 18,
        // Live latitude and longitude values are in columns X and Y.
        latitude: 23,
        longitude: 24,
      };

      ['electorId', 'walk', 'postcode', 'latitude', 'longitude'].forEach(key => {
        if (columns[key] === -1) {
          throw new Error('The Google Sheets mapping tab is missing its ' + key + ' column.');
        }
      });
      if (headers[columns.latitude] !== 'LATITUDE' || headers[columns.longitude] !== 'LONGITUDE') {
        throw new Error('The Google Sheets mapping tab must have latitude and longitude in columns X and Y.');
      }
      const expectedColumns = {
        envelopeName: 'ENVELOPE NAME',
        postcode: 'POSTCODE',
        postalIndicator: 'PV',
        subroad: 'SUBROAD',
        sortOrder: 'SORT ORDER',
        walkLabel: 'WALK'
      };
      Object.keys(expectedColumns).forEach(key => {
        if (headers[columns[key]] !== expectedColumns[key]) {
          throw new Error('The Google Sheets mapping tab has an unexpected ' + expectedColumns[key] + ' column.');
        }
      });

      return rows.slice(1)
        .filter(row => row.some(value => value.trim()))
        .filter(row => !excludedElectorIds.has(row[columns.electorId].trim()))
        .filter(row => !phantomWalks.has(row[columns.walk].trim()))
        .map(row => {
          const addressText = [
            ...columns.addressLines.map(index => row[index]),
            row[columns.postcode],
            row[columns.postalIndicator]
          ].map(value => value.trim()).filter(Boolean).join(', ');

          const electorCount = Number(
            row[columns.electors] || row[columns.householdSize] || 1
          );

          return {
            envelopeName: row[columns.envelopeName] || '',
            addressText,
            postcode: row[columns.postcode] || '',
            isPostalVoter: Boolean(row[columns.postalIndicator].trim()),
            lat: Number(row[columns.latitude]),
            lng: Number(row[columns.longitude]),
            walk: row[columns.walk] || '',
            labelWalk: row[columns.walkLabel] || '',
            subroad: row[columns.subroad] || '',
            sortOrder: row[columns.sortOrder] || '',
            electors: Number.isFinite(electorCount) ? electorCount : 1
          };
        });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function normalizeWalkNumber(walk) {
      const walkNum = String(walk);
      if (walkNum === '0' || walkNum.toUpperCase() === 'DE' || walkNum.toUpperCase().includes('SOUTH')) {
        return '11';
      }
      return walkNum;
    }

    Promise.all([
      fetchAndCleanJSON('https://threetwosix.co.uk/beta/bid/walks.json'),
      fetchMappingData(),
      fetchAndCleanJSON(wardUrls.gogledd).catch(err => { console.warn('Could not load North Ward GeoJSON:', err); return null; }),
      fetchAndCleanJSON(wardUrls.de).catch(err => { console.warn('Could not load South Ward GeoJSON:', err); return null; })
    ]).then(([walksConfig, postcodesArray, gogleddGeoJson, deGeoJson]) => {

      const walkLayers = {};
      const walkMarkers = {};
      const walkPropertyCounts = {};
      const wardTotals = {
        gogledd: { households: 0, electors: 0 },
        de: { households: 0, electors: 0 }
      };
      const boundsCoords = [];
      const wardLayers = {};

      // 1. Process Ward Boundary GeoJSONs
      const rawWards = { gogledd: gogleddGeoJson, de: deGeoJson };
      
      Object.keys(rawWards).forEach(key => {
        const geojson = rawWards[key];
        if (geojson) {
          const cfg = wardConfigs[key];
          const layer = L.geoJSON(geojson, {
            style: {
              color: cfg.color,
              weight: 3,
              opacity: 1,
              fillColor: cfg.color,
              fillOpacity: cfg.fillOpacity
            },
            onEachFeature: (feature, l) => {
              l.bindPopup(`<strong>Ward Boundary:</strong><br>${cfg.name}`);
            }
          });
          
          wardLayers[key] = layer;

          layer.addTo(map);
        }
      });

      const itemsList = postcodesArray;

      // Dynamically discover all unique walk keys
      const walkKeysSet = new Set();
      if (walksConfig) {
        Object.keys(walksConfig).forEach(k => walkKeysSet.add(String(k)));
      }
      itemsList.forEach(item => {
        if (item.walk !== undefined && item.walk !== null) {
          const walkNum = normalizeWalkNumber(item.walk);
          walkKeysSet.add(walkNum);
        }
      });

      const sortedWalkKeys = Array.from(walkKeysSet).sort((a, b) => Number(a) - Number(b));

      // 2. Process Walks & Electors Data
      sortedWalkKeys.forEach(walkKey => {
        walkLayers[walkKey] = L.layerGroup();
        walkMarkers[walkKey] = [];
        walkPropertyCounts[walkKey] = { properties: 0, electors: 0 };
      });

      itemsList.forEach(item => {
        const walkNum = normalizeWalkNumber(item.walk);

        const electorsCount = Number(item.electors || 1);
        const wardKey = Number(walkNum) < 11 ? 'gogledd' : 'de';
        wardTotals[wardKey].households += 1;
        wardTotals[wardKey].electors += electorsCount;

        if (walkPropertyCounts[walkNum]) {
          walkPropertyCounts[walkNum].properties += 1;
          walkPropertyCounts[walkNum].electors += electorsCount;
        }

        const walkCfg = walksConfig[walkNum] || { color: '#ff0000', description: 'UNKNOWN' };
        
        // Fixed uniform marker radius (slightly larger, e.g., radius 7)
        const markerRadius = 7;

        if (!Number.isFinite(item.lat) || !Number.isFinite(item.lng)) {
          return;
        }

        const marker = L.circleMarker([item.lat, item.lng], {
          radius: markerRadius,
          color: '#ffffff',
          fillColor: walkCfg.color,
          fillOpacity: 1,
          weight: 2,
          pane: 'propertyPane'
        });

        const labelDetails = [
          `WALK ${item.labelWalk}`,
          item.subroad
        ].filter(value => value.trim()).join(', ');
        marker.bindPopup(
          `${escapeHtml(item.envelopeName || 'Unknown Name')}<br>` +
          `${escapeHtml(item.addressText || 'Unknown Address')}<br>` +
          `Electors (${electorsCount})<br>` +
          `<strong>${escapeHtml(labelDetails)} (${electorsCount})</strong>`
        );
        
        if (walkLayers[walkNum]) {
          walkLayers[walkNum].addLayer(marker);
          walkMarkers[walkNum].push({
            marker,
            isPostalVoter: item.isPostalVoter,
            electors: electorsCount
          });
        }

        boundsCoords.push([item.lat, item.lng]);
      });

      // Add Walks 11-17 to map by default
      sortedWalkKeys.forEach(walkKey => {
        const num = Number(walkKey);
        if (num >= 11 && num <= 17) {
          walkLayers[walkKey].addTo(map);
        }
      });

      if (boundsCoords.length > 0) {
        map.fitBounds(L.latLngBounds(boundsCoords), { padding: [30, 30] });
      }

      // 3. Custom Key Control
      const WalksKeyControl = L.Control.extend({
        options: { position: 'topright' },
        onAdd: function (mapInstance) {
          const container = L.DomUtil.create('div', 'walks-key-control');
          
          L.DomEvent.disableClickPropagation(container);
          L.DomEvent.disableScrollPropagation(container);

          let html = `
            <div class="key-header">
              <h4 id="keyTitle">Electors</h4>
              <div class="key-actions">
                <button type="button" class="toggle-all-btn" id="toggleAllBtn">Show All Walks</button>
                <button type="button" class="hide-key-btn" id="hideKeyBtn">Hide Key</button>
              </div>
            </div>
            <div class="key-content">
              <div class="stats-panel">
                <div class="stats-row">
                  <div class="stat-line">
                    <span class="stat-ward">GOGLEDD / NORTH (0/7)</span>
                    <span class="stat-totals">
                      <span>ELECTORS: ${wardTotals.gogledd.electors}</span>
                      <span>DOORS: ${wardTotals.gogledd.households}</span>
                    </span>
                  </div>
                  <div class="square-row">
                    <span class="square grey"></span>
                    <span class="square grey"></span>
                    <span class="square grey"></span>
                    <span class="square grey"></span>
                    <span class="square grey"></span>
                    <span class="square grey"></span>
                    <span class="square grey"></span>
                  </div>
                </div>
                <div class="stats-row">
                  <div class="stat-line">
                    <span class="stat-ward">DE / SOUTH (8/8)</span>
                    <span class="stat-totals">
                      <span>ELECTORS: ${wardTotals.de.electors}</span>
                      <span>DOORS: ${wardTotals.de.households}</span>
                    </span>
                  </div>
                  <div class="square-row">
                    <span class="square green"></span>
                    <span class="square green"></span>
                    <span class="square green"></span>
                    <span class="square green"></span>
                    <span class="square green"></span>
                    <span class="square green"></span>
                    <span class="square green"></span>
                    <span class="square green"></span>
                  </div>
                </div>
              </div>
              <div class="section-title">Ward Boundaries</div>
          `;

          ['gogledd', 'de'].forEach(key => {
            const cfg = wardConfigs[key];
            const isLoaded = !!wardLayers[key];
            const isChecked = true;
            html += `
              <div class="walk-item">
                <label>
                  <input type="checkbox" class="ward-toggle-checkbox" data-ward="${key}" ${isChecked ? 'checked' : ''} ${!isLoaded ? 'disabled' : ''} style="margin-right:8px;">
                  <span class="ward-color-box" style="border-color: ${cfg.color}; background: transparent;"></span>
                  <div class="walk-info">
                    <div class="walk-name">${cfg.name} ${!isLoaded ? '(Not Loaded)' : ''}</div>
                  </div>
                </label>
              </div>
            `;
          });

          html += `          <div class="section-title">Walks</div>
          <div class="walk-item">
            <label>
              <input type="checkbox" id="show-pvs-only-toggle" style="margin-right:8px;">
              <div class="walk-info">
                <div class="walk-name">Show PVs only</div>
              </div>
            </label>
          </div>`;

          sortedWalkKeys.forEach(walkKey => {
            const cfg = walksConfig[walkKey] || { description: `WALK ${walkKey}`, color: '#000000' };
            const stats = walkPropertyCounts[walkKey] || { electors: 0 };
            const num = Number(walkKey);
            const isChecked = (num >= 11 && num <= 17);
            
            html += `
              <div class="walk-item">
                <label>
                  <input type="checkbox" class="walk-toggle-checkbox" data-walk="${walkKey}" ${isChecked ? 'checked' : ''} style="margin-right:8px;">
                  <span class="walk-color-box" style="background-color: ${cfg.color};"></span>
                  <div class="walk-info">
                    <div class="walk-name">${walkKey}: ${cfg.description}</div>
                  </div>
                </label>
                <span class="walk-count" title="${stats.properties || 0} locations, ${stats.electors || 0} electors">${stats.electors || 0} Electors</span>
              </div>
            `;
          });

          html += `
            <div class="key-footer-link">
              <a href="https://threetwosix.co.uk/beta/candidates.html">VIEW SEATS</a>
            </div>
          `;

          html += `</div>`;
          container.innerHTML = html;

          const titleEl = container.querySelector('#keyTitle');
          const hideKeyBtn = container.querySelector('#hideKeyBtn');
          const toggleAllBtn = container.querySelector('#toggleAllBtn');
          const showPVsOnlyToggle = container.querySelector('#show-pvs-only-toggle');

          L.DomEvent.on(showPVsOnlyToggle, 'change', function (e) {
            const showPVsOnly = e.target.checked;
            Object.keys(walkLayers).forEach(walkKey => {
              const layer = walkLayers[walkKey];
              layer.clearLayers();
              walkMarkers[walkKey].forEach(({ marker, isPostalVoter }) => {
                if (!showPVsOnly || isPostalVoter) {
                  layer.addLayer(marker);
                }
              });
            });
            updateTotalElectors();
          });

          function updateTotalElectors() {
            let total = 0;
            let doors = 0;
            const showPVsOnly = showPVsOnlyToggle.checked;
            container.querySelectorAll('.walk-toggle-checkbox').forEach(chk => {
              if (!chk.checked) return;

              const walkId = chk.getAttribute('data-walk');
              walkMarkers[walkId].forEach(({ isPostalVoter, electors }) => {
                if (showPVsOnly && !isPostalVoter) return;
                total += electors;
                doors += 1;
              });
            });
            titleEl.textContent = `Electors (${total}) Doors (${doors})`;
          }

          container.querySelectorAll('.ward-toggle-checkbox').forEach(chk => {
            L.DomEvent.on(chk, 'change', function (e) {
              const wardKey = e.target.getAttribute('data-ward');
              if (wardLayers[wardKey]) {
                if (e.target.checked) {
                  mapInstance.addLayer(wardLayers[wardKey]);
                } else {
                  mapInstance.removeLayer(wardLayers[wardKey]);
                }
              }
            });
          });

          container.querySelectorAll('.walk-toggle-checkbox').forEach(chk => {
            L.DomEvent.on(chk, 'change', function (e) {
              const walkId = e.target.getAttribute('data-walk');
              if (e.target.checked) {
                mapInstance.addLayer(walkLayers[walkId]);
              } else {
                mapInstance.removeLayer(walkLayers[walkId]);
              }
              updateGlobalButtonState();
              updateTotalElectors();
            });
          });

          L.DomEvent.on(toggleAllBtn, 'click', function (e) {
            e.preventDefault();
            const checkboxes = container.querySelectorAll('.walk-toggle-checkbox');
            const allChecked = Array.from(checkboxes).every(chk => chk.checked);

            checkboxes.forEach(chk => {
              const walkId = chk.getAttribute('data-walk');
              if (allChecked) {
                chk.checked = false;
                mapInstance.removeLayer(walkLayers[walkId]);
              } else {
                chk.checked = true;
                mapInstance.addLayer(walkLayers[walkId]);
              }
            });

            updateGlobalButtonState();
            updateTotalElectors();
          });

          L.DomEvent.on(hideKeyBtn, 'click', function (e) {
            e.preventDefault();
            container.classList.toggle('collapsed');
            hideKeyBtn.textContent = container.classList.contains('collapsed') ? 'Show Key' : 'Hide Key';
          });

          function updateGlobalButtonState() {
            const checkboxes = container.querySelectorAll('.walks-key-control .walk-toggle-checkbox');
            const allChecked = Array.from(checkboxes).every(chk => chk.checked);
            toggleAllBtn.textContent = allChecked ? 'Hide All Walks' : 'Show All Walks';
          }

          updateGlobalButtonState();
          updateTotalElectors();
          return container;
        }
      });

      map.addControl(new WalksKeyControl());

    }).catch(error => {
      console.error('Error loading configuration or data files:', error);
      alert('Map Loading Error: ' + error.message);
    });
  </script>
</body>
