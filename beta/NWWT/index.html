
<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>NWWT | TARIAN</title>

  <link rel="icon" type="image/svg+xml" href="/beta/tarian-shield.svg">
  <link rel="stylesheet" href="/beta/style.css">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >

  <style>
    body {
      background: #fff;
    }

    .nwwt-header {
      background: #fff;
      border-bottom: 0.35rem solid var(--plaid-green, #005f3b);
    }

    .nwwt-logo {
      display: block;
      width: min(100%, 360px);
      height: auto;
      margin: 1.5rem auto 0;
    }

    .nwwt-details {
      margin: 1.5rem 0;
      padding: 0 1rem;
      color: var(--plaid-green-dark, #00452b);
      text-align: left;
    }

    .nwwt-details h1 {
      margin: 0;
      font-size: 1.6rem;
    }

    .nwwt-details p {
      margin: 0.5rem 0 0;
      font-size: 1.05rem;
    }

    .nwwt-map-panel {
      max-width: 70rem;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    .nwwt-map {
      width: 100%;
      height: min(68vw, 680px);
      min-height: 420px;
      border: 0.25rem solid var(--plaid-green, #005f3b);
      box-sizing: border-box;
    }
  </style>
</head>

<body>

  <header class="page-header nwwt-header">
    <img
      src="tarian-shield.svg"
      alt="North Wales Wildlife Trust"
      class="nwwt-logo"
    >
  </header>

  <main class="app-shell">

    <section class="nwwt-details">
      <h1>Chris Twells</h1>
      <p>First Round Interview: 20 August 2026</p>
    </section>

    <section class="nwwt-map-panel">
      <div
        id="nwwt-map"
        class="nwwt-map"
        aria-label="Satellite map of Gogledd Pwllheli"
      ></div>
    </section>

  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    const map = L.map("nwwt-map", {
      attributionControl: true
    });

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution: "Tiles © Esri"
      }
    ).addTo(map);

    map.setView([53.15, -3.75], 8);

    fetch("/bera/boundaries/GOGLEDD_PWLLHELI.geojson")
      .then(response => {
        if (!response.ok) {
          throw new Error(
            "Could not load Gogledd Pwllheli boundary."
          );
        }

        return response.json();
      })
      .then(geojson => {
        const boundary = L.geoJSON(geojson, {
          style: {
            color: "#f58220",
            weight: 3,
            fillColor: "#f58220",
            fillOpacity: 0.12
          }
        }).addTo(map);

        const bounds = boundary.getBounds();

        if (bounds.isValid()) {
          map.fitBounds(bounds.pad(0.06));
          map.setMaxBounds(bounds.pad(0.12));
          map.setMinZoom(map.getZoom());
        }
      })
      .catch(error => {
        console.error(
          "Unable to load map boundary:",
          error
        );
      });
  </script>

</body>
</html>
