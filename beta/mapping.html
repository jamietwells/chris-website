    function loadFromStorage(key, fallback) {

      try {

        const raw = localStorage.getItem(key);

        if (!raw) {
          return fallback;
        }

        return JSON.parse(raw);

      } catch (error) {
        return fallback;
      }

    }

    function toGoogleCsvUrl(rawUrl) {

      if (
        rawUrl.includes("output=csv") ||
        rawUrl.includes("/export?format=csv")
      ) {
        return rawUrl;
      }

      const match = rawUrl.match(/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);

      if (!match) {
        return rawUrl;
      }

      const sheetId = match[1];
      const gidMatch = rawUrl.match(/[?&#]gid=([0-9]+)/);
      const gid = gidMatch ? gidMatch[1] : "0";

      return (
        "https://docs.google.com/spreadsheets/d/" +
        sheetId +
        "/export?format=csv&gid=" +
        gid
      );

    }

    // Sheet5 (col J = DOB, keyed by Electoral Number in col C) is the
    // authoritative source for whether an elector's age/DOB is known,
    // mirroring the main list's "Age Known" filter.
    function toSheet5CsvUrl(rawUrl) {

      const match =
        rawUrl.match(/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);

      if (!match) {
        return null;
      }

      return (
        "https://docs.google.com/spreadsheets/d/" +
        match[1] +
        "/gviz/tq?tqx=out:csv&sheet=Sheet5"
      );

    }

    // The "COORDINATES" tab holds the authoritative Polling District
    // ("PD", column L) and Lat/Long (cols F/G), keyed by Household ID,
    // mirroring the main list.
    function toCoordinatesCsvUrl(rawUrl) {

      const match =
        rawUrl.match(/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);

      if (!match) {
        return null;
      }

      return (
        "https://docs.google.com/spreadsheets/d/" +
        match[1] +
        "/gviz/tq?tqx=out:csv&sheet=COORDINATES"
      );

    }

    async function loadCoordinatesDataByHouseholdId(sheetUrl) {

      const dataByHouseholdId = {};

      const coordinatesUrl = toCoordinatesCsvUrl(sheetUrl);

      if (!coordinatesUrl) {
        return dataByHouseholdId;
      }

      try {

        const response = await fetch(coordinatesUrl);

        if (!response.ok) {
          return dataByHouseholdId;
        }

        const rows = parseCsv(await response.text());

        rows.slice(1).forEach(row => {

          const householdId = (row[0] || "").trim();

          if (!householdId) {
            return;
          }

          const uprn = (row[2] || "").trim();
          const xCoordinate = (row[3] || "").trim();
          const yCoordinate = (row[4] || "").trim();
          const rawLat = (row[5] || "").trim();
          const rawLng = (row[6] || "").trim();
          const pd = (row[11] || "").trim();

          const lat = rawLat && !Number.isNaN(Number(rawLat)) ? Number(rawLat) : null;
          const lng = rawLng && !Number.isNaN(Number(rawLng)) ? Number(rawLng) : null;

          dataByHouseholdId[householdId] = {
            pollingDistrict: pd,
            lat,
            lng,
            isPostcodeCentreOnly: !uprn && !xCoordinate && !yCoordinate
          };

        });

      } catch (error) {
        // COORDINATES tab is supplementary — ignore failures.
      }

      return dataByHouseholdId;

    }

    async function loadSheet5DobById(sheetUrl) {

      const dobById = {};
      const senedd2026ById = {};

      const sheet5Url = toSheet5CsvUrl(sheetUrl);

      if (!sheet5Url) {
        return { dobById, senedd2026ById };
      }

      try {

        const response = await fetch(sheet5Url);

        if (!response.ok) {
          return { dobById, senedd2026ById };
        }

        const rows = parseCsv(await response.text());

        rows.slice(1).forEach(row => {

          const electorId = (row[2] || "").trim();
          const rawDob = (row[9] || "").trim();
          // Column M: "SENEDD 2026" - "Y" (voted on the day) or "A"
          // (voted by post). Exact text is copied as-is.
          const senedd2026 = (row[12] || "").trim();

          if (electorId && rawDob) {
            dobById[electorId] = rawDob;
          }

          if (electorId && senedd2026) {
            senedd2026ById[electorId] = senedd2026;
          }

        });

      } catch (error) {
        // Sheet5 is supplementary — ignore failures.
      }

      return { dobById, senedd2026ById };

    }

    // The "NEWSPAPERS" tab holds authoritative Walk/Subroad/Sort Order
    // and Subscription data, keyed by Household ID — mirrors index.html's
    // loadNewspapersDataByHouseholdId/applyNewspapersDataToElectors.
    function toNewspapersCsvUrl(rawUrl) {

      const match =
        rawUrl.match(/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);

      if (!match) {
        return null;
      }

      return (
        "https://docs.google.com/spreadsheets/d/" +
        match[1] +
        "/gviz/tq?tqx=out:csv&sheet=NEWSPAPERS"
      );

    }

    async function loadNewspapersDataByHouseholdId(sheetUrl) {

      const dataByHouseholdId = {};

      const newspapersUrl = toNewspapersCsvUrl(sheetUrl);

      if (!newspapersUrl) {
        return dataByHouseholdId;
      }

      try {

        const response = await fetch(newspapersUrl);

        if (!response.ok) {
          return dataByHouseholdId;
        }

        const rows = parseCsv(await response.text());

        rows.slice(1).forEach(row => {

          const householdId = (row[1] || "").trim();

          if (!householdId) {
            return;
          }

          const subscriptionInactive = Boolean((row[25] || "").trim());

          dataByHouseholdId[householdId] = {
            // Rows marked SUBSCRIPTION INACTIVE (column Y) are treated
            // as having no subscription at all, mirroring the same
            // exclusion applied on /subscriptions.
            subscription: subscriptionInactive ? "" : (row[2] || "").trim(),
            addressLine1: (row[3] || "").trim(),
            walk: (row[8] || "").trim(),
            subRoad: (row[9] || "").trim(),
            pollingDistrict: (row[10] || "").trim(),
            sortOrder: (row[11] || "").trim(),
            doNotCanvass: Boolean((row[15] || "").trim()),
            doNotDeliver: Boolean((row[16] || "").trim()),
            customerName: (row[17] || "").trim()
          };

        });

      } catch (error) {
        // NEWSPAPERS tab is supplementary — ignore failures.
      }

      return dataByHouseholdId;

    }

    function applyNewspapersDataToElectors(electors, dataByHouseholdId) {

      const matchedHouseholdIds = new Set();

      electors.forEach(elector => {

        const entry = dataByHouseholdId[elector.householdId];

        if (!entry) {
          return;
        }

        matchedHouseholdIds.add(elector.householdId);

        if (entry.addressLine1) {
          elector.addressLine1 = entry.addressLine1;
        }

        if (entry.walk) {
          elector.deliveryWalk = entry.walk;
        }

        if (entry.subRoad) {
          elector.subRoad = entry.subRoad;
        }

        if (entry.sortOrder) {
          elector.deliveryOrder = entry.sortOrder;
        }

        elector.newspaperSubscribed =
          String(entry.subscription || "").trim().length > 0;

        // NEWSPAPERS is the master source for Do Not Canvass/Deliver.
        elector.masterDoNotContact = Boolean(entry.doNotCanvass);
        elector.masterDoNotDeliver = Boolean(entry.doNotDeliver);

      });

      // Subscribers whose Household ID doesn't match any elector in the
      // main sheet (e.g. they live outside the canvassed Polling
      // Districts) still need to appear in "View All Subscribers on
      // Map". Synthesize a minimal elector-like record for each,
      // tagged with the invented "XX1" Polling District so it never
      // collides with a real RA1/QB6 district filter.
      Object.keys(dataByHouseholdId).forEach(householdId => {

        if (matchedHouseholdIds.has(householdId)) {
          return;
        }

        const entry = dataByHouseholdId[householdId];

        if (!String(entry.subscription || "").trim().length) {
          return;
        }

        electors.push({
          id: "newspaper-" + householdId,
          name: entry.customerName || "Newspaper Subscriber",
          householdId,
          addressLine1: entry.addressLine1 || "",
          addressLine2: "",
          postcode: "",
          pollingDistrict: entry.pollingDistrict || "XX1",
          deliveryWalk: entry.walk || "",
          subRoad: entry.subRoad || "",
          deliveryOrder: entry.sortOrder || "",
          lat: NaN,
          lng: NaN,
          postalProxy: formatPostalProxy(""),
          householdGroupKey: normalizeText(householdId),
          newspaperSubscribed: true,
          masterDoNotContact: Boolean(entry.doNotCanvass),
          masterDoNotDeliver: Boolean(entry.doNotDeliver)
        });

      });

    }

    function parseCsv(csvText) {

      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i += 1) {

        const char = csvText[i];
        const next = csvText[i + 1];

        if (char === "\"" && inQuotes && next === "\"") {
          value += "\"";
          i += 1;
          continue;
        }

        if (char === "\"") {
          inQuotes = !inQuotes;
          continue;
        }

        if (char === "," && !inQuotes) {
          row.push(value);
          value = "";
          continue;
        }

        if ((char === "\n" || char === "\r") && !inQuotes) {

          if (char === "\r" && next === "\n") {
            i += 1;
          }

          row.push(value);
          rows.push(row);
          row = [];
          value = "";
          continue;

        }

        value += char;

      }

      if (value.length || row.length) {
        row.push(value);
        rows.push(row);
      }

      return rows;

    }

    function normalizeHeader(value) {
      return (value || "").trim().toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function normalizeText(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    // An elector is treated as "Left Electoral Register" either because a
    // user has ticked that box on their profile (stored in local
    // progress), or because Sheet1's own Polling District column already
    // says "XX9" for that elector (per-elector, not per-household - e.g.
    // one elector in a household may have left while others remain).
    function isLeftElectoralRegisterElector(elector, progress) {
      if ((progress[elector.id] || {}).leftElectoralRegister) {
        return true;
      }
      return normalizeText(elector.pollingDistrict) === "xx9";
    }

    function formatPostalProxy(value) {

      const cleaned = String(value || "").trim();
      const normalized = normalizeText(cleaned);

      if (!normalized) {
        return "";
      }

      if (normalized.includes("postal")) {
        return "Postal";
      }

      if (normalized.includes("proxy")) {
        return "Proxy";
      }

      return cleaned;

    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Splits a raw address value on commas (address columns sometimes
    // contain an embedded comma, e.g. "BODORWEL,BWLCH"), drops any
    // segment matching an excluded town/county word (already covered
    // by the dedicated Post Town field), and rejoins the remainder.
    function stripExcludedTownWords(value) {

      return String(value || "")
        .split(",")
        .map(segment => segment.trim())
        .filter(Boolean)
        .filter(segment => !EXCLUDED_TOWN_WORDS.includes(segment.toUpperCase()))
        .join(", ");

    }

    // Converts an ALL CAPS address string into Welsh-aware sentence
    // case, leaving common short Welsh words (e.g. "gyda", "yn") in
    // lower case when they are not the first word.
    function welshProperCase(str) {

      if (!str) {
        return str;
      }

      // Track whether we've already capitalised the first "real"
      // (letter-containing) word - a leading house-number token like
      // "1" doesn't count, so the actual first word of a place name
      // (e.g. "Tan" in "1 Tan y Fynwent") is always capitalised, even
      // if it would otherwise be a lower-cased Welsh word later on.
      let firstWordSeen = false;

      return str
        .toLowerCase()
        .replace(/\S+/g, word => {

          const core =
            word
              .replace(/^[^a-zA-Z']+|[^a-zA-Z']+$/g, "")
              .toLowerCase();

          const isWordLike = /[a-zA-Z]/.test(word);

          if (isWordLike) {

            if (firstWordSeen && WELSH_LOWERCASE.has(core)) {
              return word;
            }

            firstWordSeen = true;

          }

          return word.replace(/[a-zA-Z]/, ch => ch.toUpperCase());

        });

    }

    // Best-effort DOB comparison used by the "Too Young To Vote" filter.
    // DOB values may be a full date ("YYYY-MM-DD"), a year-and-month
    // ("YYYY-MM"), or just a year ("YYYY") depending on how much detail
    // is known, so this only reports a match when the available
    // precision is enough to be confident the elector was born strictly
    // after the cutoff date - anything ambiguous (e.g. only the cutoff
    // year is known) is treated as not matching rather than guessing.
    function isBornAfterCutoffDate(dobValue, cutoffIso) {

      const cleaned = String(dobValue || "").trim();

      if (!cleaned) {
        return false;
      }

      const cutoffMatch = cutoffIso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      const cutoffYear = parseInt(cutoffMatch[1], 10);
      const cutoffMonth = parseInt(cutoffMatch[2], 10);
      const cutoffDay = parseInt(cutoffMatch[3], 10);

      const dayMonthYearMatch = cleaned.match(/^(\d{1,2})[\s/.-](\d{1,2})[\s/.-](\d{4})$/);
      if (dayMonthYearMatch) {
        const day = parseInt(dayMonthYearMatch[1], 10);
        const month = parseInt(dayMonthYearMatch[2], 10);
        const year = parseInt(dayMonthYearMatch[3], 10);
        if (year !== cutoffYear) {
          return year > cutoffYear;
        }
        if (month !== cutoffMonth) {
          return month > cutoffMonth;
        }
        return day > cutoffDay;
      }

      const fullMatch = cleaned.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (fullMatch) {
        const year = parseInt(fullMatch[1], 10);
        const month = parseInt(fullMatch[2], 10);
        const day = parseInt(fullMatch[3], 10);
        if (year !== cutoffYear) {
          return year > cutoffYear;
        }
        if (month !== cutoffMonth) {
          return month > cutoffMonth;
        }
        return day > cutoffDay;
      }

      const yearMonthMatch = cleaned.match(/^(\d{4})-(\d{1,2})$/);
      if (yearMonthMatch) {
        const year = parseInt(yearMonthMatch[1], 10);
        const month = parseInt(yearMonthMatch[2], 10);
        if (year !== cutoffYear) {
          return year > cutoffYear;
        }
        if (month !== cutoffMonth) {
          return month > cutoffMonth;
        }
        return false;
      }

      const yearOnlyMatch = cleaned.match(/^(\d{4})$/);
      if (yearOnlyMatch) {
        const year = parseInt(yearOnlyMatch[1], 10);
        return year > cutoffYear;
      }

      return false;

    }

    // Parses a DOB value into {year, month, day} at whatever precision
    // is available (day/month may be null), supporting the same
    // formats as isBornAfterCutoffDate above. Returns null if nothing
    // could be parsed.
    function parseDobPrecisionParts(dobValue) {

      const cleaned = String(dobValue || "").trim();

      if (!cleaned) {
        return null;
      }

      const isoMatch = cleaned.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (isoMatch) {
        return { year: parseInt(isoMatch[1], 10), month: parseInt(isoMatch[2], 10), day: parseInt(isoMatch[3], 10) };
      }

      const dayMonthYearMatch = cleaned.match(/^(\d{1,2})[\s/.-](\d{1,2})[\s/.-](\d{4})$/);
      if (dayMonthYearMatch) {
        return { year: parseInt(dayMonthYearMatch[3], 10), month: parseInt(dayMonthYearMatch[2], 10), day: parseInt(dayMonthYearMatch[1], 10) };
      }

      const yearMonthMatch = cleaned.match(/^(\d{4})-(\d{1,2})$/);
      if (yearMonthMatch) {
        return { year: parseInt(yearMonthMatch[1], 10), month: parseInt(yearMonthMatch[2], 10), day: null };
      }

      const yearOnlyMatch = cleaned.match(/^(\d{4})$/);
      if (yearOnlyMatch) {
        return { year: parseInt(yearOnlyMatch[1], 10), month: null, day: null };
      }

      return null;

    }

    // Compares parsed DOB parts against a {year, month, day} cutoff.
    // Returns true/false only when the available precision is enough
    // to be confident of the answer; returns null when it's ambiguous
    // (e.g. only the cutoff year is known, so month/day can't compare).
    function isDobPartsAfterCutoff(parts, cutoff) {

      if (!parts) {
        return null;
      }

      if (parts.year !== cutoff.year) {
        return parts.year > cutoff.year;
      }

      if (parts.month === null) {
        return null;
      }

      if (parts.month !== cutoff.month) {
        return parts.month > cutoff.month;
      }

      if (parts.day === null) {
        return null;
      }

      return parts.day > cutoff.day;

    }

    // Matches electors for whom May 2027 will be their first election -
    // i.e. they were younger than 16 on 7 May 2026 (the previous
    // election) but will have turned 16 by 6 May 2027. Only matches
    // when the DOB is known precisely enough to be sure of both
    // bounds.
    function isFirstTimeVoterMay2027(dobValue) {

      const parts = parseDobPrecisionParts(dobValue);

      if (!parts) {
        return false;
      }

      const afterPrevElectionCutoff = isDobPartsAfterCutoff(parts, { year: 2010, month: 5, day: 7 });
      const afterNextElectionCutoff = isDobPartsAfterCutoff(parts, { year: 2011, month: 5, day: 6 });

      if (afterPrevElectionCutoff !== true || afterNextElectionCutoff === null) {
        return false;
      }

      // Old enough to vote by 6 May 2027 means born on or before that
      // date, i.e. NOT born after it.
      return afterNextElectionCutoff === false;

    }

    function getElectorProgress(electorId, progress, elector) {

      const existing = progress[electorId] || {};

      const masterCanvassId =
        (elector && elector.masterCanvassId && elector.masterCanvassId !== "No Data")
          ? elector.masterCanvassId
          : "";
      const masterSupportIndependenceRaw =
        (elector && elector.masterSupportIndependence && elector.masterSupportIndependence !== "No Data")

          : "";
      const masterSupportIndependence =
        masterSupportIndependenceRaw === "Support" ? "Yes" : masterSupportIndependenceRaw;
      const masterFirstLanguage = (elector && elector.masterFirstLanguage) || "";
      const masterPhone = (elector && elector.masterPhone) || "";
      const masterEmail = (elector && elector.masterEmail) || "";

      return {
        canvassId: masterCanvassId || existing.canvassId || existing.status || "No Data",
        supportIndependence: masterSupportIndependence || existing.supportIndependence || "No Data",
        firstLanguage: masterFirstLanguage || existing.firstLanguage || "English",
        phone: masterPhone || existing.phone || "",

        doNotContact: Boolean(existing.doNotContact) || Boolean(elector && elector.masterDoNotContact)

    // Resolves a household's Subroad, preferring a saved household-level

    function resolveSubRoad(elector, areaOverrides) {

      const householdKey = elector.householdGroupKey;

      if (

    // Each household's Walk can be reassigned individually on the Manage

    // own Walk column (AL) so this page's colours stay in sync with
    // Manage Walks, and only default to Walk 1 if neither is present.
    // A walk can never cross Polling Districts.
    function getWalkForHousehold(household, walkOverrides) {

      const override = walkOverrides[household.key];

      if (override) {
        return String(override);

      const match = String(household.deliveryWalk || "").match(/\d+/);

    // Groups a flat elector list into one entry per Household ID, keeping
    // the first elector's address/coordinates as representative of the
    // whole household (all electors sharing a Household ID live at the
    // same property). This guarantees exactly one marker per Household ID
    // even if multiple electors at that address have differing KEY 1
    // values.
    function buildHouseholds(electors, areaOverrides) {

      const order = [];
      const byKey = new Map();

      electors.forEach(elector => {

        const key = elector.householdId || elector.householdGroupKey;

        if (!byKey.has(key)) {
          byKey.set(key, {
            key,
            addressLine1: elector.addressLine1,

            pollingDistrict: elector.pollingDistrict || "",
            subRoad: resolveSubRoad(elector, areaOverrides),
            deliveryWalk: elector.deliveryWalk || ""

        const household = byKey.get(key);
        household.electorCount += 1;

        if (!household.pollingDistrict && elector.pollingDistrict) {

        if (!household.deliveryWalk && elector.deliveryWalk) {

        if (!household.subRoad) {

          if (subRoad) {

        // Prefer any elector record within the household that actually
        // has usable coordinates, in case the first one is missing them.
        if (

          !isNaN(elector.lat)

    function addCommunityBoundaries() {

      if (communityBoundariesLoaded) return communityBoundariesPromise;
      communityBoundariesLoaded = true;

      communityBoundariesPromise = Promise.all(COMMUNITY_BOUNDARIES.map(community => {

        return fetch(community.url)
          .then(response => {
            if (!response.ok) {
              throw new Error("Could not load " + community.name + " boundary.");
            }
            return response.json();
          })
          .then(geojson => {
            const isAbersoch = community.name === "Abersoch gyda Llanengan";
            const isIndependent = community.color === "#777777";
            const isReform = community.color === "#12b5cb";
            const boundary = L.geoJSON(geojson, {
              style: {
                color: isAbersoch ? "transparent" : "#000000",
                weight: isAbersoch ? 0 : 3,
                opacity: 1,
                fillColor: community.color,
                fillOpacity: isAbersoch ? 0 : (isIndependent || isReform ? 0.5 : 0.28),
                pane: "communityBoundaries"
              }
            }).addTo(communityBoundariesLayer);

            if (!isAbersoch) {
              const twoMemberWards = new Set([
                "Harlech a Llanbedr",
                "Bethel a'r Felinheli"
              ]);
              const wardName =
                twoMemberWards.has(community.name)
                  ? community.name + " [2]"
                  : community.name;
              const partyByColor = {
                "#005f3b": "Plaid Cymru",
                "#777777": "Independent",
                "#f58220": "Liberal Democrat",
                "#e4003b": "Labour",
                "#12b5cb": "Reform"
              };
              const party = partyByColor[community.color];
              const boundaryLabel =
                party
                  ? wardName + " (" + party + ")"
                  : wardName;
              boundary.bindPopup("<strong>" + boundaryLabel + "</strong>");
            }

          })
          .catch(error => console.error(error));

      }));
      return communityBoundariesPromise;

    }

    function renderMap(households, colorForHousehold) {

      if (!leafletMap) {

        leafletMap = L.map(mapEl);

        L.tileLayer(
          "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
          {
            maxZoom: 18,
            attribution: "&copy; OpenStreetMap contributors"
          }
        ).addTo(leafletMap);
        leafletMap.createPane("communityBoundaries");
        leafletMap.getPane("communityBoundaries").style.zIndex = 450;
        leafletMap.getPane("communityBoundaries").style.pointerEvents = "none";
        if (boundariesVisible) {
          communityBoundariesLayer.addTo(leafletMap);
        }
        addCommunityBoundaries();

      }

      if (markersLayer) {
        leafletMap.removeLayer(markersLayer);
      }

      const markers = [];

      households.forEach(household => {

        if (
          household.lat === null ||
          household.lat === undefined ||
          isNaN(household.lat) ||
          household.lng === null ||
          household.lng === undefined ||
          isNaN(household.lng)
        ) {
          return;
        }

        const line1 = household.addressLine1 || "";

        const line1WithSubRoad =
          household.subRoad
            ? line1 + " (" + household.subRoad + ")"
            : line1;

        const label =
          escapeHtml(line1WithSubRoad) || "Address unavailable";

        const fillColor =
          colorForHousehold
            ? colorForHousehold(household)
            : DEFAULT_MARKER_COLOR;

        const marker =
          L.circleMarker([household.lat, household.lng], {
            radius: 5,
            color: "#ffffff",
            weight: 1.5,
            fillColor: fillColor,
            fillOpacity: 0.9
          })
            .bindPopup(label)
            .bindTooltip(label, { direction: "top" });

        markers.push(marker);

      });

      markersLayer = L.layerGroup(markers);
      if (propertyMarkersVisible) {
        markersLayer.addTo(leafletMap);
      }

      function fitInitialMapView() {

        leafletMap.invalidateSize();

        if (initialMapRender && communityBoundariesLayer.getLayers().length) {

          leafletMap.fitBounds(communityBoundariesLayer.getBounds().pad(0.08));

        } else if (markers.length) {

          const group = L.featureGroup(markers);
          leafletMap.fitBounds(group.getBounds().pad(0.15));

        } else {

          // No plottable households - fall back to a view centred on
          // Abersoch gyda Llanengan so the map isn't blank.
          leafletMap.setView([52.8168, -4.4855], 13);

        }

      }

      requestAnimationFrame(() => {
        requestAnimationFrame(fitInitialMapView);
      });
      setTimeout(fitInitialMapView, 250);

      if (initialMapRender) {
        addCommunityBoundaries().then(() => {
          if (!communityBoundariesLayer.getLayers().length) return;
          defaultBoundaryViewSet = true;
          fitInitialMapView();
          initialMapRender = false;
        });
      }

    }

    async function init() {

      const sheetUrl =
        localStorage.getItem(STORAGE_KEYS.sheetUrl) ||
        DEFAULT_SHEET_URL;

      const filterState =
        loadFromStorage(
          STORAGE_KEYS.mappingFilter,
          // Matches the main list's default selected Polling District
          // ("RA1 (Abersoch)") so the map shows a sensible household
          // count even if opened directly, without going through the
          // "View Households on Map" button first.
          { pollingDistrict: "ra1", filterType: "" }
        );

      const params = new URLSearchParams(window.location.search);
      const requestedDistrict =
        (params.get("district") || "").trim().toUpperCase();
      const requestedWalk =
        parseWalkNumber(params.get("walk") || "");

      const progress =
        loadFromStorage(STORAGE_KEYS.progress, {});

      const areaOverrides =
        loadFromStorage(STORAGE_KEYS.areaOverrides, {});

      const walkOverrides =
        loadFromStorage(STORAGE_KEYS.walkOverrides, {});

      const walkDescriptions =
        loadFromStorage(STORAGE_KEYS.walkDescriptions, {});

      messageEl.textContent = "Loading electors...";

      try {

        const csvUrl = toGoogleCsvUrl(sheetUrl);
        const response = await fetch(csvUrl);

        if (!response.ok) {
          throw new Error("Could not fetch sheet data.");
        }

        const csvText = await response.text();
        const rows = parseCsv(csvText);
        const headers = rows[0].map(h => normalizeHeader(h));

        const electors =
          rows
            .slice(1)
            .map((row, index) => mapRowToElector(row, headers, index))
            .filter(e => e.name);

        if (!electors.some(e => e.id === CHRIS_GREEN_ELECTOR_ID)) {
          electors.push(buildChrisGreenDemoElector());
        }

        // Electors marked "Left Electoral Register" on their profile get
        // their Polling District overridden to the invented "XX9" code so
        // they never match a real RA1/QB6 district filter even if some
        // other code path forgets to check the leftElectoralRegister flag
        // directly - belt and braces alongside the exclusion applied in
        // computeBaseFiltered() below.
        electors.forEach(elector => {
          if ((progress[elector.id] || {}).leftElectoralRegister) {
            elector.pollingDistrict = "XX9";
          }
        });

        const { dobById, senedd2026ById } = await loadSheet5DobById(sheetUrl);

        if (!dobById[CHRIS_GREEN_ELECTOR_ID]) {
          dobById[CHRIS_GREEN_ELECTOR_ID] = CHRIS_GREEN_DOB;
        }

        electors.forEach(elector => {
          elector.sheetDob = dobById[elector.id] || elector.sheetDob || "";
          elector.senedd2026Vote = senedd2026ById[elector.id] || "";
        });

        const newspapersDataByHouseholdId =
          await loadNewspapersDataByHouseholdId(sheetUrl);

        applyNewspapersDataToElectors(electors, newspapersDataByHouseholdId);

        const coordinatesDataByHouseholdId =
          await loadCoordinatesDataByHouseholdId(sheetUrl);

        electors.forEach(elector => {
          const entry = coordinatesDataByHouseholdId[elector.householdId];
          if (!entry) {
            return;
          }
          // Sheet1 (main sheet) is the master source for Polling
          // District and ENO/Polling Number — COORDINATES is not
          // applied to elector.pollingDistrict here.
          if (entry.lat !== null && entry.lng !== null) {
            elector.lat = entry.lat;
            elector.lng = entry.lng;
          }
          elector.isPostcodeCentreOnly = Boolean(entry.isPostcodeCentreOnly);
        });

        // Initialise the Filter dropdown from whatever filter was active on
        // the main list when "View Households on Map" was clicked, so the
        // map opens showing the same "current list". Falls back to "No
        // filter" (default) if that value doesn't match an enabled option,
        // e.g. when opening the map page directly. A "filter" URL
        // parameter (e.g. from the Shuttleworth page's "View supporters
        // on map" link) takes priority over the saved filter state.
        const requestedFilterType =
          (params.get("filter") || "").trim() ||
          filterState.filterType ||
          "";

        if (
          [...mappingFilterTypeEl.options].some(
            option => option.value === requestedFilterType && !option.disabled
          )
        ) {
          mappingFilterTypeEl.value = requestedFilterType;
        }

        // Shared across both display modes: the selected Filter and
        // Anti-Plaid flags always apply. Polling District filtering
        // differs between the two modes (see below), so it is applied
        // later. Recomputed on every render so changing the Filter
        // dropdown live-updates the map ("View All" is just "No filter").
        function computeBaseFiltered() {

          const wantedFilterType =
            mappingFilterTypeEl.value || "";

          return electors.filter(elector => {

            const isLeftRegister = isLeftElectoralRegisterElector(elector, progress);

            if (wantedFilterType === "left-electoral-register") {
              return isLeftRegister;
            }

            // Electors marked "Left Electoral Register" (e.g. deceased,
            // moved away) are hidden from the map entirely, regardless
            // of any other filter.
            if (isLeftRegister) {
              return false;
            }

            // XX1 is the synthetic Polling District used for newspaper
            // subscribers with no matching elector in the main sheet.
            // It should only ever surface via the Subscription filter —
            // everywhere else (including "No filter") it must behave as
            // if these households don't exist.
            if (
              wantedFilterType !== "newspaper-subscription" &&
              elector.pollingDistrict === "XX1"
            ) {
              return false;
            }

            if (wantedFilterType === "postal-proxy") {
              if (elector.postalProxy !== "Postal") {
                return false;
              }
            }

            if (wantedFilterType === "proxy-voters") {
              if (elector.postalProxy !== "Proxy") {
                return false;
              }
            }

            const electorProgress =
              getElectorProgress(elector.id, progress, elector);

            if (wantedFilterType === "age-known") {
              const knownDob = electorProgress.dob || elector.sheetDob || "";
              if (!knownDob) {
                return false;
              }
            }

            if (wantedFilterType === "too-young-may-2027") {
              const knownDob = electorProgress.dob || elector.sheetDob || "";
              if (!isBornAfterCutoffDate(knownDob, "2011-05-06")) {
                return false;
              }
            }

            if (wantedFilterType === "first-time-voter-may-2027") {
              const knownDob = electorProgress.dob || elector.sheetDob || "";
              if (!isFirstTimeVoterMay2027(knownDob)) {
                return false;
              }
            }

            if (wantedFilterType === "newspaper-subscription") {
              if (!elector.newspaperSubscribed) {
                return false;
              }
            }

            if (wantedFilterType === "poster-any-description") {
              const posterValue = electorProgress.poster;
              if (
                posterValue !== "Poster: Window" &&
                posterValue !== "Poster: Garden" &&
                posterValue !== "Poster: Both"
              ) {
                return false;
              }
            }

            if (wantedFilterType === "supporters") {
              const isDefiniteOrProbablePlaid =
                electorProgress.canvassId === "Definite Plaid" ||
                electorProgress.canvassId === "Probable Plaid";
              const supportsIndependence =
                electorProgress.supportIndependence === "Yes";
              if (!isDefiniteOrProbablePlaid && !supportsIndependence) {
                return false;
              }
            }

            if (wantedFilterType === "voted-since-2015") {
              if (!electorVotedAtLeastOnceSinceYear(elector, 2015)) {
                return false;
              }
            }

            if (wantedFilterType === "anti-plaid") {
              return hasAntiPlaidFlag(electorProgress);
            }

            // The implicit anti-plaid exclusion below only applies when a
            // specific filter is selected (it hides Do Not Deliver/Do Not
            // Contact electors from canvassing target lists). "No filter"
            // ("View All") must show every household in the selected
            // Polling District(s), including those flagged Do Not
            // Deliver/Do Not Contact.
            if (wantedFilterType && hasAntiPlaidFlag(electorProgress)) {
              return false;
            }

            return true;

          });

        }

        function renderWalksLegend(households, walkOverridesMap, pollingDistrict, walkDescriptionsMap, hiddenWalksSet) {

          // For each Walk, show how many of its households were actually
          // plotted vs. how many matched in total, e.g. "1 - High Street
          // and Harbour (100/120)".
          const counts = {};
          const walkNumbers =
            getWalkNumbersForHouseholds(households, walkOverridesMap);

          walkNumbers.forEach(walkNumber => {
            counts[walkNumber] = { plotted: 0, total: 0 };
          });

          households.forEach(household => {

            const walkNumber = getWalkForHousehold(household, walkOverridesMap);

            if (!counts[walkNumber]) {
              counts[walkNumber] = { plotted: 0, total: 0 };
            }

            counts[walkNumber].total += 1;

            if (!isNaN(household.lat) && !isNaN(household.lng)) {
              counts[walkNumber].plotted += 1;
            }

          });

          walkKeyEl.innerHTML =
            "<div class=\"walk-key-title\">WALK KEY (PLOTTED/NOT PLOTTED)</div>" +
            "<div class=\"walk-key-grid\">" +
            walkNumbers.map(walkNumber => {

              const description =
                truncateWalkDescription(
                  getWalkDescription(pollingDistrict, walkNumber, walkDescriptionsMap)
                );

              const isHidden = hiddenWalksSet.has(walkNumber);

              return (
                "<span class=\"walk-key-item\">" +
                "<span class=\"walk-key-label\">" +
                "<span class=\"walk-key-swatch\" style=\"background:" +
                getWalkColor(walkNumber) + "\"></span>" +
                walkNumber +
                (description ? " - " + escapeHtml(description) : "") +
                " (" + counts[walkNumber].plotted + "/" +
                (counts[walkNumber].total - counts[walkNumber].plotted) + ")" +
                "</span>" +
                "<button type=\"button\" class=\"walk-key-toggle walk-key-toggle-" +
                (isHidden ? "show" : "hide") + "\" data-walk=\"" + walkNumber + "\">" +
                (isHidden ? "Show" : "Hide") + "</button>" +
                "</span>"
              );

            }).join("") +
            "</div>" +
            "<div class=\"walk-key-all-row\">" +
            "<button type=\"button\" class=\"walk-key-toggle-all walk-key-toggle-show\" data-action=\"show-all\">Show all</button>" +
            "<button type=\"button\" class=\"walk-key-toggle-all walk-key-toggle-hide\" data-action=\"hide-all\">Hide all</button>" +
            "<a class=\"walk-key-nav-link walk-key-nav-edit\" href=\"manage-walks.html\">Edit Walks</a>" +
            "<a class=\"walk-key-nav-link walk-key-nav-deliverers\" href=\"manage-deliverers.html\">View Deliverers</a>" +
            "</div>";

        }

        // Arriving via "View Walk on Map" (Manage Walks) implies the user
        // wants to see Walk colouring immediately; otherwise default to
        // "All Polling Districts" with Walk colouring switched off.
        let showWalksActive = Boolean(requestedDistrict || requestedWalk);

        // Walk numbers currently hidden from the map (their markers are
        // suppressed), toggled via the "[hide]"/"[show]" link next to
        // each entry in the Walk Key. All Walks are shown by default.
        const hiddenWalks = new Set();
        let availableWalkNumbers = [];
        let appliedRequestedWalk = false;

        if (
          requestedDistrict &&
          [...walkDistrictSelectEl.options].some(
            option => option.value.toUpperCase() === requestedDistrict
          )
        ) {
          walkDistrictSelectEl.value = requestedDistrict;
        } else if (showWalksActive) {
          walkDistrictSelectEl.value = "RA1";
        }

        function applyAndRender() {

          // "All Polling Districts" can't be colour-coded by Walk (a Walk
          // never crosses a Polling District boundary, and the same Walk
          // number/colour is reused in each district), so selecting it
          // disables the "Show Delivery Walks" toggle entirely. The
          // Polling District picker itself always stays visible. A
          // selected Filter also disables it, since Walk colouring is
          // meant to show a whole district's delivery routes, not a
          // filtered subset of it.
          const isSubscriptionFilterSelected =
            mappingFilterTypeEl.value === "newspaper-subscription";

          subscribersLinkEl.hidden = !isSubscriptionFilterSelected;

          const isLeftRegisterFilterSelected =
            mappingFilterTypeEl.value === "left-electoral-register";

          // Subscription list membership isn't captured by Polling
          // District at all (subscribers can live in either district),
          // and neither is "Left Electoral Register" (those electors are
          // tagged XX9, not RA1/QB6) - so when either Filter is active
          // the Polling District picker is forced to "All Polling
          // Districts" and disabled.
          if (isSubscriptionFilterSelected || isLeftRegisterFilterSelected) {
            walkDistrictSelectEl.value = "";
          }
          walkDistrictSelectEl.disabled = isSubscriptionFilterSelected || isLeftRegisterFilterSelected;

          const isAllDistrictsSelected =
            walkDistrictSelectEl.value === "";

          const isFilterSelected =
            Boolean(mappingFilterTypeEl.value);

          if (isAllDistrictsSelected || isFilterSelected) {
            showWalksActive = false;
          }

          showWalksToggleEl.disabled = isAllDistrictsSelected || isFilterSelected;

          const showWalks = showWalksActive;

          showWalksToggleEl.textContent =
            showWalks ? "Hide Delivery Walks" : "Show Delivery Walks";
          showWalksToggleEl.classList.toggle("is-active", showWalks);

          walkKeyEl.hidden = !showWalks;

          // In "Show delivery walks" mode, the Polling District dropdown
          // (defaulting to RA1) always controls which district is shown,
          // since a walk can never cross Polling Districts and the same
          // Walk number/colour is reused in each district. Selecting
          // "All Polling Districts" shows every household unfiltered.
          const wantedPollingDistrict =
            isAllDistrictsSelected
              ? ""
              : normalizeText(walkDistrictSelectEl.value || "RA1");

          const filtered =
            computeBaseFiltered().filter(elector => {

              if (
                wantedPollingDistrict &&
                normalizeText(elector.pollingDistrict) !== wantedPollingDistrict
              ) {
                return false;
              }

              return true;

            });

          const households = buildHouseholds(filtered, areaOverrides);

          const totalHouseholds = households.length;
          const truncated = totalHouseholds > MAX_HOUSEHOLDS;
          const shownHouseholds = households.slice(0, MAX_HOUSEHOLDS);
          availableWalkNumbers =
            getWalkNumbersForHouseholds(shownHouseholds, walkOverrides);

          if (
            !appliedRequestedWalk &&
            requestedWalk &&
            availableWalkNumbers.includes(requestedWalk)
          ) {
            hiddenWalks.clear();
            availableWalkNumbers.forEach(walkNumber => {
              if (walkNumber !== requestedWalk) {
                hiddenWalks.add(walkNumber);
              }
            });
            appliedRequestedWalk = true;
          }

          const plottable =
            shownHouseholds.filter(household =>
              !isNaN(household.lat) && !isNaN(household.lng)
            );

          const unplottable =
            shownHouseholds.filter(household =>
              isNaN(household.lat) || isNaN(household.lng)
            );

          const missingCoords =
            unplottable.length;

          const missingCoordsElectors =
            unplottable.reduce(
              (sum, household) => sum + (household.electorCount || 0),
              0
            );

          if (plottable.length > MAX_MARKERS) {

            mapEl.hidden = true;

            messageEl.textContent =
              "Map not loaded: this filter would generate " +
              plottable.length +
              " markers, which exceeds the safety limit of " +
              MAX_MARKERS +
              ". Please apply a narrower filter (e.g. a specific Polling District) before displaying the map.";

            summaryEl.textContent = "";

            return;

          }

          mapEl.hidden = false;

          if (showWalks) {

            renderWalksLegend(shownHouseholds, walkOverrides, wantedPollingDistrict, walkDescriptions, hiddenWalks);

            const householdsToPlot =
              shownHouseholds.filter(household =>
                !hiddenWalks.has(getWalkForHousehold(household, walkOverrides))
              );

            renderMap(
              householdsToPlot,
              household =>
                getWalkColor(getWalkForHousehold(household, walkOverrides))
            );

          } else {

            renderMap(shownHouseholds);

          }

          messageEl.textContent = "";

          const totalElectors = filtered.length;

          const electorsShown =
            plottable.reduce(
              (sum, household) => sum + (household.electorCount || 0),
              0
            );

          if (isSubscriptionFilterSelected) {

            summaryEl.textContent =
              plottable.length +
              " Subscriber" + (plottable.length === 1 ? "" : "s") +
              " shown on the map" +
              (
                missingCoords
                  ? " (" + missingCoords + " subscriber" + (missingCoords === 1 ? "" : "s") +
                    " could not be plotted due to missing latitude and longitude)."
                  : "."
              );

          } else if (isLeftRegisterFilterSelected) {

            summaryEl.textContent =
              electorsShown +
              " elector" + (electorsShown === 1 ? "" : "s") +
              " (" + plottable.length + " household" + (plottable.length === 1 ? "" : "s") + ")" +
              " who left the electoral register shown on the map" +
              (
                missingCoords
                  ? " (" + missingCoords + " household" + (missingCoords === 1 ? "" : "s") +
                    " could not be plotted due to missing latitude and longitude)."
                  : "."
              );

          } else {

            summaryEl.textContent =
              plottable.length +
              " household" + (plottable.length === 1 ? "" : "s") +
              " (" + electorsShown + " elector" + (electorsShown === 1 ? "" : "s") + ")" +
              " shown on the map" +
              (
                missingCoords
                  ? " (" + missingCoords + " household" + (missingCoords === 1 ? "" : "s") +
                    " / " + missingCoordsElectors + " elector" + (missingCoordsElectors === 1 ? "" : "s") +
                    " could not be plotted due to missing latitude and longitude)."
                  : "."
              ) +
              (
                truncated
                  ? " Only the first " + MAX_HOUSEHOLDS + " households are shown (" +
                    totalHouseholds + " households, " + totalElectors + " electors matched)."
                  : ""
              );

          }

        }

        applyAndRender();

        showWalksToggleEl.addEventListener("click", () => {
          if (showWalksToggleEl.disabled) {
            return;
          }
          showWalksActive = !showWalksActive;
          applyAndRender();
        });
        walkDistrictSelectEl.addEventListener("change", applyAndRender);
        mappingFilterTypeEl.addEventListener("change", applyAndRender);

        // Event delegation: the Walk Key's contents are fully replaced on
        // every render, so a single listener on the (stable) container
        // handles clicks on any "[hide]"/"[show]" link, present or future,
        // as well as the "[show all]"/"[hide all]" links.
        walkKeyEl.addEventListener("click", event => {

          const toggleAll = event.target.closest(".walk-key-toggle-all");

          if (toggleAll) {

            event.preventDefault();

            if (toggleAll.dataset.action === "hide-all") {
              availableWalkNumbers.forEach(walkNumber => hiddenWalks.add(walkNumber));
            } else {
              hiddenWalks.clear();
            }

            applyAndRender();

            return;

          }

          const toggle = event.target.closest(".walk-key-toggle");

          if (!toggle) {
            return;
          }

          event.preventDefault();

          const walkNumber = toggle.dataset.walk;

          if (hiddenWalks.has(walkNumber)) {
            hiddenWalks.delete(walkNumber);
          } else {
            hiddenWalks.add(walkNumber);
          }

          applyAndRender();

        });

      } catch (error) {
        messageEl.textContent = "Unable to load sheet: " + error.message;
      }

    }

    init();

  </script>

  <script>

    const PIN_GATE_CODE = "202705";
    const PIN_GATE_SESSION_KEY = "vote2027PinUnlocked";

    (function initPinGate() {

      const gateEl = document.getElementById("pin-gate");
      const formEl = document.getElementById("pin-gate-form");
      const inputEl = document.getElementById("pin-gate-input");
      const errorEl = document.getElementById("pin-gate-error");

      function unlock() {
        document.body.classList.remove("pin-locked");
        gateEl.style.display = "none";
        sessionStorage.setItem(PIN_GATE_SESSION_KEY, "true");
      }

      if (sessionStorage.getItem(PIN_GATE_SESSION_KEY) === "true") {
        unlock();
        return;
      }

      formEl.addEventListener("submit", event => {

        event.preventDefault();

        if (inputEl.value.trim() === PIN_GATE_CODE) {
          unlock();
        } else {
          errorEl.hidden = false;
          inputEl.value = "";
          inputEl.focus();
        }

      });

      inputEl.focus();

    })();

  </script>
