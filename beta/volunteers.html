<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members &amp; Activists | TARIAN</title>
  <link rel="icon" type="image/svg+xml" href="tarian-shield.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body class="pin-locked">

  <div id="pin-gate" class="pin-gate">
    <div class="pin-gate-box">
      <img src="tarian-shield.svg" alt="" class="pin-gate-logo">
      <h2>TARIAN</h2>
      <p>Enter the 6-digit PIN to continue.</p>
      <form id="pin-gate-form" autocomplete="off">
        <input
          type="password"
          id="pin-gate-input"
          class="pin-gate-input"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="6"
          autocomplete="off"
          aria-label="6-digit PIN">
        <button type="submit" class="pin-gate-button">Unlock</button>
      </form>
      <p id="pin-gate-error" class="pin-gate-error" hidden>Incorrect PIN. Please try again.</p>
    </div>
  </div>

  <header class="page-header">
    <a href="index.html" class="page-header-logo-link" aria-label="TARIAN home">
      <img src="tarian-shield.svg" alt="" class="page-header-logo">
    </a>
    <h1>TARIAN</h1>
    <p class="page-subtitle">Members &amp; Activists</p>
  </header>

  <main class="app-shell">

    <section class="panel">
      <a href="index.html" class="back-link back-to-main-button">&larr; back to main list</a>

      <h2 style="margin:1rem 0 1rem;font-size:1.1rem;color:var(--plaid-green);">Harlech a Llanbedr — Walks</h2>
      <p id="walks-summary" style="margin:0 0 1rem;font-size:0.9rem;font-weight:600;color:var(--text-muted);"></p>

      <table class="activist-table" style="width:100%;border-collapse:collapse;font-size:0.88rem;white-space:nowrap;">
        <thead>
          <tr>
            <th style="text-align:left;padding:0.5rem 0.6rem;background:var(--plaid-green);color:#fff;white-space:nowrap;">Walk Description</th>
            <th style="text-align:center;padding:0.5rem 0.6rem;background:var(--plaid-green);color:#fff;">Polling District</th>
            <th style="text-align:center;padding:0.5rem 0.6rem;background:var(--plaid-green);color:#fff;">Households</th>
            <th style="text-align:left;padding:0.5rem 0.6rem;background:var(--plaid-green);color:#fff;">Deliverer</th>
            <th style="text-align:left;padding:0.5rem 0.6rem;background:var(--plaid-green);color:#fff;width:19rem;white-space:nowrap;">Deliverer Address</th>
            <th style="text-align:left;padding:0.5rem 0.6rem;background:var(--plaid-green);color:#fff;width:6.5rem;">Elector ID</th>
          </tr>
        </thead>
        <tbody id="walks-tbody">
        </tbody>
      </table>

    </section>

  </main>

  <script>
    const PIN_GATE_CODE = "202705";
    const PIN_GATE_SESSION_KEY = "vote2027PinUnlocked";

    (function initPinGate() {
      const gateEl = document.getElementById("pin-gate");
      const formEl = document.getElementById("pin-gate-form");
      const inputEl = document.getElementById("pin-gate-input");
      const errorEl = document.getElementById("pin-gate-error");
      function unlock() {
        document.body.classList.remove("pin-locked");
        gateEl.style.display = "none";
        sessionStorage.setItem(PIN_GATE_SESSION_KEY, "true");
      }
      if (sessionStorage.getItem(PIN_GATE_SESSION_KEY) === "true") { unlock(); return; }
      formEl.addEventListener("submit", event => {
        event.preventDefault();
        if (inputEl.value.trim() === PIN_GATE_CODE) { unlock(); }
        else { errorEl.hidden = false; inputEl.value = ""; inputEl.focus(); }
      });
      inputEl.focus();
    })();

    const WALKS_KEY = "harlech-walks-v1";
    const PROFILE_PROGRESS_KEY = "abersoch-elector-progress-v1";
    const MASTER_ADDRESS_LIST_URL =
      "https://docs.google.com/spreadsheets/d/1OS8iu7s0CAD__v1i_2kIOiIGvgmNiRN3KAAI4V9XyaE/gviz/tq?tqx=out:csv&sheet=MASTER%20ADDRESS%20LIST";
    const KNOWN_DELIVERERS = {
      "599999999": { name: "Chris Green", address: "4 Pencei, Y Traeth" },
      "507243585": { name: "Karl Ciz", address: "Meirion House, Llanbedr" }
    };

    const WALKS = [
      { district: "N1", community: "Harlech", walk: 1 },
      { district: "N1", community: "Harlech", walk: 2 },
      { district: "N1", community: "Harlech", walk: 3 },
      { district: "N1", community: "Harlech", walk: 4 },
      { district: "N1", community: "Harlech", walk: 5 },
      { district: "N1", community: "Harlech", walk: 6 },
      { district: "N1", community: "Harlech", walk: 7 },
      { district: "N1", community: "Harlech", walk: 8 },
      { district: "N1", community: "Harlech", walk: 9 },
      { district: "N1", community: "Harlech", walk: 10 },
      { district: "N2", community: "Llandanwg", walk: 1 },
      { district: "N2", community: "Llandanwg", walk: 2 },
      { district: "AE1", community: "Llanbedr", walk: 1 },
      { district: "AE1", community: "Llanbedr", walk: 2 },
      { district: "AF1", community: "Talsarnau", walk: 1 },
      { district: "AF1", community: "Talsarnau", walk: 2 },
      { district: "AF1", community: "Talsarnau", walk: 3 },
      { district: "AF1", community: "Talsarnau", walk: 4 },
      { district: "AU1", community: "Llanfair", walk: 1 },
      { district: "AU1", community: "Llanfair", walk: 2 },
    ];
    const WALK_DESCRIPTIONS = {
      "N1-1": "Harlech", "N1-2": "Harlech", "N1-3": "Harlech",
      "N1-4": "Harlech", "N1-5": "Harlech", "N1-6": "Harlech",
      "N1-7": "Harlech", "N1-8": "Harlech", "N1-9": "Harlech",
      "N1-10": "Harlech (Postal)", "N2-1": "Llanganwg",
      "N2-2": "Llanganwg (Postal)", "AE1-1": "Llanbedr",
      "AE1-2": "Llanbedr (Postal)", "AF1-1": "Talsarnau",
      "AF1-2": "Llandecwyn", "AF1-3": "Ynys & Glanywern",
      "AF1-4": "Talsarnau (Postal)", "AU1-1": "Llanfair",
      "AU1-2": "Llanfair (Postal)"
    };
    const postalWalkCount = WALKS.filter(({ district, walk }) =>
      /\(Postal\)$/.test(WALK_DESCRIPTIONS[rowKey(district, walk)] || "")
    ).length;
    document.getElementById("walks-summary").textContent =
      WALKS.length + " delivery walks · " +
      (WALKS.length - postalWalkCount) + " by hand · " +
      postalWalkCount + " postal";

    const DEFAULT_DELIVERER_BY_WALK = Object.fromEntries(
      WALKS.map(({ district, walk }) => [
        rowKey(district, walk),
        (district === "AE1" || district === "AU1") && walk === 1 ? "507243585" : "599999999"
      ])
    );

    let walksData = {};
    try { walksData = JSON.parse(localStorage.getItem(WALKS_KEY) || "{}"); } catch(e) {}

    function getProfileDeliverersByWalk() {
      let progress = {};
      try { progress = JSON.parse(localStorage.getItem(PROFILE_PROGRESS_KEY) || "{}"); } catch(e) {}

      const byWalk = {};
      Object.entries(progress).forEach(([electorId, details]) => {
        if (!details.activeDeliverer || !Array.isArray(details.delivererWalks)) return;
        details.delivererWalks.forEach(walk => { byWalk[walk] = electorId; });
      });
      return byWalk;
    }

    function withoutPostcode(address) {
      return String(address || "").replace(
        /,?\s+[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}\s*$/i,
        ""
      ).trim();
    }

    function saveWalks() {
      localStorage.setItem(WALKS_KEY, JSON.stringify(walksData));
    }

    function rowKey(district, walk) {
      return district + "-" + walk;
    }

    function getRow(district, walk) {
      return walksData[rowKey(district, walk)] || {};
    }

    function formatWalkDescription(district, walk) {
      const description = WALK_DESCRIPTIONS[rowKey(district, walk)] || "";
      const isPostal = /\s+\(Postal\)$/.test(description);
      const label = description.replace(/\s+\(Postal\)$/, "");
      return district + " - " + label + " (" + walk + (isPostal ? " - Postal" : "") + ")";
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;
      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        if (character === '"') {
          if (quoted && text[index + 1] === '"') {
            value += '"';
            index += 1;
          } else {
            quoted = !quoted;
          }
        } else if (character === "," && !quoted) {
          row.push(value);
          value = "";
        } else if ((character === "\n" || character === "\r") && !quoted) {
          if (character === "\r" && text[index + 1] === "\n") index += 1;
          row.push(value);
          if (row.some(cell => cell.trim())) rows.push(row);
          row = [];
          value = "";
        } else {
          value += character;
        }
      }
      if (value || row.length) {
        row.push(value);
        rows.push(row);
      }
      return rows;
    }

    async function loadHouseholdCounts() {
      const response = await fetch(MASTER_ADDRESS_LIST_URL);
      if (!response.ok) {
        throw new Error("Could not load household counts.");
      }
      const counts = new Map();
      parseCsv(await response.text()).slice(1).forEach(row => {
        const pollingDistrict = String(row[2] || "").trim();
        const walk = String(row[18] || "").trim();
        if (!pollingDistrict || !walk) {
          return;
        }
        const walkKey = pollingDistrict + "-" + walk;
        counts.set(walkKey, (counts.get(walkKey) || 0) + 1);
      });
      document.querySelectorAll("[data-household-count]").forEach(cell => {
        cell.textContent = counts.get(cell.dataset.householdCount) || "0";
      });
    }

    const td = (content, style) =>
      "<td style='padding:0.45rem 0.6rem;border-bottom:1px solid #e5e7eb;vertical-align:middle;" + (style || "") + "'>" + content + "</td>";

    const tbody = document.getElementById("walks-tbody");
    const profileDeliverersByWalk = getProfileDeliverersByWalk();

    WALKS.slice().sort((left, right) =>
      left.district.localeCompare(right.district) || left.walk - right.walk
    ).forEach(({ district, community, walk }) => {
      const key = rowKey(district, walk);
      const saved = walksData[key] || {};
      const assignedElectorId =
        profileDeliverersByWalk[key] || DEFAULT_DELIVERER_BY_WALK[key] || "";
      const profileDeliverer = KNOWN_DELIVERERS[assignedElectorId] || {};
      const electorId = saved.electorId || assignedElectorId;
      const delivererName = saved.delivererName || profileDeliverer.name || "No assigned deliverer";
      const delivererAddress = withoutPostcode(
        saved.delivererAddress || profileDeliverer.address
      ) || "—";

      const tr = document.createElement("tr");
      tr.innerHTML =
        td(formatWalkDescription(district, walk)) +
        td("<strong>" + district + "</strong>", "text-align:center;") +
        td("<span data-household-count='" + key + "'>—</span>", "text-align:center;font-weight:600;") +
        td(delivererName, "color:#1f2937;font-weight:600;") +
        td(delivererAddress, "color:#555;font-size:0.82rem;white-space:nowrap;") +
        td("<input type='text' class='walk-elector-id' data-key='" + key + "' value='" + electorId.replace(/'/g,"&#39;") + "' placeholder='Elector ID' style='padding:0.3rem 0.5rem;border:1px solid var(--border-strong);border-radius:0.4rem;font:inherit;font-size:0.82rem;width:6.5rem;'>");
      tbody.appendChild(tr);
    });

    loadHouseholdCounts().catch(() => {
      document.querySelectorAll("[data-household-count]").forEach(cell => {
        cell.textContent = "—";
      });
    });

    tbody.addEventListener("change", e => {
      const input = e.target.closest(".walk-elector-id");
      if (!input) return;
      const key = input.dataset.key;
      walksData[key] = Object.assign(walksData[key] || {}, { electorId: input.value.trim() });
      saveWalks();
    });
  </script>
</body>
</html>
