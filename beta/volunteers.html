<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deliverers | TARIAN</title>
  <link rel="icon" type="image/svg+xml" href="tarian-shield.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body class="pin-locked">

  <div id="pin-gate" class="pin-gate">
    <div class="pin-gate-box">
      <img src="tarian-shield.svg" alt="" class="pin-gate-logo">
      <h2>TARIAN</h2>
      <p>Enter the 6-digit PIN to continue.</p>
      <form id="pin-gate-form" autocomplete="off">
        <input
          type="password"
          id="pin-gate-input"
          class="pin-gate-input"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="6"
          autocomplete="off"
          aria-label="6-digit PIN">
        <button type="submit" class="pin-gate-button">Unlock</button>
      </form>
      <p id="pin-gate-error" class="pin-gate-error" hidden>Incorrect PIN. Please try again.</p>
    </div>
  </div>

  <header class="page-header">
    <a href="index.html" class="page-header-logo-link" aria-label="TARIAN home">
      <img src="tarian-shield.svg" alt="" class="page-header-logo">
    </a>
    <h1>TARIAN</h1>
    <p class="page-subtitle">Deliverers</p>
  </header>

  <main class="app-shell">

    <section class="panel">
      <a href="/beta/candidates.html" class="back-link back-to-main-button">VIEW CANDIDATES</a>
      <a href="/beta/shuttleworth" class="back-link back-to-main-button">VIEW SHUTTLEWORTH</a>
      <a href="/beta/bid" class="back-link back-to-main-button">VIEW MAPPING</a>

      <h2 style="margin:1rem 0 1rem;font-size:1.1rem;color:var(--plaid-green);">Pwllheli 2027</h2>
      <p id="walks-summary" style="margin:0 0 1rem;font-size:0.9rem;font-weight:600;color:var(--text-muted);" aria-live="polite">Loading walks…</p>
      <p id="shuttleworth-totals" style="margin:0 0 1rem;font-size:0.9rem;font-weight:600;color:var(--text-muted);" aria-live="polite"></p>
      <p style="margin:0 0 1rem;font-size:0.85rem;color:var(--text-muted);">DO NOT DELIVER: SOUTH (6), NORTH (12)</p>

      <table class="activist-table" style="width:100%;border-collapse:collapse;font-size:0.88rem;">
        <thead>
          <tr>
            <th style="text-align:left;padding:0.5rem 0.6rem;background:var(--plaid-green);color:#fff;white-space:nowrap;">Polling District</th>
            <th style="text-align:center;padding:0.5rem 0.6rem;background:var(--plaid-green);color:#fff;">Walk</th>
            <th style="text-align:left;padding:0.5rem 0.6rem;background:var(--plaid-green);color:#fff;">Description</th>
            <th style="text-align:center;padding:0.5rem 0.6rem;background:var(--plaid-green);color:#fff;">Households</th>
            <th style="text-align:center;padding:0.5rem 0.6rem;background:var(--plaid-green);color:#fff;">Electors</th>
            <th style="text-align:left;padding:0.5rem 0.6rem;background:var(--plaid-green);color:#fff;">Deliverer</th>
          </tr>
        </thead>
        <tbody id="walks-tbody">
        </tbody>
      </table>

    </section>

  </main>

  <script>
    const PIN_GATE_CODE = "202705";
    const PIN_GATE_SESSION_KEY = "vote2027PinUnlocked";

    (function initPinGate() {
      const gateEl = document.getElementById("pin-gate");
      const formEl = document.getElementById("pin-gate-form");
      const inputEl = document.getElementById("pin-gate-input");
      const errorEl = document.getElementById("pin-gate-error");
      function unlock() {
        document.body.classList.remove("pin-locked");
        gateEl.style.display = "none";
        sessionStorage.setItem(PIN_GATE_SESSION_KEY, "true");
      }
      if (sessionStorage.getItem(PIN_GATE_SESSION_KEY) === "true") { unlock(); return; }
      formEl.addEventListener("submit", event => {
        event.preventDefault();
        if (inputEl.value.trim() === PIN_GATE_CODE) { unlock(); }
        else { errorEl.hidden = false; inputEl.value = ""; inputEl.focus(); }
      });
      inputEl.focus();
    })();

    const MAPPING_SHEET_CSV_URL =
      "https://docs.google.com/spreadsheets/d/1OS8iu7s0CAD__v1i_2kIOiIGvgmNiRN3KAAI4V9XyaE/gviz/tq?tqx=out:csv&sheet=Gogledd%20and%20De%20Pwllheli";
    const WALK_CONFIG_URL = "bid/walks.json";
    const EXCLUDED_ELECTOR_IDS = new Set([
      "99847846", "99879958", "99840554", "99984173", "99840555", "99840556",
      "99840557", "99904810", "99980116", "89620737", "18018671", "29536496",
      "11140423", "48263706", "66670955", "72193946", "43888548", "15707735",
      "95812285", "99452783", "49345206"
    ]);
    const PHANTOM_WALKS = new Set(["10.1", "17.1"]);
    const TARGET_SHUTTLEWORTH_BY_WALK = {
      "JB1-11": 72,
      "JB1-12": 57,
      "JB1-13": 42,
      "JB1-14": 45,
      "JB1-15": 47,
      "JB1-16": 64,
      "JB1-17": 73,
      "JA1-1": 67,
      "JA1-2": 26,
      "JA1-3": 45,
      "JA1-4": 41,
      "JA1-5": 38,
      "JA1-6": 55,
      "JA1-7": 34,
      "JA1-8": 38,
      "JA1-9": 38,
      "JA1-10": 18
    };
    const DISTRICT_LABELS = {
      JA1: "JA1 (Gogledd / North)",
      JB1: "JB1 (De / South)"
    };

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;
      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        if (character === '"') {
          if (quoted && text[index + 1] === '"') {
            value += '"';
            index += 1;
          } else {
            quoted = !quoted;
          }
        } else if (character === "," && !quoted) {
          row.push(value);
          value = "";
        } else if ((character === "\n" || character === "\r") && !quoted) {
          if (character === "\r" && text[index + 1] === "\n") index += 1;
          row.push(value);
          if (row.some(cell => cell.trim())) rows.push(row);
          row = [];
          value = "";
        } else {
          value += character;
        }
      }
      if (value || row.length) {
        row.push(value);
        rows.push(row);
      }
      return rows;
    }

    function normalizeWalkNumber(value) {
      const walk = String(value || "").trim();
      if (walk === "0" || walk.toUpperCase() === "DE" || walk.toUpperCase().includes("SOUTH")) {
        return "11";
      }
      return walk;
    }

    const tbody = document.getElementById("walks-tbody");
    const walksSummary = document.getElementById("walks-summary");
    const shuttleworthTotals = document.getElementById("shuttleworth-totals");

    function renderError(message) {
      walksSummary.textContent = message;
      const row = document.createElement("tr");
      const cell = document.createElement("td");
      cell.colSpan = 6;
      cell.textContent = message;
      cell.style.cssText = "padding:0.75rem;color:#a31f16;";
      row.appendChild(cell);
      tbody.replaceChildren(row);
    }

    async function loadWalks() {
      const [mappingResponse, walkConfigResponse] = await Promise.all([
        fetch(MAPPING_SHEET_CSV_URL),
        fetch(WALK_CONFIG_URL)
      ]);
      if (!mappingResponse.ok) {
        throw new Error("Could not load Pwllheli walk data.");
      }
      if (!walkConfigResponse.ok) {
        throw new Error("Could not load the walk descriptions.");
      }

      const mappingRows = parseCsv(await mappingResponse.text());
      const walkConfig = await walkConfigResponse.json();
      const headers = mappingRows[0].map(header => header.trim().toUpperCase());
      const districtIndex = headers.indexOf("POLLING DISTRICT");
      const electorIdIndex = headers.indexOf("ELECTOR ID");
      const walkIndex = headers.indexOf("WALK");
      const uprnIndex = headers.indexOf("UPRN");
      const electorsIndex = headers.lastIndexOf("ELECTORS");
      const shuttleworthIndex = headers.indexOf("SHUTTLEWORTH");
      const householdSizeIndex = headers.indexOf("HOUSEHOLD SIZE");
      const addressIndexes = ["ADDRESS LINE 1", "ADDRESS LINE 2", "ADDRESS LINE 3", "POSTCODE"]
        .map(header => headers.indexOf(header));
      if ([districtIndex, electorIdIndex, walkIndex, uprnIndex, shuttleworthIndex]
            .some(index => index < 0) ||
          addressIndexes.some(index => index < 0)) {
        throw new Error("The Pwllheli mapping data is missing required columns.");
      }

      const walksByKey = new Map();
      mappingRows.slice(1).forEach(row => {
        const district = String(row[districtIndex] || "").trim().toUpperCase();
        const walk = normalizeWalkNumber(row[walkIndex]);
        const electorId = String(row[electorIdIndex] || "").trim();
        if (!DISTRICT_LABELS[district] ||
            EXCLUDED_ELECTOR_IDS.has(electorId) ||
            PHANTOM_WALKS.has(walk) ||
            (district === "JB1" && (!/^\d+$/.test(walk) || Number(walk) < 11 || Number(walk) > 17))) {
          return;
        }

        const key = district + "-" + walk;
        if (!walksByKey.has(key)) {
          walksByKey.set(key, {
            district,
            walk,
            households: new Set(),
            electors: 0,
            shuttleworth: 0
          });
        }
        const walkStats = walksByKey.get(key);
        const electors = Number(row[electorsIndex] || row[householdSizeIndex] || 1);
        walkStats.electors += Number.isFinite(electors) ? electors : 1;
        const shuttleworth = Number(row[shuttleworthIndex] || 0);
        walkStats.shuttleworth += Number.isFinite(shuttleworth) ? shuttleworth : 0;
        const householdParts = addressIndexes.map(index => String(row[index] || "").trim().toUpperCase());
        const householdKey = String(row[uprnIndex] || "").trim() ||
          householdParts.filter(Boolean).join("|") || electorId;
        walkStats.households.add(householdKey);
      });

      const walks = Array.from(walksByKey.values()).sort((left, right) =>
        (left.district === "JB1" ? 0 : 1) - (right.district === "JB1" ? 0 : 1) ||
        Number(left.walk) - Number(right.walk) ||
        left.walk.localeCompare(right.walk)
      );
      if (!walks.length) {
        throw new Error("No JA1 or JB1 Pwllheli walks were found.");
      }

      const districtCounts = new Map();
      walks.forEach(({ district }) =>
        districtCounts.set(district, (districtCounts.get(district) || 0) + 1)
      );
      walksSummary.textContent = walks.length + " walks (South " +
        (districtCounts.get("JB1") || 0) + ", North " +
        (districtCounts.get("JA1") || 0) + ")";
      const shuttleworthByDistrict = walks.reduce((totals, walk) => {
        totals[walk.district] += walk.shuttleworth;
        totals[walk.district + "Target"] +=
          TARGET_SHUTTLEWORTH_BY_WALK[walk.district + "-" + walk.walk] || 0;
        return totals;
      }, { JA1: 0, JB1: 0, JA1Target: 0, JB1Target: 0 });
      shuttleworthTotals.textContent =
        "Total Shuttleworth — North: " + shuttleworthByDistrict.JA1 + " (" +
        (shuttleworthByDistrict.JA1 / shuttleworthByDistrict.JA1Target * 100).toFixed(1) +
        "%), South: " + shuttleworthByDistrict.JB1 + " (" +
        (shuttleworthByDistrict.JB1 / shuttleworthByDistrict.JB1Target * 100).toFixed(1) +
        "%)";

      let currentDistrict = "";
      walks.forEach(({ district, walk, households, electors, shuttleworth }) => {
        if (district !== currentDistrict) {
          const groupRow = document.createElement("tr");
          const groupHeading = document.createElement("th");
          groupHeading.colSpan = 6;
          groupHeading.textContent = DISTRICT_LABELS[district];
          groupHeading.style.cssText =
            "padding:0.6rem;background:#f3f4f6;color:var(--plaid-green);text-align:left;";
          groupRow.appendChild(groupHeading);
          tbody.appendChild(groupRow);
          currentDistrict = district;
        }

        const row = document.createElement("tr");
        const description = walkConfig[walk] && walkConfig[walk].description || "Walk " + walk;
        [
          district,
          walk,
          description,
          String(households.size),
          String(electors),
          "Chris Green"
        ].forEach((value, index) => {
          const cell = document.createElement("td");
          cell.textContent = value;
          cell.style.cssText =
            "padding:0.45rem 0.6rem;border-bottom:1px solid #e5e7eb;vertical-align:middle;" +
            ([0, 1, 3].includes(index) ? "text-align:center;" : "");
          row.appendChild(cell);
        });
        tbody.appendChild(row);
      });
    }

    loadWalks().catch(error => {
      console.error("Could not load Pwllheli deliverer walks:", error);
      renderError(error.message);
    });
  </script>
</body>
</html>
