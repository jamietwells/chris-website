<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Confirm Bet | 326</title>
  <link rel="icon" href="/326/icon.svg" type="image/svg+xml">
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #142338;
      background: #f5f7fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #f5f7fa;
    }

    .site-header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 2rem;
      border-bottom: 1px solid #273b55;
      background: #142338;
      color: #fff;
    }

    .wordmark {
      color: inherit;
      font-size: 1.35rem;
      font-weight: 750;
      letter-spacing: -0.06em;
      text-decoration: none;
    }

    .wordmark::first-letter {
      color: #47d3b1;
    }

    main {
      width: min(100% - 2rem, 640px);
      margin: 0 auto;
      padding: 3rem 0;
    }

    .site-footer {
      width: min(100% - 2rem, 640px);
      margin: 0 auto;
      padding: 0 0 2rem;
      color: #627187;
      font-size: 0.75rem;
      line-height: 1.5;
    }

    .confirmation {
      overflow: hidden;
      border: 1px solid #dbe2ea;
      border-radius: 0.5rem;
      background: #fff;
      box-shadow: 0 1px 2px rgb(20 35 56 / 4%);
    }

    .confirmation header,
    .confirmation-body {
      padding: 1.5rem;
    }

    .confirmation header {
      border-bottom: 1px solid #e6ebf0;
    }

    .eyebrow {
      margin: 0 0 0.35rem;
      color: #627187;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }

    dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.85rem 1.5rem;
      margin: 0;
    }

    dt {
      color: #627187;
      font-size: 0.8rem;
      font-weight: 700;
    }

    dd {
      margin: 0;
      font-weight: 750;
      text-align: right;
    }

    .customer-details {
      display: grid;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e6ebf0;
    }

    .customer-details h2 {
      margin: 0;
      font-size: 1rem;
    }

    .field {
      display: grid;
      gap: 0.4rem;
    }

    label {
      color: #627187;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    input,
    textarea {
      width: 100%;
      padding: 0.7rem 0.75rem;
      border: 1px solid #b9c4d0;
      border-radius: 0.35rem;
      background: #fff;
      color: #142338;
      font: inherit;
    }

    textarea {
      height: 2.8rem;
      resize: none;
    }

    input:focus,
    textarea:focus {
      border-color: #278c77;
      outline: 3px solid rgb(71 211 177 / 25%);
    }

    .propose-bet {
      min-width: 9rem;
      padding: 0.7rem 1rem;
      border: 1px solid #278c77;
      border-radius: 0.35rem;
      background: #278c77;
      color: #fff;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 750;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .propose-bet:hover,
    .propose-bet:focus-visible {
      border-color: #1e6c5d;
      background: #1e6c5d;
    }

    .propose-bet:focus-visible {
      outline: 3px solid rgb(71 211 177 / 45%);
      outline-offset: 2px;
    }

    .payment-status {
      min-height: 1rem;
      margin: 0;
      color: #627187;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .proposal-notice {
      margin: -0.25rem 0 0;
      color: #627187;
      font-size: 0.75rem;
      line-height: 1.5;
    }

    @media (max-width: 560px) {
      .site-header {
        height: 56px;
        padding: 0 1.25rem;
      }

      main {
        width: min(100% - 1.5rem, 640px);
        padding: 1.5rem 0;
      }

      .site-footer {
        width: min(100% - 1.5rem, 640px);
      }

      .confirmation header,
      .confirmation-body {
        padding: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/326/" aria-label="326 home">326</a>
  </header>
  <main>
    <section class="confirmation" aria-labelledby="confirmation-title">
      <header>
        <p class="eyebrow">Bet confirmation</p>
        <h1 id="confirmation-title">Review your selection</h1>
      </header>
      <div class="confirmation-body">
        <dl>
          <dt>Market</dt>
          <dd id="market"></dd>
          <dt>Selection</dt>
          <dd id="party"></dd>
          <dt>Odds</dt>
          <dd id="odds"></dd>
          <dt>Stake</dt>
          <dd id="stake"></dd>
        </dl>
        <form class="customer-details">
          <h2>Your details</h2>
          <div class="field">
            <label for="full-name">Full Name</label>
            <input id="full-name" name="full-name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="address">Address</label>
            <textarea id="address" name="address" autocomplete="street-address" required></textarea>
          </div>
          <div class="field">
            <label for="postcode">Postcode</label>
            <input id="postcode" name="postcode" type="text" autocomplete="postal-code" required>
          </div>
          <div class="field">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="confirm-email">Confirm Email Address</label>
            <input id="confirm-email" name="confirm-email" type="email" autocomplete="email" required>
          </div>
          <button id="propose-bet" class="propose-bet" type="submit">Propose Bet</button>
          <p class="proposal-notice">Your bet is not confirmed until matched and accepted.</p>
          <p id="payment-status" class="payment-status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    326 Political Betting (United Kingdom), 50/5 Bulevar Revolucije, Podgorica 81000, Montenegro
  </footer>
  <script>
    const parameters = new URLSearchParams(window.location.search);
    const party = parameters.get("party") || "No selection";
    const fractional = parameters.get("fractional") || "—";
    const decimal = Number(parameters.get("decimal"));
    const stake = Number(parameters.get("stake"));
    const currency = parameters.get("currency");
    const gbpStake = Number(parameters.get("gbpStake"));
    const constituency = parameters.get("constituency") || "";
    const suppliedMarket = parameters.get("market") || "";
    const isByElection = suppliedMarket !== "";
    const form = document.querySelector(".customer-details");
    const proposeBetButton = document.getElementById("propose-bet");
    const paymentStatus = document.getElementById("payment-status");
    const emailInput = document.getElementById("email");
    const confirmEmailInput = document.getElementById("confirm-email");
    const stakeInGbp = currency === "btc" ? gbpStake : stake;
    const hasValidByElectionStake = !isByElection || (
      currency === "gbp" &&
      Number.isInteger(stake) &&
      stake >= 10 &&
      stake <= 29500
    );
    const market = suppliedMarket || (constituency
      ? "Winner: " + constituency
      : "Next United Kingdom General Election: Most Seats");
    const selection = suppliedMarket ? "Winner: " + party : party;
    const PROPOSAL_FORM_URL = "https://tendring-dp.twells-tet.workers.dev/proposal";

    document.getElementById("market").textContent = market;
    document.getElementById("party").textContent = selection;
    document.getElementById("odds").textContent = Number.isFinite(decimal)
      ? fractional + " (" + decimal.toFixed(2) + ")"
      : fractional;
    document.getElementById("stake").textContent = Number.isFinite(stake)
      ? currency === "btc"
        ? stake.toFixed(7) + " BTC"
        : new Intl.NumberFormat("en-GB", { style: "currency", currency: "GBP" }).format(stake)
      : "—";
    if (!hasValidByElectionStake) {
      proposeBetButton.disabled = true;
      paymentStatus.textContent = "By-election stakes must be whole pounds between £10 and £29,500.";
    }

    function validateEmailConfirmation() {
      const emailAddressesMatch = emailInput.value === confirmEmailInput.value;
      confirmEmailInput.setCustomValidity(
        emailAddressesMatch ? "" : "Email addresses do not match."
      );
      return emailAddressesMatch;
    }

    emailInput.addEventListener("input", validateEmailConfirmation);
    confirmEmailInput.addEventListener("input", validateEmailConfirmation);

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!hasValidByElectionStake) {
        paymentStatus.textContent = "By-election stakes must be whole pounds between £10 and £29,500.";
        return;
      }
      if (!validateEmailConfirmation() || !form.reportValidity()) return;

      proposeBetButton.disabled = true;
      paymentStatus.textContent = "Sending your proposal...";
      try {
        const response = await fetch(PROPOSAL_FORM_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            tendring: "yes",
            name: document.getElementById("full-name").value.trim(),
            address: document.getElementById("address").value.trim(),
            postcode: document.getElementById("postcode").value.trim().toUpperCase(),
            email: document.getElementById("email").value.trim(),
            proposal_type: "326 election market bet",
            market,
            selection,
            odds: fractional + " (" + decimal.toFixed(2) + ")",
            stake: document.getElementById("stake").textContent,
            gbp_equivalent: new Intl.NumberFormat("en-GB", {
              style: "currency",
              currency: "GBP"
            }).format(stakeInGbp)
          })
        });
        const responseText = await response.text();
        let result;
        try {
          result = JSON.parse(responseText);
        } catch {
          throw new Error("The proposal service returned an unexpected response.");
        }
        if (!response.ok || !result.success) {
          throw new Error(result.error || "The proposal could not be sent.");
        }
        paymentStatus.textContent = "Thank you. Your proposal has been sent.";
        form.reset();
      } catch (error) {
        paymentStatus.textContent = error.message || "Service unavailable. Please try again later.";
        proposeBetButton.disabled = false;
      }
    });
  </script>
</body>
</html>
