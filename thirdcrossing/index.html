    /* Top Facebook Icon (Above Language Toggle) */
    .top-social-header {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;

    .top-facebook-icon {
      display: inline-flex;
      align-items: center;

      color: #ffffff;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .top-facebook-icon:hover {

    /* Language Toggle Container */
    .lang-toggle {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 20px;
      position: relative;
    }

    .lang-toggle button {
      background: transparent;
      color: #ffffff;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      padding: 10px 20px;
      border: 2px solid #ffffff;
      cursor: pointer;
    }

    .lang-toggle button.active {
      background: #ffffff;
      color: #0a1a3e;
    }

    .lang-toggle button:not(:last-child) {
      border-right: none;

    /* Coming Soon Popout */
    .coming-soon {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      color: #0a1a3e;
      padding: 12px 20px;

      font-weight: 900;

      border-radius: 3px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      z-index: 20;
    }

    .coming-soon[hidden] {
      display: none !important;
    }

    .coming-soon::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 12px;
      height: 12px;
      background: #ffffff;
    }
