<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pwllheli Business Improvement District (BID)</title>
  <meta name="description" content="Should Pwllheli have a Business Improvement District? Leave a comment and tell us what you think.">
  <meta name="theme-color" content="#0a1a3e">
  <link rel="icon" href="https://threetwosix.co.uk/thirdcrossing/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Language Toggle Container */
    .lang-toggle {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 20px;
      position: relative;
    }

    .lang-toggle button {
      background: transparent;
      color: #ffffff;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      padding: 10px 20px;
      border: 2px solid #ffffff;
      cursor: pointer;
    }

    .lang-toggle button.active {
      background: #ffffff;
      color: #0a1a3e;
    }

    .lang-toggle button:not(:last-child) {
      border-right: none;
    }

    /* Coming Soon Popout */
    .coming-soon {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      color: #0a1a3e;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      white-space: nowrap;
      border-radius: 3px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      z-index: 20;
    }

    .coming-soon::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 12px;
      height: 12px;
      background: #ffffff;
    }

    .pwllheli-tag {
      color: #ffffff;
      border-color: #ffffff;
      font-size: 17px;
      padding: 12px 18px;
    }

    /* Elephant - 65% larger and moved upwards */
    .pwllheli-icon {
      display: block;
      width: 275px;
      height: 275px;
      margin: -5px auto 5px auto;
    }

    .pwllheli-hero-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    /* Equal-sized buttons */
    .pwllheli-hero-actions .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 220px;
      min-height: 58px;
      padding: 12px 20px;
      background: #1c3b7c;
      border: 2px solid #1c3b7c;
      color: #ffffff;
      box-sizing: border-box;
      text-align: center;
    }

    .content-spacing {
      padding-top: 2rem;
      padding-bottom: 3rem;
    }

    .hero-spacing {
      margin-top: 0;
    }

    #campaign-heading {
      white-space: normal;
    }

    #campaign-heading .red {
      color: #e21d2f;
    }

    #campaign-heading .white {
      color: #ffffff;
    }
  </style>
</head>

<body>
  <main>

    <section class="hero">
      <div class="container">

        <!-- Language Toggle -->
        <div class="lang-toggle">
          <button type="button" id="lang-cy">CYMRAEG</button>
          <button type="button" id="lang-en" class="active">ENGLISH</button>
        </div>

        <div id="campaign-name" class="tag pwllheli-tag">
          PWLLHELI BUSINESS IMPROVEMENT DISTRICT
        </div>

        <!-- Larger SVG, moved upwards -->
        <img src="icon-bid.svg" alt="" class="pwllheli-icon">

        <h1 id="campaign-heading">
          <span class="white">SHOULD</span><br>
          <span class="red">PWLLHELI</span><br>
          <span class="white">HAVE A BID?</span>
        </h1>

        <p id="campaign-introduction" class="lead">
          We are exploring whether local residents and businesses would support
          establishing a Business Improvement District in Pwllheli.
        </p>

<div class="buttons pwllheli-hero-actions">
<a href="https://threetwosix.co.uk/comments/" class="btn primary">
  LEAVE A COMMENT
  </a>
<a href="https://threetwosix.co.uk/about/" class="btn primary">
  WHAT IS A BID?
          </a>
        </div>

      </div>
    </section>

  </main>
  <footer>
  <span style="font-size: 10px;">
    PWLLHELI BID (2026)
  </span>
</footer>
  <script>
    const cymraegButton = document.getElementById('lang-cy');

    cymraegButton.addEventListener('click', function () {
      const existingPopup = document.querySelector('.coming-soon');

      if (existingPopup) {
        existingPopup.remove();
        return;
      }

      const popup = document.createElement('div');
      popup.className = 'coming-soon';
      popup.textContent = 'Bydd cyfieithiad i'r Gymraeg ar gael yn fuan iawn. Diolch.';

      document.querySelector('.lang-toggle').appendChild(popup);

      setTimeout(() => {
        popup.remove();
      }, 3000);
    });
  </script>

</body>
</html>
