<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pwllheli Business Improvement District (BID)</title>
  <meta name="description" content="Should Pwllheli have a Business Improvement District? Leave a comment and tell us what you think.">
  <meta name="theme-color" content="#0a1a3e">
  <link rel="icon" href="https://threetwosix.co.uk/thirdcrossing/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Language Toggle Container */
    .lang-toggle {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 12px;
      position: relative;
    }

    .lang-toggle button {
      background: transparent;
      color: #ffffff;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      padding: 10px 20px;
      border: 2px solid #ffffff;
      cursor: pointer;
    }

    .lang-toggle button.active {
      background: #ffffff;
      color: #0a1a3e;
    }

    .lang-toggle button:not(:last-child) {
      border-right: none;
    }

    /* Top Social Link (Under Language Toggle) */
    .top-social-links {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .top-facebook-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 4px;
      transition: opacity 0.2s ease;
    }

    .top-facebook-btn:hover {
      opacity: 0.85;
      text-decoration: underline;
    }

    /* Coming Soon Popout */
    .coming-soon {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      color: #0a1a3e;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      white-space: nowrap;
      border-radius: 3px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      z-index: 20;
    }

    .coming-soon[hidden] {
      display: none !important;
    }

    .coming-soon::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 12px;
      height: 12px;
      background: #ffffff;
    }

    /* Campaign Introduction Styling - Larger Font Sizes */
    .campaign-card {
      max-width: 800px;
      margin: 25px auto;
      text-align: center;
    }

    .campaign-lead {
      font-size: clamp(1.15rem, 2.5vw, 1.45rem);
      font-weight: 700;
      line-height: 1.5;
      color: #ffffff;
      margin-bottom: 1rem;
    }

    .campaign-highlight {
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 1.5rem;
    }

    .divider {
      border: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      margin: 1.25rem auto;
      max-width: 80%;
    }

    .case-study-link {
      color: #ffffff;
      text-decoration: underline;
      font-size: 1.05rem;
      transition: opacity 0.2s ease;
    }

    .case-study-link:hover {
      opacity: 0.85;
    }

    /* Pwllheli Tag / Title Box */
    .pwllheli-tag {
      color: #ffffff;
      border: 2px solid #ffffff;
      padding: 14px 20px;
      display: inline-block;
      text-align: center;
      max-width: 100%;
      box-sizing: border-box;
    }

    /* Cymraeg - forced single line with responsive fluid scaling */
    .welsh-title {
      font-size: clamp(13px, 4.2vw, 20px);
      font-weight: 900;
      text-align: justify;
      text-align-last: justify;
      white-space: nowrap;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    /* English - forced single line scaled to match the Welsh width */
    .english-title {
      font-size: clamp(9.5px, 3.1vw, 14.5px);
      font-weight: 900;
      text-align: justify;
      text-align-last: justify;
      white-space: nowrap;
      line-height: 1.2;
    }

    /* Elephant - 65% larger and moved upwards */
    .pwllheli-icon {
      display: block;
      width: 275px;
      height: 275px;
      margin: -5px auto 5px auto;
    }

    .pwllheli-hero-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    /* Equal-sized buttons */
    .pwllheli-hero-actions .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 220px;
      min-height: 58px;
      padding: 12px 20px;
      background: #e21d2f;
      border: 2px solid #e21d2f;
      color: #ffffff;
      box-sizing: border-box;
      text-align: center;
    }

    .content-spacing {
      padding-top: 2rem;
      padding-bottom: 3rem;
    }

    .hero-spacing {
      margin-top: 0;
    }

    #campaign-heading {
      white-space: normal;
    }

    #campaign-heading .red {
      color: #e21d2f;
    }

    #campaign-heading .white {
      color: #ffffff;
    }

    /* BID Vote Section */
    .bid-vote-section {
      background: #f4f4f4;
      padding: 70px 20px;
      border-top: 1px solid #ddd;
    }

    .bid-vote-container {
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
    }

    .bid-vote-tag {
      display: inline-block;
      background: #0a1a3e;
      color: #ffffff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 9px 16px;
      margin-bottom: 18px;
    }

    .bid-vote-container h2 {
      margin: 0 0 15px;
      color: #0a1a3e;
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 900;
      line-height: 1.05;
    }

    .bid-vote-intro {
      margin: 0 auto 30px;
      color: #333;
      font-size: 16px;
      line-height: 1.6;
    }

    .role-selector-group {
      margin: 0 auto 24px;
      text-align: left;
      max-width: 460px;
    }

    .role-selector-title {
      color: #0a1a3e;
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 12px;
      text-align: center;
    }

    .role-checkboxes {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .human-check {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      padding: 10px 14px;
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 4px;
      color: #0a1a3e;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .human-check input {
      width: 20px;
      height: 20px;
      accent-color: #0a1a3e;
      cursor: pointer;
    }

    .bid-vote-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .bid-vote-btn {
      flex: 1;
      min-height: 60px;
      border: 2px solid;
      font-family: inherit;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .bid-vote-btn.yes {
      background: #0a1a3e;
      border-color: #0a1a3e;
      color: #ffffff;
    }

    .bid-vote-btn.no {
      background: #e21d2f;
      border-color: #e21d2f;
      color: #ffffff;
    }

    .bid-vote-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    /* RESULT */
    .bid-vote-result {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #ddd;
    }

    .result-title {
      margin-bottom: 15px;
      color: #0a1a3e;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .result-bar {
      display: flex;
      width: 100%;
      height: 58px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .result-yes,
    .result-no {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      transition: width 0.5s ease;
    }

    .result-yes {
      background: #0a1a3e;
    }

    .result-no {
      background: #e21d2f;
    }

    .result-numbers {
      display: flex;
      justify-content: space-between;
      color: #0a1a3e;
      font-size: 24px;
      font-weight: 900;
    }

    .result-numbers strong {
      font-size: 24px;
      font-weight: 900;
    }

    .result-thanks {
      margin: 25px 0 0;
      font-size: 14px;
    }

    .result-thanks a {
      color: #0a1a3e;
      font-weight: 700;
      text-decoration: underline;
    }

    .result-thanks a:hover {
      opacity: 0.75;
    }

    /* Footer */
    .site-footer {
      font-size: 11px;
      text-align: center;
      padding: 24px 20px;
      color: #ffffff;
      background: #0a1a3e;
      letter-spacing: 0.5px;
      line-height: 1.6;
    }

    .site-footer a {
      color: #ffffff;
      text-decoration: underline;
    }

    .site-footer a:hover {
      opacity: 0.8;
    }

    .footer-contact {
      margin-top: 6px;
    }

    .pwllheli-bid-ideas-section {
      max-width: 1000px;
      margin: 40px auto
