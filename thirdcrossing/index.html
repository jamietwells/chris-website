<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pwllheli Business Improvement District (BID)</title>
  <meta name="description" content="Should Pwllheli have a Business Improvement District? Leave a comment and tell us what you think.">
  <meta name="theme-color" content="#0a1a3e">
  <link rel="icon" href="/thirdcrossing/icon-bid.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Language Toggle Container */
    .lang-toggle {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 20px;
    }

    .lang-toggle button {
      background: transparent;
      color: #ffffff;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      padding: 10px 20px;
      border: 2px solid #ffffff;
      cursor: pointer;
    }

    .lang-toggle button.active {
      background: #ffffff;
      color: #0a1a3e;
    }

    .lang-toggle button:not(:last-child) {
      border-right: none;
    }

    .pwllheli-tag {
      color: #ffffff;
      border-color: #ffffff;
      font-size: 17px;
      padding: 12px 18px;
    }

    .pwllheli-icon {
      display: block;
      width: 110px;
      height: 110px;
      margin: 15px auto 15px auto; /* Increased size & reduced gap to header */
    }

    .pwllheli-hero-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .pwllheli-hero-actions .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1c3b7c;
      border: 2px solid #1c3b7c;
      color: #ffffff;
      box-sizing: border-box;
      text-align: center;
    }

    .content-spacing {
      padding-top: 2rem;
      padding-bottom: 3rem;
    }

    .hero-spacing {
      margin-top: 0;
    }

    #campaign-heading {
      white-space: nowrap;
    }

    #campaign-heading .red {
      color: #e21d2f;
    }

    #campaign-heading .white {
      color: #ffffff;
      font-size: 0.9em; /* Increased size to match the red text width above */
    }
  </style>
</head>

<body>
  <main>

    <section class="hero">
      <div class="container">

        <!-- 4. Language Toggle Button -->
        <div class="lang-toggle">
          <button type="button" id="lang-cy">CYMRAEG</button>
          <button type="button" id="lang-en" class="active">ENGLISH</button>
        </div>

        <div id="campaign-name" class="tag pwllheli-tag">
          PWLLHELI BUSINESS IMPROVEMENT DISTRICT
        </div>

        <!-- 2. Larger SVG & moved up -->
        <img
          src="/thirdcrossing/icon-bid.svg"
          alt=""
          class="pwllheli-icon"
        >

        <h1 id="campaign-heading">
          <!-- 1. White text increased in size -->
          <span class="red">SHOULD PWLLHELI</span><br>
          <span class="white">HAVE A BID?</span>
        </h1>

        <p id="campaign-introduction" class="lead">
          We are exploring whether local residents and businesses would support
          establishing a Business Improvement District in Pwllheli.
        </p>

        <div class="buttons pwllheli-hero-actions">
          <a href="https://threetwosix.co.uk/comments/" class="btn primary">
            LEAVE A COMMENT
          </a>
          <!-- 3. Second button added -->
          <a href="#what-is-a-bid" class="btn primary">
            WHAT IS A BID
          </a>
        </div>

      </div>
    </section>

  </main>

  <footer>
    <span>
      Pwllheli BID (2026)
    </span>
  </footer>

</body>
</html>
