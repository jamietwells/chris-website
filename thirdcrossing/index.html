<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pwllheli Business Improvement District (BID)</title>
  <meta name="description" content="Should Pwllheli have a Business Improvement District? Leave a comment and tell us what you think.">
  <meta name="theme-color" content="#0a1a3e">
  <link rel="icon" href="/thirdcrossing/icon-bid.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    .pwllheli-tag {
      color: #ffffff;
      border-color: #ffffff;
      font-size: 17px;
      padding: 12px 18px;
    }

    .pwllheli-icon {
      display: block;
      width: 90px;
      height: 90px;
      margin: 30px auto;
    }

    .pwllheli-hero-actions .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1c3b7c;
      border: 2px solid #1c3b7c;
      color: #ffffff;
      box-sizing: border-box;
      text-align: center;
    }

    .content-spacing {
      padding-top: 2rem;
      padding-bottom: 3rem;
    }

    .hero-spacing {
      margin-top: 0;
    }

    #campaign-heading {
      white-space: nowrap;
    }

    #campaign-heading .red {
      color: #e21d2f;
    }

    #campaign-heading .white {
      color: #ffffff;
    }
  </style>
</head>

<body>
  <main>

    <section class="hero">
      <div class="container">

        <div id="campaign-name" class="tag pwllheli-tag">
          PWLLHELI BUSINESS IMPROVEMENT DISTRICT
        </div>

        <img
          src="/thirdcrossing/icon-bid.svg"
          alt=""
          class="pwllheli-icon"
        >

        <h1 id="campaign-heading">
          <span class="red">SHOULD PWLLHELI</span><br>
          <span class="white">HAVE A BID?</span>
        </h1>

        <p id="campaign-introduction" class="lead">
          We are exploring whether local residents and businesses would support
          establishing a Business Improvement District in Pwllheli.
        </p>

        <div class="buttons pwllheli-hero-actions">
          <a href="https://threetwosix.co.uk/comments/" class="btn primary">
            LEAVE A COMMENT
          </a>
        </div>

      </div>
    </section>

  </main>

  <footer>
    <span>
      Pwllheli BID (2026)
    </span>
  </footer>

</body>
</html>
